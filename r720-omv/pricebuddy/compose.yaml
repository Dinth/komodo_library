x-versions:
  pricebuddy: &pricebuddy-version "jez500/pricebuddy:v1.0.57"
  # Official image: linuxserver/mariadb stops at 11.8. 12.3 is the current LTS
  # (EOL June 2029); MARIADB_AUTO_UPGRADE below runs mariadb-upgrade itself.
  mariadb: &mariadb-version "mariadb:12.3.3"
  scraper: &scraper-version "jez500/seleniumbase-scrapper:v1.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  pricebuddy:
    image: *pricebuddy-version
    # TEMPORARY start-time patches to the laravel/ai Ollama gateway, applied
    # before the stock entrypoint. Both are idempotent; on an anchor miss each
    # logs a WARNING and that patch is skipped. Setting entrypoint clears the
    # image CMD, hence the explicit /start-app.sh. Revert: delete this block
    # (and the ollama-tools-format.php mount).
    # - think: the gateway never sends `think`, and providerOptions are merged
    #   into `options` rather than the top level, so not even config can switch
    #   gemma4 reasoning off; every AI call reasons first. Adds
    #   'think' => false to buildChatRequestBody(), the single place
    #   chat/stream request bodies are built. Ollama accepts think:false on
    #   non-reasoning models too.
    # - tools+format: the gateway sends the output schema together with the
    #   tools, so Ollama never lets the model call a tool and the AI healer
    #   guesses selectors blind. Attaches ollama-tools-format.php (see its
    #   header) as middleware on the gateway's HTTP client. Benchmarked
    #   2026-10-27 with gemma4:12b-32k: 3/5 real pages healed correctly,
    #   0/5 unpatched (unpatched it never fetches the page).
    entrypoint:
      - /bin/sh
      - -c
      - |
        f=/app/vendor/laravel/ai/src/Gateway/Ollama/Concerns/BuildsTextRequests.php
        if grep -qF "'think' => false," "$$f"; then
          echo "think patch: already patched"
        elif [ "$$(grep -cF "'stream' => " "$$f")" = 1 ]; then
          sed -i "s/'stream' => /'think' => false, 'stream' => /" "$$f"
          echo "think patch: patched"
        else
          echo "WARNING: think patch anchor not found - running UNPATCHED"
        fi
        f=/app/vendor/laravel/ai/src/Gateway/Ollama/Concerns/CreatesOllamaClient.php
        if grep -qF "ollama-tools-format.php" "$$f"; then
          echo "tools+format patch: already patched"
        elif [ "$$(grep -cF -e "->throw();" "$$f")" = 1 ]; then
          sed -i "s|->throw();|->throw()->withMiddleware(require '/opt/pricebuddy-patches/ollama-tools-format.php');|" "$$f"
          echo "tools+format patch: patched"
        else
          echo "WARNING: tools+format patch anchor not found - running UNPATCHED"
        fi
        exec docker-php-entrypoint /start-app.sh
    container_name: pricebuddy
    hostname: pricebuddy
    ipc: private
    restart: unless-stopped
    # Trimmed from the full 14-cap default set, which alongside cap_drop: ALL
    # granted back everything it had just dropped — hardening in appearance
    # only. What this image actually needs: NET_BIND_SERVICE to bind :80,
    # SETUID/SETGID for supervisor to drop apache workers to www-data, and
    # CHOWN/FOWNER/DAC_OVERRIDE for the `chmod -R 777 storage` that
    # start-app.sh runs against the bind mount. KILL stays because supervisor
    # signals children that are no longer running as root.
    # Dropped: AUDIT_WRITE FSETID MKNOD NET_RAW SETFCAP SETPCAP SYS_CHROOT.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      # /app/.env is neither baked into the image nor on a volume — only
      # /app/storage is persisted — so start-app.sh regenerates it with a fresh
      # `key:generate --force` every time the container is RECREATED (a plain
      # restart keeps it). A rotated APP_KEY logs every session out and makes
      # anything Laravel encrypted in the DB undecryptable. Passing it in as an
      # env var pins it: Laravel's dotenv is immutable, so a real environment
      # variable wins over the generated .env, and config:cache bakes this one.
      APP_KEY: "${PRICEBUDDY_APP_KEY}"
      DB_HOST: "pricebuddy-mariadb"
      DB_USERNAME: "pricebuddy"
      DB_PASSWORD: "${PRICEBUDDY_DB_PASS}"
      DB_DATABASE: "pricebuddy"
      APP_USER_EMAIL: "${ADMIN_EMAIL}"
      APP_USER_PASSWORD: "${PRICEBUDDY_ADMIN_PASS}"
      SCRAPER_BASE_URL: "http://pricebuddy-scraper:3000"
      AFFILIATE_ENABLED: "false"
      ASSET_URL: "https://prices.${DOMAIN_NAME}"
      APP_URL: "https://prices.${DOMAIN_NAME}"
    depends_on:
      pricebuddy-mariadb:
        condition: service_healthy
    # The image runs apache, cron and queue-worker under supervisor. Only cron
    # and queue-worker set autorestart=true; [program:apache2] sets neither
    # autorestart nor startretries, so apache gets supervisor's default three
    # attempts and then stays down for good — while the other two keep the
    # container "up" and prices updating. Its supervisor log also defaults to a
    # file rather than stdout, so nothing shows in `docker logs` either.
    # Observed 2026-09-09: recreating pricebuddy-mariadb under a long-running
    # app left :80 refusing connections for several minutes with nothing
    # detecting or acting on it. No -f here on purpose: any HTTP response means
    # apache is alive, so this trips only on a refused connection or a hang,
    # and won't restart-loop on an app-level 4xx/5xx. autoheal restarts (rather
    # than recreates) the container, so /app/.env and APP_KEY survive.
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Boot does migrations, buddy:init-db, five cache builds and
      # regenerate-price-cache before supervisor ever starts apache.
      start_period: 180s
    # No published port. This served :80 in the clear on the LAN, bypassing
    # TLS, letsencrypt and secHeaders@file, in parallel with the Traefik router
    # below. Nothing was found using it.
    volumes:
      - /opt/docker/pricebuddy/pricebuddy_data:/app/storage
      - ./ollama-tools-format.php:/opt/pricebuddy-patches/ollama-tools-format.php:ro
    networks:
      - pricebuddy
      - traefik
      # Joined for egress only — no router, no labels. The AI provider talks to
      # http://ollama:11434, and ollama sits on the openwebui network with no
      # other route in. Same approach as searxng: in-network rather than via a
      # public hostname, so the call skips a WAN hairpin and Traefik's log.
      - openwebui
      # Price-drop and stock notifications reach Signal via apprise, which runs
      # in the signal-rest-api stack and owns this network.
      - signal-rest-api
    logging: *default-logging
    labels:
      # Without this the healthcheck above only reports the problem; autoheal
      # is opt-in, so this is what actually restarts the container and brings
      # apache back.
      autoheal: "true"
      traefik.enable: "true"
      traefik.http.routers.pricebuddy.rule: "Host(`prices.${DOMAIN_NAME}`)"
      traefik.http.routers.pricebuddy.entrypoints: "websecure"
      traefik.http.routers.pricebuddy.tls: "true"
      traefik.http.routers.pricebuddy.tls.certresolver: "letsencrypt"
      traefik.http.routers.pricebuddy.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.pricebuddy.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      # secHeaders' baseline CSP plus what this app needs: the Filament admin UI's Inter font from fonts.bunny.net.
      # Listed before secHeaders@file because the first middleware wins on
      # response headers. Keep the baseline in sync with traefik_dynamic.yml.
      traefik.http.middlewares.pricebuddy-csp.headers.customresponseheaders.Content-Security-Policy: >-
        default-src 'self' blob: data:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:;
        style-src 'self' 'unsafe-inline' blob: data: fonts.bunny.net;
        img-src 'self' blob: data: https:;
        font-src 'self' blob: data: fonts.bunny.net;
        object-src 'none';
        frame-ancestors 'self';
        connect-src 'self' https: wss: blob:;
        form-action 'self';
        media-src 'self' blob: data:;
        worker-src 'self' blob: data:;
        child-src 'self' blob: data:;
        frame-src 'self' blob: data:
      traefik.http.routers.pricebuddy.middlewares: "pricebuddy-csp,secHeaders@file"
      traefik.http.services.pricebuddy.loadbalancer.server.port: "80"
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/jez500/pricebuddy/releases/tag/v$${major}.$${minor}.$${patch}'
      wud.display.name: 'Pricebuddy'
      wud.display.icon: 'sh:pricebuddy'

  pricebuddy-mariadb:
    image: *mariadb-version
    container_name: pricebuddy-mariadb
    hostname: pricebuddy-mariadb
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    # Server settings the old linuxserver custom.cnf had that differ from the
    # official image defaults: READ-COMMITTED (12.x defaults to REPEATABLE
    # READ), the utf8mb4_general_ci server collation and a 256M buffer pool
    # (the data is ~190 MB; the default is 128M). Binary logging is off now:
    # nothing replicates from it, and the old binlogs had grown to 1.5 GB.
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=256M
    environment:
      # Its own secret rather than the app user's. Inert on the existing
      # datadir — the entrypoint only initialises an empty one, and root here
      # authenticates via unix_socket anyway — but it means a rebuild or
      # disaster-recovery re-init gives root a distinct password instead of
      # handing out the application's.
      MYSQL_ROOT_PASSWORD: "${PRICEBUDDY_DB_ADMIN_PASS}"
      MYSQL_DATABASE: "pricebuddy"
      MYSQL_USER: "pricebuddy"
      MYSQL_PASSWORD: "${PRICEBUDDY_DB_PASS}"
      # Runs mariadb-upgrade when the image's major version moves ahead of the
      # datadir (the server refuses to start otherwise) and keeps a dump of
      # the system tables first.
      MARIADB_AUTO_UPGRADE: "1"
      TZ: "${TZ}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      # The datadir of the former linuxserver/mariadb container (its
      # /config/databases); custom.cnf and the binlogs beside it are unused.
      - /opt/docker/pricebuddy/mariadb_data/databases:/var/lib/mysql
    networks:
      - pricebuddy
      - adminer
    logging: *default-logging
    labels:
      # The healthcheck above gates the app through depends_on, but nothing
      # acted on it once running: a database that went unhealthy would just
      # stay that way.
      autoheal: "true"
      wud.display.name: "Pricebuddy - MariaDB"
      wud.display.icon: "sh:pricebuddy"
      wud.watch: "true"
      # Stay on the 12.3 LTS series (EOL June 2029); 13.x is short-lived rolling.
      wud.tag.include: '^12\.3\.\d+$$'
      wud.link.template: 'https://mariadb.com/docs/release-notes/community-server/12.3/$${major}.$${minor}.$${patch}'

  pricebuddy-scraper:
    image: *scraper-version
    container_name: pricebuddy-scraper
    hostname: pricebuddy-scraper
    init: true
    ipc: private
    # Chrome puts renderer shared memory in /dev/shm, and Docker defaults that
    # to 64MB. Exhausting it kills tabs rather than raising an error, which
    # reaches pricebuddy as a page that scraped fine but had no price —
    # indistinguishable from a genuinely price-less listing. Some of the
    # "no price found" results may be this rather than the store's markup.
    shm_size: 1gb
    restart: unless-stopped
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4G
    healthcheck:
      # The API advertises GET /health at startup. Headless-Chrome services
      # wedge rather than exit, and this one had nothing watching it: every
      # product would fail with a cURL error from pricebuddy while docker
      # still reported the container up — the same blind spot that let apache
      # sit dead in the app container.
      test: ["CMD-SHELL", "curl -sS -o /dev/null --max-time 5 http://127.0.0.1:3000/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pricebuddy
    logging: *default-logging
    labels:
      autoheal: "true"
      wud.watch: "true"
      # This image only ever tags two-part versions (v1.0), so the old
      # three-part '^v?\d+\.\d+\.\d+$' matched nothing at all.
      wud.tag.include: '^v\d+\.\d+$$'
      # jez500/seleniumbase-scrapper is an API-compatible reimplementation of
      # amerkurev/scrapper, not a rebuild of it — the old template pointed at
      # upstream's releases, which have nothing to do with this image's tags.
      # jez500's repo cuts tags but publishes no releases, hence /tree/.
      wud.link.template: 'https://github.com/jez500/seleniumbase-scrapper/tree/v$${major}.$${minor}'
      wud.display.name: 'Pricebuddy Scrapper'
      wud.display.icon: 'sh:pricebuddy'

networks:
  pricebuddy:
    name: pricebuddy
    driver: bridge
    external: false
  traefik:
    external: true
  adminer:
    external: true
  # Owned by the openwebui stack (declared there with name/driver), so joined
  # here as external. Deploy order matters only on a cold start: openwebui must
  # have created it first.
  openwebui:
    external: true
  signal-rest-api:
    external: true

x-versions:
  socket-proxy: &socket-proxy-version "wollomatic/socket-proxy:1.13.1"
  wud: &wud-version "getwud/wud:9.1.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  wud-socket-proxy:
    image: *socket-proxy-version
    ipc: private
    command:
      - '-loglevel=info'
      - '-allowfrom=10.10.1.13/32,10.10.1.11/32,10.40.0.10/32,wud'
      - '-listenip=0.0.0.0'
      - '-allowGET=/(v[0-9.]+/)?(containers/.*|images/.*|events|info|version)'
      - '-allowPOST=/(containers/.*|images/.*)'
      - '-allowDELETE=/(containers/.*|images/.*)'
      - '-allowHEAD=/_ping'
      - '-watchdoginterval=1200'
      - '-stoponwatchdog'
      - '-shutdowngracetime=10'
      - '-allowhealthcheck'
    restart: unless-stopped
    read_only: true
    mem_limit: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:${DOCKER_SOCKET_GID}"
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wud
    logging: *default-logging
    ports:
      - "10.10.1.13:2377:2375"
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/wollomatic/socket-proxy/releases/tag/$${major}.$${minor}.$${patch}"
      wud.display.name: 'Docker Socket Proxy - WUD'
      wud.display.icon: 'mdi:connection'

  wud:
    image: *wud-version
    container_name: wud
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      TZ: "${TZ}"
      WUD_WATCHER_R720OMV_HOST: wud-socket-proxy
      WUD_WATCHER_R720OMV_PORT: "2375"
      WUD_WATCHER_R720OMV_WATCHALL: "true"
      WUD_WATCHER_R720OMV_WATCHEVENTS: "false"
      WUD_WATCHER_R720OMV_CRON: '0 1 * * *'
      WUD_WATCHER_R230NIXOS_HOST: 10.10.1.12
      WUD_WATCHER_R230NIXOS_PORT: "2377"
      WUD_WATCHER_R230NIXOS_WATCHALL: "true"
      WUD_WATCHER_R230NIXOS_WATCHEVENTS: "false"
      # Staggered 30 min after r720 so the two scans don't hit the same
      # registries at once; running together caused nightly GHCR/LSCR 429s.
      WUD_WATCHER_R230NIXOS_CRON: '30 1 * * *'
      # Cool-down: only report a release once it has been out for 3 days, so
      # quick follow-up patches (e.g. 9.0.0 -> 9.0.2 within a day) collapse
      # into one notification. Per-container override: wud.watch.delay.
      WUD_WATCHER_R720OMV_DELAY: "3d"
      WUD_WATCHER_R230NIXOS_DELAY: "3d"
      WUD_SERVER_FEATURE_DELETE: "false"
      WUD_LOG_LEVEL: "info"
      # Registry keys are WUD_REGISTRY_<TYPE>_<NAME>_<KEY>; without the NAME
      # segment WUD registers empty registries called "login"/"token" and
      # stays anonymous (100 pulls / 6h instead of 200).
      WUD_REGISTRY_HUB_PUBLIC_LOGIN: "${WUD_DOCKERHUB_USER}"
      WUD_REGISTRY_HUB_PUBLIC_PASSWORD: "${WUD_DOCKERHUB_TOKEN}"
      # GHCR and LSCR (a GHCR front) share one GitHub PAT, so their rate
      # limits stack; one request at a time each keeps the scan under them.
      WUD_REGISTRY_GHCR_PRIVATE_USERNAME: "${ADMIN_EMAIL}"
      WUD_REGISTRY_GHCR_PRIVATE_TOKEN: "${WUD_GHCR_TOKEN}"
      WUD_REGISTRY_GHCR_PRIVATE_CONCURRENCY: "1"
      WUD_REGISTRY_LSCR_PRIVATE_USERNAME: "${ADMIN_EMAIL}"
      WUD_REGISTRY_LSCR_PRIVATE_TOKEN: "${WUD_GHCR_TOKEN}"
      WUD_REGISTRY_LSCR_PRIVATE_CONCURRENCY: "1"
      # Gitea provider, not custom: Gitea's registry needs the /v2/token
      # bearer handshake (anonymous is fine), which custom doesn't do (401).
      WUD_REGISTRY_GITEA_BRICKTRACKER_URL: "https://gitea.baerentsen.space"
      # Signal notification on update via WUD's native Signal trigger (added in
      # 8.4.0). It POSTs the same {message, number, recipients[]} body to
      # signal-cli-rest-api's /v2/send that the previous hand-rolled command
      # trigger built with node + curl, so this is a drop-in replacement. WUD's
      # default simplebody already appends result.link (the changelog URL) when
      # one is resolved, which is what the node script did by hand.
      WUD_TRIGGER_SIGNAL_MAIN_URL: "http://signal-rest-api:8080"
      WUD_TRIGGER_SIGNAL_MAIN_NUMBER: "${SIGNAL_BOT_NUMBER}"
      WUD_TRIGGER_SIGNAL_MAIN_RECIPIENTS: "${SIGNAL_TECH_ID}"
      WUD_TRIGGER_SIGNAL_MAIN_AUTO: "true"
      WUD_AUTH_OIDC_AUTHELIA_DISCOVERY: "https://id.${DOMAIN_NAME}/.well-known/openid-configuration"
      WUD_AUTH_OIDC_AUTHELIA_CLIENTID: "my-wud-client-id"
      WUD_AUTH_OIDC_AUTHELIA_CLIENTSECRET: "${WUD_OIDC_CLIENT_SECRET}"
      WUD_AUTH_OIDC_AUTHELIA_REDIRECT: "true"
      # WUD 9 has mandatory auth with RBAC and refuses to start without an
      # administrator. Members of Authelia's `admins` group get `admin`; anyone
      # else who authenticates falls back to DEFAULTROLE (`ro` by default). WUD
      # appends the `groups` scope itself once a group mapping is set.
      # Deliberately no local admin: a password login would bypass Authelia's
      # 2FA. If OIDC discovery fails at startup, recover over SSH (restart the
      # container) rather than through a break-glass account.
      WUD_AUTH_OIDC_AUTHELIA_ADMINGROUP: "admins"
    healthcheck:
      test: curl --fail http://localhost:3000/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Pin id.* to Traefik on the LAN so WUD's startup OIDC discovery + back-channel
    # token calls never depend on external DNS / NAT-reflection. Without this the
    # discovery fetch fails intermittently on restart and WUD drops the OIDC button,
    # leaving an empty login page (no local login is configured).
    extra_hosts:
      - "id.${DOMAIN_NAME}:10.10.1.13"
    depends_on:
      wud-socket-proxy:
        condition: service_healthy
    volumes:
      - /opt/docker/wud/wud_store:/store
      - /etc/localtime:/etc/localtime:ro
    networks:
      - wud
      - signal-rest-api
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.wud.rule: "Host(`wud.${DOMAIN_NAME}`)"
      traefik.http.routers.wud.entrypoints: "websecure"
      traefik.http.routers.wud.tls: "true"
      traefik.http.routers.wud.tls.certresolver: "letsencrypt"
      traefik.http.routers.wud.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.wud.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.wud.middlewares: "secHeaders@file,lan-only@file"
      traefik.http.services.wud.loadbalancer.server.port: "3000"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/getwud/wud/releases/tag/$${major}.$${minor}.$${patch}"
      wud.display.name: "Whats Up Docker?"
      wud.display.icon: "sh:wud"

networks:
  wud:
    name: wud
    driver: bridge
    external: false
  signal-rest-api:
    external: true
  traefik:
    external: true

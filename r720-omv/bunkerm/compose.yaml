x-versions:
  bunkerm: &bunkerm-version "bunkeriot/bunkerm:v2.1.0"
  mqtt-explorer: &mqtt-explorer-version "smeagolworms4/mqtt-explorer:browser-1.0.3"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mqtt-explorer:
    image: *mqtt-explorer-version
    container_name: mqtt-explorer
    hostname: mqtt-explorer
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No published port: the UI can publish to any MQTT topic (Zigbee devices
    # included) and has no auth of its own configured, so it is reached only
    # as https://mqtt.${DOMAIN_NAME} behind Authelia and lan-only.
    volumes:
      - "/opt/docker/bunkerm/mqtt-explorer_config:/mqtt-explorer/config"
    networks:
      - bunkerm
      - traefik
    logging: *default-logging
    labels:
      autoheal: "true"
      traefik.enable: "true"
      traefik.http.routers.mqtt-explorer.rule: "Host(`mqtt.${DOMAIN_NAME}`)"
      traefik.http.routers.mqtt-explorer.entrypoints: "websecure"
      traefik.http.routers.mqtt-explorer.tls: "true"
      traefik.http.routers.mqtt-explorer.tls.certresolver: "letsencrypt"
      traefik.http.routers.mqtt-explorer.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.mqtt-explorer.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.mqtt-explorer.middlewares: "secHeaders@file,authelia-auth@docker,lan-only@file"
      traefik.http.services.mqtt-explorer.loadbalancer.server.port: "4000"
      wud.watch: "true"
      wud.tag.include: '^browser-\d+\.\d+\.\d+$$'
      wud.display.name: "MQTT Explorer"
      wud.display.icon: "sh-bunkerm"
      wud.link.template: "https://github.com/smeagolworms4/mqtt-explorer-docker/releases"

  bunkerm:
    image: *bunkerm-version
    container_name: bunkerm
    hostname: bunkerm
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768M
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and the UI only
      # listens on IPv4, so "localhost" is always connection refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: "${TZ}"
      HOST_ADDRESS: "10.10.1.13"
    ports:
      - "1883:1883"
      - "2000:2000"
    volumes:
      - "/opt/docker/bunkerm/bunkerm_data:/var/lib/mosquitto"
      - "/opt/docker/bunkerm/bunkerm_config:/etc/mosquitto"
      - "/opt/docker/bunkerm/bunkerm_auth:/data"
      # The image ships no tzdata, so TZ=Europe/London can't be resolved and
      # agent-api (tzlocal/APScheduler) crash-loops into FATAL. Lend it the host's.
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - bunkerm
    logging: *default-logging
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.display.name: "BunkerM"
      wud.display.icon: "sh:bunkerm"
      wud.link.template: "https://github.com/bunkeriot/BunkerM/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  traefik:
    external: true
  bunkerm:
    name: bunkerm
    driver: bridge

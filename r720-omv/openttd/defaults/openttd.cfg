; OpenTTD server settings: the git source of truth.
; start.sh copies this over /config/openttd/openttd.cfg on every container
; start, so console `setting` changes don't survive a restart. Keys left out
; fall back to OpenTTD's defaults. server_name and passwords are written into
; private.cfg / secrets.cfg by start.sh from the compose environment.
;
; [game_creation] and [newgrf] only apply when a NEW game is generated
; (empty autosave dir, or `newgame` on the console). A loaded save keeps its
; own settings and NewGRFs.

[network]
server_game_type = public
server_port = 3979
server_admin_port = 3977
max_companies = 8
max_clients = 16
; pause when nobody is connected, and while someone is downloading the map
min_active_clients = 1
pause_on_join = true
; drop companies abandoned on a public server
autoclean_companies = true
autoclean_protected = 36
autoclean_novehicles = 12

[gui]
autosave_interval = 10
max_num_autosaves = 16
autosave_on_exit = true

; Gameplay below is carried over from the 2024 server (/root/openttd on omv,
; OpenTTD 13.4); new: cargodist for pax/mail.
[game_creation]
landscape = temperate
town_name = english
starting_year = 1920
ending_year = 2050
; 2^11 = 2048x2048
map_x = 11
map_y = 11
land_generator = 1
variety = 2
tgen_smoothness = 1
tree_placer = 2
water_borders = 15
amount_of_rivers = 2
min_river_length = 16
river_route_random = 5

[difficulty]
max_no_competitors = 0
number_towns = 2
industry_density = 4
max_loan = 300000
initial_interest = 2
vehicle_costs = 0
construction_cost = 0
vehicle_breakdowns = 1
subsidy_multiplier = 2
subsidy_duration = 1
terrain_type = 1
quantity_sea_lakes = 0
economy = false
disasters = false
town_council_tolerance = 0

[construction]
build_on_slopes = true
autoslope = true
extra_dynamite = true
max_bridge_length = 64
max_bridge_height = 12
max_tunnel_length = 64
road_stop_on_town_road = true
road_stop_on_competitor_road = true
industry_platform = 1
freeform_edges = true
extra_tree_placement = 2

[vehicle]
road_side = left
train_acceleration_model = 1
roadveh_acceleration_model = 1
train_slope_steepness = 3
roadveh_slope_steepness = 7
max_train_length = 7
wagon_speed_limits = true
plane_speed = 4
plane_crashes = 2
dynamic_engines = true
max_trains = 500
max_roadveh = 500
max_aircraft = 200
max_ships = 300

[station]
station_spread = 12
modified_catchment = true
serve_neutral_industries = true
adjacent_stations = true
distant_join_stations = true

[order]
no_servicing_if_no_breakdowns = true
improved_load = true
selectgoods = true
gradual_loading = true
[economy]
type = 1
inflation = false
town_layout = 0
allow_town_roads = true
allow_town_level_crossings = true
town_cargogen_mode = 1
town_growth_rate = 2
larger_towns = 4
initial_city_size = 2
found_town = 0
bribe = true
exclusive_rights = true
fund_buildings = true
fund_roads = true
give_money = true
allow_shares = false
feeder_payment_share = 75
infrastructure_maintenance = false
[linkgraph]
; cargodist (0 manual, 1 asymmetric, 2 symmetric) for passengers and mail;
; freight keeps plain routing
distribution_pax = 2
distribution_mail = 1

; Load order: infrastructure, vehicles, stations, industries, towns, rating tweaks.
; No Total Bridge Renewal Set: every build errors "must be loaded after TTRS"
; whenever TTRS 3.14 is present, in either order.
; Trams are part of Timberwolf UK Road Vehicles (p7 Enable Trams = 1).
; Key = grfid|md5|path, exactly as OpenTTD records it (`openttd -q <save>`);
; plain filenames don't resolve inside tars.
; Parameters MUST be explicit: an empty value makes OpenTTD set every
; parameter to 0, NOT the GRF's defaults (that disabled all Timberwolf road
; vehicles). Values below are each GRF's own Action 14 defaults; FIRS p0=0
; is Temperate Basic. GRFs with no parameters keep an empty value.
; OpenTTD's md5 is NOT `md5sum` of the .grf: after bumping a GRF, generate a
; game and copy the line from `openttd -q` on its save.
; Tars live in openttd_data/content_download/newgrf (fetched with `content`).

x-versions:
  deceptifeed: &deceptifeed-version "deceptifeed/server:0.69.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  deceptifeed:
    image: *deceptifeed-version
    container_name: deceptifeed
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: "${TZ}"
    # Settings live in /data/config.xml (server-side, beside the database):
    # the HTTPS honeypot takes the source IP from X-Forwarded-For, which
    # Traefik sets to the real TCP peer (it trusts no forwarded headers, so a
    # client-supplied value is replaced). Private IPs and Cloudflare's edge
    # ranges (/data/exclude.conf) stay out of the feed; without this every
    # web hit was recorded as Traefik's own address.
    command: ["-config", "/data/config.xml"]
    mem_limit: 256M
    networks:
      - deceptifeed
      - traefik
    ports:
      - "12222:2222"
      - "19000:9000"
    logging: *default-logging
    labels:
      traefik.enable: "true"
      # Catch-all for any host no other router claims. No router on `web`:
      # its entrypoint redirect (priority 1000) sends every plain-HTTP request
      # to websecure first, so a priority-1 web router never matched.
      # (`{host:.+}` was v2 HostRegexp syntax; under v3 it is a literal regex
      # that matches nothing, so the PathPrefix alone did the work.)
      traefik.http.routers.deceptifeed-https.rule: "PathPrefix(`/`)"
      traefik.http.routers.deceptifeed-https.entrypoints: "websecure"
      traefik.http.routers.deceptifeed-https.priority: "1"
      traefik.http.routers.deceptifeed-https.service: "deceptifeed-https-svc"
      traefik.http.services.deceptifeed-https-svc.loadbalancer.server.port: "8443"
      traefik.http.services.deceptifeed-https-svc.loadbalancer.server.scheme: "https"
      # Self-signed cert on :8443 — skip verify for this backend only (global
      # insecureSkipVerify was removed from the traefik stack).
      traefik.http.services.deceptifeed-https-svc.loadbalancer.serverstransport: "insecure-backend@file"
      traefik.http.routers.deceptifeed-https.tls: "true"
      traefik.http.routers.deceptifeed-https.tls.certresolver: "letsencrypt"
      traefik.http.routers.deceptifeed-https.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.deceptifeed-https.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.link.changelog: 'https://github.com/r-smith/deceptifeed/releases/tag/v$${major}.$${minor}.$${patch}'
      wud.display.name: "Deceptifeed"
      wud.display.icon: "sh-deceptifeed"
    volumes:
      - /opt/docker/deceptifeed/deceptifeed_data:/data/

networks:
  deceptifeed:
    name: deceptifeed
    driver: bridge
    external: false
  traefik:
    external: true

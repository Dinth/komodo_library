x-versions:
  # Base image the local patched image is built FROM (see Dockerfile).
  # Releases: https://github.com/Bleala/Vdirsyncer-DOCKERIZED/releases
  # Bump this + redeploy (rebuild) to update; the Location-header patch re-applies.
  vdirsyncer-base: &vdirsyncer-base "bleala/vdirsyncer:2.7.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-vdirsyncer-env: &vdirsyncer-env
  TZ: ${TZ:-UTC}

services:
  vdirsyncer:
    build:
      context: .
      args:
        BASE_IMAGE: *vdirsyncer-base
    # Bump the -pN suffix whenever the Dockerfile patches change: a
    # Dockerfile-only edit doesn't change the compose, so Komodo reuses the
    # cached image and never rebuilds. A new tag forces a fresh build.
    # Same applies when vdirsyncer_job.py changes (it is COPYed into the image).
    image: vdirsyncer-patched:2.7.0-p3
    pull_policy: never
    container_name: vdirsyncer
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256M
    environment:
      <<: *vdirsyncer-env
      CRON_TIME: "${VDIRSYNCER_CRON_TIME:-*/15 * * * *}"
      # CRON_TIME is the tick for every pair. VDIRSYNCER_PAIR_INTERVALS is
      # `pair=minutes` for pairs that should run less often than the tick:
      # contacts hourly, since they change rarely and Google's CardDAV endpoint
      # is the one that rate-limits. Pair names must match the `[pair ...]`
      # sections of the server-side config. Failed pairs are retried once after
      # VDIRSYNCER_RETRY_DELAY seconds.
      VDIRSYNCER_PAIR_INTERVALS: "monica_contacts_to_google=60,nextcloud_contacts_to_google=60"
      VDIRSYNCER_RETRY_DELAY: "45"
      VDIRSYNCER_JOB_STATUS_FILE: "/job/vdirsyncer.json"
    volumes:
      - /opt/docker/vdirsyncer/vdirsyncer_config/config:/vdirsyncer/config:ro
      - /opt/docker/vdirsyncer/vdirsyncer_status:/status
      - /opt/docker/vdirsyncer/vdirsyncer_tokens:/vdirsyncer/tokens
      # The job wrapper writes vdirsyncer.json here; the homepage stack's
      # homepage-selector nginx serves this directory at /status/ for the
      # boards' tiles (the cronicle stack writes its tile documents into the
      # same directory).
      - /opt/docker/homepage/status:/job
      - /etc/localtime:/etc/localtime:ro
    networks: [vdirsyncer]
    logging: *default-logging
    # WUD disabled: the running image is a locally-built patched tag, not a
    # registry tag, so WUD can't watch it. Restore these (and revert the
    # build:/image: block to a plain `image: *vdirsyncer-base`) once the
    # upstream Location-header fix ships and the patch is no longer needed.
    # The watchers use WATCHALL, so opting out needs an explicit label;
    # otherwise WUD looks the local image up on Docker Hub and gets a 401.
    labels:
      wud.watch: "false"
    # labels:
    #   wud.watch: "true"
    #   wud.tag.include: '^\d+\.\d+\.\d+$$'
    #   wud.display.name: "vdirsyncer"
    #   wud.link.template: 'https://github.com/Bleala/Vdirsyncer-DOCKERIZED/releases/tag/$${major}.$${minor}.$${patch}'

networks:
  vdirsyncer:
    name: vdirsyncer
    driver: bridge

x-versions:
  mongo: &mongo-version "docker.io/mongo:8.3.9"
  unifi: &unifi-version "lscr.io/linuxserver/unifi-network-application:10.6.101"
  # Not pinned: :latest tracks main ahead of the version tags (0.7.0 is older
  # than the current :latest build) — a pin would be a downgrade. Digest watch.
  unifi-mcp: &unifi-mcp-version "ghcr.io/sirkirby/unifi-network-mcp:latest"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  unifi-db:
    image: *mongo-version
    container_name: unifi-db
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    healthcheck:
      test: ["CMD","mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - /opt/docker/unifi/unifi_db:/data/db
      - /opt/docker/unifi/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/mongodb/mongo/releases/tag/r$${major}.$${minor}.$${patch}'
      wud.display.name: 'Unifi Network Application - Mongo DB'
      wud.display.icon: 'sh:ubiquiti-unifi-dark'

  unifi-network-application:
    image: *unifi-version
    container_name: unifi-network-application
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4G
    environment:
      PUID: "${DOCKER_PUID}"
      PGID: "${DOCKER_PGID}"
      TZ: "${TZ}"
      MONGO_USER: "unifi"
      MONGO_PASS: "${MONGO_PASS}"
      MONGO_HOST: "unifi-db"
      MONGO_PORT: "27017"
      MONGO_DBNAME: "unifi"
      MEM_LIMIT: "1024"
      MEM_STARTUP: "512"
    volumes:
      # Absolute, NOT `./config`. A relative bind resolves against Komodo's
      # per-host stack checkout (/etc/komodo/... on r720-omv, /var/lib/komodo/...
      # on r230-nixos) and the repo tracks no config/ directory, so moving this
      # stack to another host handed UniFi an EMPTY /config. It then ran the
      # setup wizard, wrote is_default=true, concluded it was a fresh install
      # and wiped the (correctly restored) Mongo database -- the 2026-09-19
      # migration failure. The relative path also kept the live config outside
      # /opt/docker, so Backrest never captured it: the directory it did back up
      # here went stale on 2025-04-25 and carries a different controller uuid.
      - /opt/docker/unifi/unifi_config:/config
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 9080:8080
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514/udp
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/linuxserver/docker-unifi-network-application/releases/tag/$${major}.$${minor}.$${patch}'
      wud.display.name: 'Unifi Network Application'
      wud.display.icon: 'sh:ubiquiti-unifi-dark'

  unifi-network-mcp:
    image: *unifi-mcp-version
    container_name: unifi-network-mcp
    ipc: private
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    environment:
      PUID: "${DOCKER_PUID}"
      PGID: "${DOCKER_PGID}"
      TZ: "${TZ}"
      # Reach the controller by service name rather than the host IP. All three
      # services share Compose's default network (this file declares none), so
      # this resolves directly instead of hairpinning out to the host and back
      # in via the published 8443 — and it survives the stack moving hosts,
      # which the old hardcoded 10.10.1.13 did not.
      UNIFI_HOST: "unifi-network-application"
      UNIFI_USERNAME: "mcp"
      UNIFI_PASSWORD: "${UNIFI_MCP_PASS}"
      UNIFI_PORT: "8443"
      UNIFI_SITE: "default"
      UNIFI_VERIFY_SSL: "false"
      UNIFI_MCP_HTTP_ENABLED: "true"
      # Host header allow-list for mcp's own HTTP server, published on 5134.
      UNIFI_MCP_ALLOWED_HOSTS: "10.10.1.13:*,localhost:*,127.0.0.1:*"
    ports:
      - "5134:3000"
    depends_on:
      - unifi-network-application
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/sirkirby/unifi-network-mcp/releases/tag/v$${major}.$${minor}.$${patch}'
      wud.display.name: 'UniFi Network MCP'
      wud.display.icon: 'sh:ubiquiti-unifi-dark'

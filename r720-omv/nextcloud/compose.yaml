x-versions:
  nextcloud: &nextcloud-version "linuxserver/nextcloud:35.0.2"
  valkey: &valkey-version "docker.io/valkey/valkey:9.1.3-alpine"
  # Upstream tags are build datestamps (no semver).
  imaginary: &imaginary-version "ghcr.io/nextcloud-releases/aio-imaginary:20261021_180331"
  collabora: &collabora-version "collabora/code:26.04.5.2.1"
  nextcloud-mcp: &nextcloud-mcp-version "ghcr.io/cbcoutinho/nextcloud-mcp-server:0.202.1"
  postgres: &postgres-version "postgres:18.6-alpine"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nextcloud-valkey:
    image: *valkey-version
    container_name: nextcloud-valkey
    hostname: nextcloud-valkey
    ipc: private
    restart: unless-stopped
    command: ['valkey-server','--save','30','1','--loglevel','warning','--maxmemory','200mb','--maxmemory-policy','noeviction','--requirepass','${NEXTCLOUD_VALKEY_PASS}']
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      TZ: "${TZ}"
      # The official image ignores VALKEY_PASSWORD (a Bitnami-ism); the password
      # is set by --requirepass above. valkey-cli reads REDISCLI_AUTH, which
      # keeps the healthcheck's ping authenticated. Nextcloud's side lives in
      # config.php ('redis' => ['password' => ...]), set via occ.
      REDISCLI_AUTH: "${NEXTCLOUD_VALKEY_PASS}"
    healthcheck:
      # Fast probing only while starting (gates depends_on), 30s once healthy.
      test: '[ $$(valkey-cli ping) = ''PONG'' ]'
      start_period: 10s
      start_interval: 1s
      timeout: 3s
      interval: 30s
      retries: 5
    volumes:
      - /opt/docker/nextcloud/valkey_data:/data
    networks:
      - nextcloud
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      wud.display.name: "Nextcloud - Valkey"
      wud.display.icon: "sh:nextcloud"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+\-alpine$$'
      wud.link.template: 'https://github.com/valkey-io/valkey/releases/tag/$${major}.$${minor}.$${patch}'

  nextcloud-imaginary:
    image: *imaginary-version
    container_name: nextcloud-imaginary
    hostname: nextcloud-imaginary
    ipc: private
    restart: unless-stopped
    command: -concurrency 50 -enable-url-source -log-level info
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SYS_NICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      TZ: "${TZ}"
      PORT: "9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--tries=1", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nextcloud
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      autoheal: "true"
      wud.display.name: "Nextcloud - Imaginary"
      wud.display.icon: "sh:nextcloud"
      wud.watch: "true"
      wud.tag.include: '^\d{8}_\d{6}$$'

  nextcloud-collabora:
    image: *collabora-version
    container_name: nextcloud-collabora
    hostname: nextcloud-collabora
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SYS_CHROOT
      - MKNOD
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    # 26.04 images are distroless: no start script, coolwsd reads these env
    # vars itself (extra_params included - checked on a test container).
    # security.capabilities=false no longer means "no isolation": 26.04
    # sandboxes each document process with Landlock instead of chroot jails.
    environment:
      TZ: "${TZ}"
      aliasgroup1: "https://nc.${DOMAIN_NAME}:443"
      username: "admin"
      password: "${COLLABORA_ADMIN_PASSWORD}"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:logging.level=warning --o:security.capabilities=false"
      dictionaries: "en_GB en_US pl_PL"
    networks:
      - nextcloud
      - traefik
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      traefik.enable: "true"
      traefik.http.routers.collabora.rule: "Host(`collabora.${DOMAIN_NAME}`)"
      traefik.http.routers.collabora.entrypoints: "websecure"
      traefik.http.routers.collabora.tls: "true"
      traefik.http.routers.collabora.tls.certresolver: "letsencrypt"
      traefik.http.services.collabora.loadbalancer.server.port: "9980"
      traefik.http.routers.collabora.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.collabora.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.docker.network: "traefik"
      wud.watch: "true"
      wud.link.template: "https://www.collaboraonline.com/code/"
      wud.tag.include: '^\d+\.\d+\.\d+\.\d+\.\d+$$'
      wud.display.name: "Nextcloud - Collabora"
      wud.display.icon: "si:collaboraonline"

  nextcloud:
    image: *nextcloud-version
    container_name: nextcloud
    hostname: nextcloud
    ipc: private
    restart: unless-stopped
    entrypoint:
      - /init
    working_dir: /
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '0.5'
    environment:
      TZ: "${TZ}"
      PUID: "1001"
      PGID: "100"
      # The LSIO image ignores the official image's PHP_*/REDIS_*/OVERWRITE*/
      # TRUSTED_PROXIES env vars. Redis, overwrite* and trusted_proxies live in
      # config.php; PHP/FPM tuning comes from the configs mounted below.
      DOCKER_MODS: "linuxserver/mods:nextcloud-notify-push"
    healthcheck:
      test: ["CMD-SHELL", "curl -Ss http://localhost/status.php | grep '\"installed\":true' || exit 1"]
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
    ports:
      - 1357:80/tcp
    volumes:
      - /opt/docker/nextcloud/nextcloud_config:/config
      - /Data/IT/nextcloud:/data
      # Paperless consume inboxes, surfaced per user as "Paperless inbox"
      # External Storage mounts. Paperless (1003:100) deletes files once
      # consumed, so the dirs are setgid 2775 group 100 (shared with abc).
      - /opt/docker/paperlessngx/paperlessngx_consume:/paperless-consume
    configs:
      # PHP_INI_SCAN_DIR includes /config/php; LSIO's php-fpm includes www2.conf.
      - source: nextcloud-php-ini
        target: /config/php/php-local.ini
      - source: nextcloud-fpm-pool
        target: /config/php/www2.conf
    networks:
      - nextcloud
      - traefik
    logging: *default-logging
    labels:
      # compose doesn't hash configs: content; bump this whenever either
      # nextcloud-php-ini or nextcloud-fpm-pool changes to force a recreate.
      config.revision: "1"
      traefik.enable: "true"
      traefik.http.routers.nextcloud.rule: "Host(`nc.${DOMAIN_NAME}`)"
      traefik.http.routers.nextcloud.entrypoints: "websecure"
      traefik.http.routers.nextcloud.tls: "true"
      traefik.http.routers.nextcloud.tls.certresolver: "letsencrypt"
      traefik.http.services.nextcloud.loadbalancer.server.port: "80"
      traefik.http.routers.nextcloud.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.nextcloud.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.services.nextcloud.loadbalancer.passhostheader: "true"
      # baseHeaders, not secHeaders: secHeaders' estate-wide CSP replaced
      # Nextcloud's own (a strict per-request nonce policy that apps extend),
      # so frame-src/form-action no longer allowed collabora.${DOMAIN_NAME}
      # and Office never loaded its editor. baseHeaders keeps the rest,
      # including the Remote-* request-header stripping.
      traefik.http.routers.nextcloud.middlewares: "baseHeaders@file,nextcloud-redirectregex1,nextcloud-redirectregex2,compresstraefik,nextcloud-securityheaders"
      traefik.http.middlewares.compresstraefik.compress: "true"
      traefik.http.middlewares.nextcloud-redirectregex1.redirectregex.permanent: "true"
      traefik.http.middlewares.nextcloud-redirectregex1.redirectregex.regex: "https?://([^/]*)/.well-known/(card|cal)dav"
      traefik.http.middlewares.nextcloud-redirectregex1.redirectregex.replacement: "https://$${1}/remote.php/dav/"
      traefik.http.middlewares.nextcloud-redirectregex2.redirectregex.permanent: "true"
      traefik.http.middlewares.nextcloud-redirectregex2.redirectregex.regex: "https?://([^/]*)(/.well-known[^#]*)"
      traefik.http.middlewares.nextcloud-redirectregex2.redirectregex.replacement: "https://$${1}/index.php$${2}"
      traefik.http.middlewares.nextcloud-securityheaders.headers.stsSeconds: "15552000"
      traefik.http.middlewares.nextcloud-securityheaders.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.nextcloud-securityheaders.headers.stsPreload: "true"
      traefik.docker.network: "traefik"
      wud.watch: "true"
      wud.display.name: "NextCloud"
      wud.display.icon: "sh:nextcloud"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/nextcloud/server/releases/tag/v$${major}.$${minor}.$${patch}"

  nextcloud-mcp:
    image: *nextcloud-mcp-version
    container_name: nextcloud-mcp
    hostname: nextcloud-mcp
    ipc: private
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 1G
    environment:
      TZ: "${TZ}"
      # Multi-user: each client sends its own NC user + app-password via
      # HTTP Basic auth on every request. NEXTCLOUD_USERNAME/PASSWORD must be
      # UNSET for this mode to engage.
      MCP_DEPLOYMENT_MODE: "multi_user_basic"
      NEXTCLOUD_HOST: "https://nc.${DOMAIN_NAME}"
      HOME: "/tmp"
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import socket; socket.create_connection(('127.0.0.1', 8000), 3)\" || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      # MCP-server port pool (513x); not exposed via Traefik.
      # streamable-http endpoint at /mcp.
      - 5136:8000/tcp
    networks:
      - nextcloud
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.display.name: "Nextcloud - MCP"
      wud.display.icon: "sh:nextcloud"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/cbcoutinho/nextcloud-mcp-server/releases/tag/v$${major}.$${minor}.$${patch}"

  nextcloud-postgres:
    image: *postgres-version
    container_name: nextcloud-postgres
    hostname: nextcloud-postgres
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    environment:
      TZ: "${TZ}"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "nextcloud"
      POSTGRES_PASSWORD: "${NEXTCLOUD_DB_PASSWORD}"
      # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker and puts
      # its VOLUME on /var/lib/postgresql, so a bind mount to .../data lands
      # beside the cluster and initdb quietly creates an empty one. Pin it.
      PGDATA: "/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - /opt/docker/nextcloud/nextcloud-postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - nextcloud
      - adminer
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^18\.\d+-alpine$$'
      wud.display.name: "Nextcloud PostgreSQL"
      wud.display.icon: "sh:postgresql"
      wud.link.template: 'https://github.com/postgres/postgres/releases/tag/REL_$${major}_$${minor}'

configs:
  nextcloud-php-ini:
    content: |
      memory_limit = 4096M
      upload_max_filesize = 16G
      post_max_size = 16G
  nextcloud-fpm-pool:
    content: |
      [www]
      pm = dynamic
      pm.max_children = 120
      pm.start_servers = 12
      pm.min_spare_servers = 6
      pm.max_spare_servers = 18

networks:
  nextcloud:
    driver: bridge
    name: nextcloud
    external: false
  traefik:
    external: true
  adminer:
    external: true

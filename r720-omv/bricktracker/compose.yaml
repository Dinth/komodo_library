x-versions:
  bricktracker: &bricktracker-version "gitea.baerentsen.space/frederikbaerentsen/bricktracker:1.4.2"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  bricktracker:
    image: *bricktracker-version
    container_name: bricktracker
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      # No path overrides: since 1.3 everything defaults to /app/data (database,
      # CSVs, images, instructions and the .env that Admin > Live Settings
      # writes), which the volumes below map onto the existing host folders.
      BK_REBRICKABLE_API_KEY: "${BK_REBRICKABLE_API_KEY}"
      # Password-protects Admin and every write action (add/delete sets,
      # missing parts, instructions, wishlist); browsing stays open. An empty
      # password silently turns protection off, so both Komodo Variables must
      # be filled in. The key signs the session cookie.
      BK_AUTHENTICATION_PASSWORD: "${BK_AUTHENTICATION_PASSWORD}"
      BK_AUTHENTICATION_KEY: "${BK_AUTHENTICATION_KEY}"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:3333'); print(r.status_code == 200)"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      # The four image/instruction folders are nested inside the data mount so
      # the container sees upstream's single-folder layout without moving
      # anything on the host.
      - /opt/docker/bricktracker/bricktracker_data:/app/data/
      - /opt/docker/bricktracker/bricktracker_instructions:/app/data/instructions/
      - /opt/docker/bricktracker/bricktracker_minifigures:/app/data/minifigures/
      - /opt/docker/bricktracker/bricktracker_parts:/app/data/parts/
      - /opt/docker/bricktracker/bricktracker_sets:/app/data/sets/
    networks:
      - bricktracker
      - traefik
    logging: *default-logging
    labels:
      # Authelia gates the whole UI (its *.domain rules cover this host); the
      # BrickTracker password still guards Admin and edits. DOMAIN_NAME is for
      # labels only: never put it (or BK_DOMAIN_NAME) in the env, BrickTracker
      # makes it a strict Socket.IO CORS origin that breaks behind the proxy.
      traefik.enable: "true"
      traefik.http.routers.bricktracker.rule: "Host(`bricktracker.${DOMAIN_NAME}`)"
      traefik.http.routers.bricktracker.entrypoints: "websecure"
      traefik.http.routers.bricktracker.tls: "true"
      traefik.http.routers.bricktracker.tls.certresolver: "letsencrypt"
      traefik.http.routers.bricktracker.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.bricktracker.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.bricktracker.middlewares: "secHeaders@file,authelia-auth@docker"
      traefik.http.services.bricktracker.loadbalancer.server.port: "3333"
      autoheal: "true"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "Bricktracker"
      wud.display.icon: "sh:bricktracker"
      wud.link.template: "https://gitea.baerentsen.space/FrederikBaerentsen/BrickTracker/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  bricktracker:
    name: bricktracker
    driver: bridge
    external: false
  traefik:
    external: true

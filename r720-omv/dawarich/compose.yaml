x-versions:
  dawarich: &dawarich-version "freikin/dawarich:1.19.0"
  valkey: &valkey-version "docker.io/valkey/valkey:9.1.3-alpine"
  postgis: &postgis-version "postgis/postgis:17-3.6-alpine"
services:
  dawarich-valkey:
    container_name: dawarich-valkey
    image: *valkey-version
    ipc: private
    command: ['valkey-server','--save','30','1','--loglevel','warning']
    restart: unless-stopped
    mem_limit: 2G
    networks:
      - dawarich
    volumes:
      - /opt/docker/dawarich/valkey-data:/data
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      wud.display.name: "Dawarich - Valkey"
      wud.display.icon: "sh-dawarich"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+\-alpine$$'
      wud.link.template: 'https://github.com/valkey-io/valkey/releases/tag/$${major}.$${minor}.$${patch}'
    healthcheck:
      # Fast probing only while starting (gates depends_on), 30s once healthy.
      test: '[ $$(valkey-cli ping) = ''PONG'' ]'
      start_period: 10s
      start_interval: 1s
      timeout: 3s
      interval: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  dawarich-postgis:
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ['postgres']
    container_name: dawarich-postgis
    entrypoint: ['docker-entrypoint.sh']
    environment:
      POSTGRES_USER: "dawarich"
      PGUSER: "dawarich"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    hostname: dawarich-postgis
    image: *postgis-version
    ipc: private
    mem_limit: 4G
    healthcheck:
      test: [ 'CMD-SHELL','pg_isready','-U','dawarich','-d','dawarich' ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      wud.watch: "true"
      wud.tag.include: '^17-\d+\.\d+-alpine$$'
      # Rewrite 17-3.6-alpine -> 17.3.6 so the PostGIS version is actually
      # comparable. Untransformed, semver coercion stops at the first
      # non-digit and reduces every 17-x.y-alpine tag to 17.0.0 — WUD then
      # has nothing to sort on and reports whichever tag the registry
      # happens to list first (17-3.5-alpine) as an available "update".
      wud.tag.transform: '^(\d+)-(\d+)\.(\d+)-alpine$$ => $$1.$$2.$$3'
      wud.display.name: "Dawarich - Postgis"
      wud.display.icon: "sh-dawarich"
    networks:
      - dawarich
    restart: unless-stopped
    volumes:
      - /opt/docker/dawarich/postgis_data:/var/lib/postgresql/data

  # 1.17+: background jobs run embedded in this container (SIDEKIQ_EMBEDDED);
  # the separate dawarich-sidekiq service is gone. Komodo does not remove a
  # container whose service left the compose file, and upstream warns never
  # to run the old worker beside the new app: it was stopped and removed by
  # hand at the 1.18.1 upgrade.
  dawarich:
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ['bin/rails','server','-p','3000','-b','::']
    container_name: dawarich
    entrypoint: 'web-entrypoint.sh'
    environment:
      DATABASE_HOST: "dawarich-postgis"
      DATABASE_USERNAME: "dawarich"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      DATABASE_NAME: "dawarich"
      # Production: development mode ran on the dev encryption keys published
      # in Dawarich's source, reloaded code on demand and logged every SQL
      # query. Every Komodo variable below must exist before deploying: an
      # unresolved one interpolates to "" and Rails treats that as a set
      # (empty) key.
      RAILS_ENV: "production"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      OTP_ENCRYPTION_PRIMARY_KEY: "${OTP_ENCRYPTION_PRIMARY_KEY}"
      OTP_ENCRYPTION_DETERMINISTIC_KEY: "${OTP_ENCRYPTION_DETERMINISTIC_KEY}"
      OTP_ENCRYPTION_KEY_DERIVATION_SALT: "${OTP_ENCRYPTION_KEY_DERIVATION_SALT}"
      APPLICATION_HOST: "localhost"
      # Production enforces this list (development let any IP through). The
      # LAN IP keeps the published :4745 port working for anything that still
      # posts there directly instead of via Traefik.
      APPLICATION_HOSTS: "localhost,10.10.1.13,traces.${DOMAIN_NAME}"
      DISTANCE_UNIT: "km"
      REDIS_URL: "redis://dawarich-valkey:6379"
      MIN_MINUTES_SPENT_IN_CITY: "120"
      TIME_ZONE: "${TZ}"
      # Was PHOTON_API_USE_HTTP, which Dawarich does not read: the web container
      # fell back to the false default and sent the Photon key over plain HTTP.
      PHOTON_API_USE_HTTPS: "true"
      APPLICATION_PROTOCOL: "http"
      REVERSE_GEOCODING_ENABLED: "true"
      PHOTON_API_HOST: "photon.dawarich.app"
      PHOTON_API_KEY: "${PHOTON_API_KEY}"
      SELF_HOSTED: "true"
      # 1.17+: Sidekiq runs inside this process. WEB_CONCURRENCY must be 0 -
      # every extra web worker would start its own set of job threads.
      # BACKGROUND_PROCESSING_CONCURRENCY is upstream's 2: the job threads now
      # share the ActiveRecord pool (5, RAILS_MAX_THREADS unset) with web.
      SIDEKIQ_EMBEDDED: "true"
      WEB_CONCURRENCY: "0"
      BACKGROUND_PROCESSING_CONCURRENCY: "2"
    hostname: dawarich
    image: *dawarich-version
    ipc: private
    # Web + jobs in one process now: the old split was 1G web + 2G worker
    # (512M had the worker OOM-killed mid reverse-geocode). Upstream's default
    # is 4G; 1.17 halved idle memory.
    mem_limit: 3G
    # Upstream's value: lets running jobs finish or return to Redis on stop.
    stop_grace_period: 60s
    # Upstream's probe (it had been commented out here; checked working on
    # 1.15.3 before the upgrade). With autoheal it now also guards the
    # embedded job runner, which the old worker's autoheal label covered.
    # start_period allows for first-start migrations; the first pass ends it.
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO - http://localhost:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'" ]
      interval: 30s
      retries: 5
      start_period: 15m
      start_interval: 10s
      timeout: 10s
    depends_on:
      dawarich-postgis:
        condition: service_healthy
        restart: true
      dawarich-valkey:
        condition: service_healthy
        restart: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dawarich
      - traefik
    ports:
      - 4745:3000/tcp
    labels:
      autoheal: "true"
      traefik.enable: "true"
      traefik.http.routers.dawarich.entrypoints: websecure
      traefik.http.routers.dawarich.rule: Host(`traces.${DOMAIN_NAME}`)
      traefik.http.routers.dawarich.tls: "true"
      traefik.http.routers.dawarich.tls.certresolver: letsencrypt
      traefik.http.routers.dawarich.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.dawarich.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.dawarich.middlewares: "secHeaders@file"
      traefik.http.services.dawarich.loadbalancer.server.port: "3000"
      wud.display.icon: "sh:dawarich"
      wud.display.name: "Dawarich"
      wud.link.template: 'https://github.com/Freika/dawarich/releases/tag/$${major}.$${minor}.$${patch}'
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.watch: "true"
    restart: unless-stopped
    volumes:
      - /opt/docker/dawarich/dawarich_watched:/var/app/tmp/imports/watched
      - /opt/docker/dawarich/dawarich_gem_cache_app:/usr/local/bundle/gems_app
      - /opt/docker/dawarich/dawarich_public:/var/app/public
      - /opt/docker/dawarich/dawarich_storage:/var/app/storage
      - /opt/docker/dawarich/dawarich_sqlite_data:/dawarich_sqlite_data
networks:
  dawarich:
    name: dawarich
    driver: bridge
    external: false
  traefik:
    external: true

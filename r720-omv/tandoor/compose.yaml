x-versions:
  tandoor: &tandoor-version "vabene1111/recipes:2.7.1"
  postgres: &postgres-version "postgres:18.6-alpine"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  tandoor:
    image: *tandoor-version
    container_name: tandoor
    hostname: tandoor
    ipc: private
    restart: unless-stopped
    # Runs unprivileged: the image logs nginx to stdout/stderr and keeps its
    # temp paths, gunicorn socket and pid in /tmp. tandoor_static (rebuilt by
    # collectstatic on every start) and tandoor_media must be DOCKER_PUID-owned.
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    entrypoint: ['/opt/recipes/boot.sh']
    working_dir: /opt/recipes
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536M
    environment:
      DB_ENGINE: "django.db.backends.postgresql"
      SECRET_KEY: "${TANDOOR_SECRET_KEY}"
      POSTGRES_HOST: "tandoor-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "tandoor"
      POSTGRES_PASSWORD: "${TANDOOR_DB_PASSWORD}"
      POSTGRES_DB: "tandoor"
      # 10.10.1.13 is here for the Homepage tandoor widget. That widget proxies
      # server-side from the board container, which is not on the tandoor or
      # traefik network and whose resolver returns ENODATA for the public name,
      # so it has to come in on the published port - which makes the Host header
      # "10.10.1.13:1244". Without it Django answers every API call with an empty
      # 400 page, which reads exactly like a bad API token but is not one.
      ALLOWED_HOSTS: "recipes.${DOMAIN_NAME},10.10.1.13,127.0.0.1"
      GUNICORN_MEDIA: "1"
      # Running as DOCKER_PUID leaves HOME at /, where the gunicorn shipped in
      # 2.7 fails to create its control socket dir (`/.gunicorn`, EACCES -
      # logged as an error, otherwise harmless). /tmp is writable here.
      HOME: "/tmp"
      # AI features (recipe import from photo/PDF/text, step sort, food and
      # recipe properties) go through litellm. A provider with a `url` is only
      # called if that url is listed here, compared as an exact string. The
      # space's default provider is the local Ollama on r720 via its
      # OpenAI-compatible API: model `openai/gemma4:12b-32k` (vision + 32k
      # context), url below, api_key "ollama" (litellm insists on one, Ollama
      # ignores it). It lives in cookbook_aiprovider, set up in the DB.
      AI_ALLOWED_URLS: "http://10.10.1.13:11434/v1"
    depends_on:
      tandoor-postgres:
        condition: service_healthy
    # 2.7 serves its login as part of the new SPA (/ -> 302 /account/login/,
    # <title>Tandoor</title>), so the old `grep 'Login'` never matched and
    # autoheal restart-looped a working container. Any 2xx from the login page
    # means nginx + gunicorn are up; while gunicorn boots nginx answers 502.
    # A start runs migrate + collectstatic and imports litellm into every
    # worker: ~2.5 min here, so start_period covers that (start_interval keeps
    # probing early, the first success ends it).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/account/login/ || exit 1"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 240s
      start_interval: 10s
    ports:
      - 1244:80/tcp
    volumes:
      - /opt/docker/tandoor/tandoor_static:/opt/recipes/staticfiles
      - /opt/docker/tandoor/tandoor_media:/opt/recipes/mediafiles
    networks:
      - tandoor
      - traefik
    logging: *default-logging
    labels:
      autoheal: "true"
      traefik.enable: "true"
      traefik.http.routers.tandoor.entrypoints: websecure
      traefik.http.routers.tandoor.rule: Host(`recipes.${DOMAIN_NAME}`)
      traefik.http.routers.tandoor.tls: "true"
      traefik.http.routers.tandoor.tls.certresolver: letsencrypt
      traefik.http.routers.tandoor.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.tandoor.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      # secHeaders' baseline CSP plus what this app needs: Cookidoo (Thermomix) recipe content; its images come from assets.tmecosys.com, already covered by img-src https:.
      # Listed before secHeaders@file because the first middleware wins on
      # response headers. Keep the baseline in sync with traefik_dynamic.yml.
      traefik.http.middlewares.tandoor-csp.headers.customresponseheaders.Content-Security-Policy: >-
        default-src 'self' blob: data:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:;
        style-src 'self' 'unsafe-inline' blob: data: *.vorwerk-digital.com;
        img-src 'self' blob: data: https:;
        font-src 'self' blob: data: patternlib-all.prod.external.eu-tm-prod.vorwerk-digital.com;
        object-src 'none';
        frame-ancestors 'self';
        connect-src 'self' https: wss: blob:;
        form-action 'self';
        media-src 'self' blob: data:;
        worker-src 'self' blob: data:;
        child-src 'self' blob: data:;
        frame-src 'self' blob: data:
      traefik.http.routers.tandoor.middlewares: "tandoor-csp,secHeaders@file"
      traefik.http.services.tandoor.loadbalancer.server.port: "80"
      wud.watch: "true"
      wud.display.name: "Tandoor"
      wud.display.icon: "sh:tandoor-recipes"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/TandoorRecipes/recipes/releases/tag/$${major}.$${minor}.$${patch}'

  tandoor-postgres:
    image: *postgres-version
    container_name: tandoor-postgres
    hostname: tandoor-postgres
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      TZ: "${TZ}"
      POSTGRES_DB: "tandoor"
      POSTGRES_USER: "tandoor"
      POSTGRES_PASSWORD: "${TANDOOR_DB_PASSWORD}"
      # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker and puts
      # its VOLUME on /var/lib/postgresql, so a bind mount to .../data lands
      # beside the cluster and initdb quietly creates an empty one. Pin it.
      PGDATA: "/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - /opt/docker/tandoor/tandoor-postgres_data:/var/lib/postgresql/data
      # One-shot migration seed. The entrypoint runs *.sql here only when
      # PGDATA is empty - this first start - so the dump from the shared
      # postgresql instance lands before tandoor ever connects, leaving no
      # window in which Django migrates an empty schema over the top.
      # DELETE 01-tandoor.sql once the migration is verified: it would
      # silently re-restore stale data if the data directory were ever reset.
      - /opt/docker/tandoor/tandoor-postgres_initdb:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - tandoor
      - adminer
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^18\.\d+-alpine$$'
      wud.display.name: "Tandoor PostgreSQL"
      wud.display.icon: "sh:postgresql"
      wud.link.template: 'https://github.com/postgres/postgres/releases/tag/REL_$${major}_$${minor}'

networks:
  tandoor:
    external: false
    name: tandoor
    driver: bridge
  traefik:
    external: true
  adminer:
    external: true

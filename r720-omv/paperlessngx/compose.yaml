x-versions:
  paperlessngx: &paperlessngx-version "ghcr.io/paperless-ngx/paperless-ngx:3.2.1"
  postgres: &postgres-version "docker.io/postgres:18.6-alpine"
  valkey: &valkey-version "docker.io/valkey/valkey:9.1.2-alpine"
  # Pinned to Tika 3.x -- paperless-ngx targets the Tika 3 server API; a 4.0
  # exists but don't follow it.
  tika: &tika-version "docker.io/apache/tika:3.3.1.0"
  gotenberg: &gotenberg-version "docker.io/gotenberg/gotenberg:8.37.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  paperlessngx-postgres:
    image: *postgres-version
    container_name: paperlessngx-postgres
    hostname: paperlessngx-postgres
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 512m
    # PG18 auto-sizes shared_buffers/effective_cache_size from HOST RAM and
    # ignores the cgroup limit — on this 24-core host it picked
    # shared_buffers=160MB, leaving no room for backends, so the postmaster
    # kept getting OOM-killed mid-upload. Pin both explicitly.
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=640MB
      # Parallel folder uploads need far more than the default 100 slots.
      # Sized against the app: ~11 pooled processes (6 granian, 3 celery, beat,
      # consumer) x pool.max_size=20 = 220 worst case, under the 297 usable.
      # Budget at 3g: 192MB shared + ~300 backends x ~5MB = ~1.7G.
      - -c
      - max_connections=300
    environment:
      POSTGRES_DB: "paperlessngx"
      POSTGRES_PASSWORD: "${PAPERLESSNGX_POSTGRES_PASS}"
      POSTGRES_USER: "paperlessngx"
      PGDATA: "/var/lib/postgresql/data"
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - /opt/docker/paperlessngx/postgres-data:/var/lib/postgresql/data
    networks:
      - paperlessngx
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^18\.\d+-alpine$$'
      wud.link.template: 'https://github.com/postgres/postgres/releases/tag/REL_$${major}_$${minor}'
      wud.display.name: "Paperless-ngx - Postgres"
      wud.display.icon: "sh-paperlessngx"

  paperlessngx-valkey:
    image: *valkey-version
    container_name: paperlessngx-valkey
    hostname: paperlessngx-valkey
    ipc: private
    restart: unless-stopped
    command: ['valkey-server','--save','30','1','--loglevel','warning']
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128M
    healthcheck:
      # Fast probing only while starting (gates depends_on), 30s once healthy.
      test: '[ $$(valkey-cli ping) = ''PONG'' ]'
      start_period: 10s
      start_interval: 1s
      timeout: 3s
      interval: 30s
      retries: 5
    volumes:
      - /opt/docker/paperlessngx/valkey-data:/data
    networks:
      - paperlessngx
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      wud.display.name: "Paperless-ngx - Valkey"
      wud.display.icon: "sh-paperless-ngx"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+\-alpine$$'
      wud.link.template: 'https://github.com/valkey-io/valkey/releases/tag/$${major}.$${minor}.$${patch}'

  paperlessngx-tika:
    image: *tika-version
    container_name: paperlessngx-tika
    hostname: paperlessngx-tika
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 1g
    networks:
      - paperlessngx
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^3\.\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/apache/tika/releases/tag/$${major}.$${minor}.$${patch}'
      wud.display.name: "Paperless-ngx - Tika"
      wud.display.icon: "sh-paperless-ngx"

  paperlessngx-gotenberg:
    image: *gotenberg-version
    container_name: paperlessngx-gotenberg
    hostname: paperlessngx-gotenberg
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No `user:` override here -- the image must run as its built-in gotenberg
    # user (uid 1001), whose home holds the Chromium/LibreOffice profiles.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    mem_limit: 1g
    healthcheck:
      test: curl -fsS http://localhost:3000/health
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 3
    networks:
      - paperlessngx
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^8\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/gotenberg/gotenberg/releases/tag/v$${major}.$${minor}.$${patch}'
      wud.display.name: "Paperless-ngx - Gotenberg"
      wud.display.icon: "sh-paperless-ngx"

  paperlessngx:
    image: *paperlessngx-version
    container_name: paperlessngx
    hostname: paperlessngx
    ipc: private
    restart: unless-stopped
    # Started non-root: the image's s6 init detects it (USER_IS_NON_ROOT) and
    # skips the USERMAP remap, so no capabilities are needed. Group 100 is
    # shared with Nextcloud (1001:100), which writes into the consume inboxes.
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 6 granian workers (~200MB each) alongside 2 celery OCR workers needs more
    # than the previous 2G.
    mem_limit: 4G
    depends_on:
      paperlessngx-valkey:
        condition: service_healthy
      paperlessngx-postgres:
        condition: service_healthy
      paperlessngx-tika:
        condition: service_started
      paperlessngx-gotenberg:
        condition: service_healthy
    # OIDC back-channel (token/userinfo/discovery) must hit Traefik on the LAN
    # deterministically -- same pin as wud/homebox.
    extra_hosts:
      - "id.${DOMAIN_NAME}:10.10.1.13"
    environment:
      PAPERLESS_REDIS: "redis://paperlessngx-valkey:6379"
      PAPERLESS_DBHOST: "paperlessngx-postgres"
      PAPERLESS_DBNAME: "paperlessngx"
      PAPERLESS_DBUSER: "paperlessngx"
      PAPERLESS_DBPASS: "${PAPERLESSNGX_POSTGRES_PASS}"
      PAPERLESS_TIME_ZONE: "${TZ}"
      # No PAPERLESS_OCR_LANGUAGES: it apt-installs at startup, which fails as
      # non-root and aborts init. Polish is bind-mounted from tessdata/ below.
      PAPERLESS_OCR_LANGUAGE: "eng+pol"
      PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://papers.${DOMAIN_NAME}"
      PAPERLESS_ALLOWED_HOSTS: "papers.${DOMAIN_NAME},10.10.1.13"
      PAPERLESS_CORS_ALLOWED_HOSTS: "https://papers.${DOMAIN_NAME},http://10.10.1.13:8583"
      PAPERLESS_SECRET_KEY: "${PAPERLESSNGX_SECRET_KEY}"
      # Pinned: defaults scale off the host's 24 cores (floor(sqrt(24))=4 task
      # workers x floor(24/4)=6 threads), and every worker holds its own DB
      # connection, which is what pushed postgres into the OOM above.
      PAPERLESS_TASK_WORKERS: "2"
      PAPERLESS_THREADS_PER_WORKER: "4"
      # 6 granian workers x pool.max_size=20 = 120 concurrent upload slots.
      # The web tier is the binding constraint: auditlog middleware takes a DB
      # connection at the START of every request (for request.user) and holds it
      # for the whole upload, so slots must scale with CONCURRENT uploads, not
      # with DB speed. A folder much larger than ~120 files will still exhaust it.
      PAPERLESS_WEBSERVER_WORKERS: "6"
      # Folder uploads POST every file in parallel and each request holds a
      # connection for the whole upload, so the pool has to be wide enough to
      # absorb the burst -- at max_size=8 requests queued past psycopg's fixed
      # 30s wait and died with PoolTimeout. Sized against postgres'
      # max_connections=200 below: ~8 DB-connecting processes x 20 = 160 < 197.
      # Note PAPERLESS_DB_POOLSIZE is deprecated in v3 (removed in 3.2); the
      # supported form is this comma-separated dot-notation string, NOT the JSON
      # shown in the deprecation hint.
      PAPERLESS_DB_OPTIONS: "pool.min_size=4,pool.max_size=20"
      # --- Public URL / proxy
      PAPERLESS_URL: "https://papers.${DOMAIN_NAME}"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      # --- SSO via Authelia (client 'paperless' in Authelia configuration.yml).
      # Callback: https://papers.${DOMAIN_NAME}/accounts/oidc/authelia/login/callback/
      # Existing users are linked by pre-created SocialAccount rows keyed on Authelia's sub.
      # The provider app isn't installed by default -- without this the login
      # page lists no SSO button and REDIRECT_LOGIN_TO_SSO has nothing to submit.
      PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authelia","name":"Authelia","client_id":"paperless","secret":"${PAPERLESSNGX_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://id.${DOMAIN_NAME}","token_auth_method":"client_secret_basic"}}]}}'
      # Break-glass if Authelia is down: set both of the below to "false" and
      # redeploy. API token auth (mobile apps, Homepage widget, HealthLog
      # picker) is unaffected.
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "false"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
      PAPERLESS_LOGOUT_REDIRECT_URL: "https://id.${DOMAIN_NAME}/logout"
      # --- Office docs & .eml ingestion
      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_ENDPOINT: "http://paperlessngx-tika:9998"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://paperlessngx-gotenberg:3000"
      # --- Consume: per-person subfolders consume/michal, consume/paulina;
      # ownership assigned by workflows (path filter), so no subdirs-as-tags.
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      # --- ASN barcodes on paper (sticker on page 1); only scan the first 2
      # pages so big PDFs aren't rasterised twice.
      PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
      PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"
      PAPERLESS_CONSUMER_BARCODE_MAX_PAGES: "2"
      # --- Storage layout: per-owner tree.
      PAPERLESS_FILENAME_FORMAT: "{{ owner_username }}/{{ correspondent }}/{{ created_year }}/{{ created }} {{ title }}"
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
      # --- Local AI (suggestions + document chat) on Ollama :11434
      # (ollama-metrics proxy in openwebui stack). gemma4:e4b is already
      # resident for Frigate/HA; context 8192 matches OLLAMA_CONTEXT_LENGTH so
      # it doesn't force a model reload. OLLAMA_NUM_PARALLEL=1, so requests
      # queue behind Frigate/HA -- hence the long timeout.
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: "ollama"
      PAPERLESS_AI_LLM_ENDPOINT: "http://10.10.1.13:11434"
      PAPERLESS_AI_LLM_MODEL: "gemma4:e4b"
      PAPERLESS_AI_LLM_CONTEXT_SIZE: "8192"
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "ollama"
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: "http://10.10.1.13:11434"
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: "nomic-embed-text"
    # Homepage widgets on both boards use http://10.10.1.13:8583 -- keep this
    # published, don't switch it to Traefik-only.
    ports:
      - "8583:8000"
    volumes:
      - /opt/docker/paperlessngx/paperlessngx_data:/usr/src/paperless/data
      - /opt/docker/paperlessngx/paperlessngx_media:/usr/src/paperless/media
      - /opt/docker/paperlessngx/paperlessngx_export:/usr/src/paperless/export
      - /opt/docker/paperlessngx/paperlessngx_consume:/usr/src/paperless/consume
      # tesseract-ocr-pol's traineddata (copied from the Debian package the
      # old root-started container installed); the image ships eng/deu/fra/ita/spa.
      - /opt/docker/paperlessngx/tessdata/pol.traineddata:/usr/share/tesseract-ocr/5/tessdata/pol.traineddata:ro
    networks:
      - paperlessngx
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.paperlessngx.rule: "Host(`papers.${DOMAIN_NAME}`)"
      traefik.http.routers.paperlessngx.entrypoints: "websecure"
      traefik.http.routers.paperlessngx.tls: "true"
      traefik.http.routers.paperlessngx.tls.certresolver: "letsencrypt"
      traefik.http.routers.paperlessngx.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.paperlessngx.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      # secHeaders' CSP with form-action widened to Authelia: the SSO login is a
      # self-POST that 302s to id.*, and browsers apply form-action to that
      # redirect. Listed first because the first middleware wins on response
      # headers. Keep in sync with secHeaders in traefik_dynamic.yml.
      traefik.http.middlewares.paperlessngx-csp.headers.customresponseheaders.Content-Security-Policy: "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: unpkg.com; style-src 'self' 'unsafe-inline' blob: data: fonts.bunny.net unpkg.com *.vorwerk-digital.com; img-src 'self' blob: data: https: i.ytimg.com cdn.jsdelivr.net ui-avatars.com m.media-amazon.com s.lubimyczytac.pl tile.openstreetmap.org www.igdb.com assets.tmecosys.com *.vorwerk-digital.com; font-src 'self' blob: data: fonts.bunny.net unpkg.com patternlib-all.prod.external.eu-tm-prod.vorwerk-digital.com; object-src 'none'; frame-ancestors 'self'; connect-src 'self' https: wss: blob: api.github.com; form-action 'self' https://id.${DOMAIN_NAME}; media-src 'self' blob: data:; worker-src 'self' blob: data:; child-src 'self' blob: data:; frame-src 'self' www.youtube.com s.tradingview.com www.tradingview-widget.com blob: data:"
      traefik.http.routers.paperlessngx.middlewares: "paperlessngx-csp,secHeaders@file"
      traefik.http.services.paperlessngx.loadbalancer.server.port: "8000"
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.display.name: "Paperless-ngx"
      wud.display.icon: "sh:paperless-ngx"
      wud.link.template: "https://github.com/paperless-ngx/paperless-ngx/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  paperlessngx:
    name: paperlessngx-web
    driver: bridge
    external: false
  traefik:
    external: true

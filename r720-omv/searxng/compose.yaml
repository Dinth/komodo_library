x-versions:
  searxng: &searxng-version "docker.io/searxng/searxng:2026.9.8-3fdc6d753"
  valkey: &valkey-version "docker.io/valkey/valkey:9.1.2-alpine"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  searxng-valkey:
    image: *valkey-version
    container_name: searxng-valkey
    hostname: searxng-valkey
    ipc: private
    restart: unless-stopped
    command: ['valkey-server','--save','30','1','--loglevel','warning']
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128M
    healthcheck:
      test: '[ $$(valkey-cli ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    volumes:
      - /opt/docker/searxng/valkey-data:/data
    networks:
      - searxng
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      wud.display.name: "Searxng - Valkey"
      wud.display.icon: "sh-searxng"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+\-alpine$$'
      wud.link.template: 'https://github.com/valkey-io/valkey/releases/tag/$${major}.$${minor}.$${patch}'

  searxng:
    image: *searxng-version
    container_name: searxng
    hostname: searxng
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 1 Granian worker measured at ~200 MB RSS, so the old 512M ceiling only
    # held because GRANIAN_WORKERS was never set and Granian defaults to one.
    mem_limit: 1G
    environment:
      TZ: "${TZ}"
      SEARXNG_BASE_URL: "https://search.${DOMAIN_NAME}/"
      # Upstream flipped the default to GET in 2026 (searxng/searxng#3619).
      # With GET the query string lands in Traefik's access log and from there
      # in Loki, so every search term would be retained for ~31 days. POST keeps
      # the query in the request body, where it is not logged.
      SEARXNG_METHOD: "POST"
      # The limiter is the only rate limiting in front of this instance, and it
      # is a silent no-op without Valkey (searx/limiter.py: "The limiter
      # requires Valkey"). The settings file used to declare the connection
      # under the pre-rename `redis:` key, which current SearXNG never reads —
      # so the searxng-valkey container was running unused.
      # Needs /etc/searxng/limiter.toml for trusted_proxies + pass_ip.
      SEARXNG_LIMITER: "true"
      SEARXNG_VALKEY_URL: "valkey://searxng-valkey:6379/0"
      # The image has run Granian, not uWSGI, since before the previous pin, so
      # the old UWSGI_WORKERS/UWSGI_THREADS vars were doing nothing at all.
      # Granian defaults to a single worker. WSGI concurrency is
      # workers x blocking_threads, so 2 x 4 = 8 in-flight requests — enough for
      # OpenWebUI's WEB_SEARCH_CONCURRENT_REQUESTS=10 without a 4-worker
      # memory footprint.
      GRANIAN_WORKERS: "${SEARXNG_WORKERS:-2}"
      GRANIAN_BLOCKING_THREADS: "${SEARXNG_THREADS:-4}"
    depends_on:
      searxng-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-nv", "-t1", "--spider", "0.0.0.0:8080/"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "9234:8080"
    volumes:
      - /opt/docker/searxng/searxng:/etc/searxng:rw
      # The image declares a VOLUME at /var/cache/searxng. Without a bind mount
      # every redeploy gets a fresh anonymous volume and the favicon/engine
      # cache is thrown away. Must be owned by 977:977 (the container's user).
      - /opt/docker/searxng/searxng-data:/var/cache/searxng:rw
    networks:
      - searxng
      - traefik
    # Was max-size 1m / max-file 1. A single 1 MB file rotates fast enough that
    # lines can be lost before Alloy tails them — there were no searxng logs in
    # Loki at all for the 30-31 Aug window, which made the scan that hit this
    # container impossible to investigate after the fact.
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.searxng.rule: "Host(`search.${DOMAIN_NAME}`)"
      traefik.http.routers.searxng.entrypoints: "websecure"
      traefik.http.routers.searxng.tls: "true"
      traefik.http.routers.searxng.tls.certresolver: "letsencrypt"
      traefik.http.routers.searxng.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.searxng.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.searxng.middlewares: "secHeaders@file"
      traefik.http.services.searxng.loadbalancer.server.port: "8080"
      wud.watch: "true"
      # SearXNG is a rolling release: it publishes no GitHub releases and no git
      # tags at all, so the usual '^v\d+\.\d+\.\d+$' + /releases/tag/ pattern
      # matched nothing and linked to a 404. Its Docker tags are
      # YYYY.M.D-<short-commit>, which parses as semver with the commit as the
      # prerelease part, so the date drives ordering and ${prerelease} gives the
      # exact commit the image was built from.
      wud.tag.include: '^\d{4}\.\d{1,2}\.\d{1,2}-[0-9a-f]{7,}$$'
      wud.link.template: 'https://github.com/searxng/searxng/commit/$${prerelease}'
      wud.display.name: "Searxng"
      wud.display.icon: "sh-searxng"

networks:
  searxng:
    name: searxng
    driver: bridge
    external: false
  traefik:
    external: true

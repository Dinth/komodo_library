x-versions:
  loki: &loki-version "grafana/loki:3.7.8"
  promtail-socket-proxy: &promtail-socket-proxy-version "wollomatic/socket-proxy:1.13.1"
  alloy: &alloy-version "grafana/alloy:v1.19.2"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  promtail-socket-proxy:
    image: *promtail-socket-proxy-version
    container_name: promtail-socket-proxy
    ipc: private
    command:
      - '-loglevel=info'
      - '-allowfrom=alloy'
      - '-listenip=0.0.0.0'
      - '-allowGET=/v1\..{1,2}/(version|containers/.*|networks|events)'
      - '-allowHEAD=/_ping'
      - '-watchdoginterval=1200'
      - '-stoponwatchdog'
      - '-shutdowngracetime=10'
      - '-allowhealthcheck'
    restart: unless-stopped
    read_only: true
    mem_limit: 128M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:${DOCKER_SOCKET_GID}"
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/wollomatic/socket-proxy/releases/tag/$${major}.$${minor}.$${patch}"
      wud.display.name: 'Docker Socket Proxy - Promtail'
      wud.display.icon: 'mdi:connection'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    logging: *default-logging

  loki:
    container_name: loki
    image: *loki-version
    restart: unless-stopped
    user: ${DOCKER_PUID}:${DOCKER_PGID}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    command: ["-config.file=/etc/loki/local-config.yml"]
    environment:
      TZ: "${TZ}"
    hostname: loki
    ipc: private
    networks:
      - monitoring
      - traefik
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/docker/loki-promtail/loki-config.yml:/etc/loki/local-config.yml:ro
      - /opt/docker/loki-promtail/loki_storage:/loki
    labels:
      # http://10.10.1.13:3100 (log shippers on other hosts) is served by Traefik's loki entrypoint behind
      # trusted-allowlist (LAN, workstations, Tailscale, Docker).
      traefik.enable: "true"
      traefik.http.routers.loki.entrypoints: "loki"
      traefik.http.routers.loki.rule: "PathPrefix(`/`)"
      traefik.http.routers.loki.middlewares: "trusted-allowlist@docker"
      traefik.http.routers.loki.service: "loki"
      traefik.http.services.loki.loadbalancer.server.port: "3100"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "Loki"
      wud.display.icon: "si:grafana"
      wud.link.template: 'https://github.com/grafana/loki/releases/tag/v$${major}.$${minor}.$${patch}'
    logging: *default-logging

  alloy:
    image: *alloy-version
    container_name: alloy
    restart: unless-stopped
    mem_limit: 2G
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - CHOWN
    security_opt:
      - no-new-privileges:true
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
      - "1515:1515/udp"
      - "1515:1515/tcp"
      # 12345 (Alloy UI/debug API, self-metrics) is not published: nothing
      # outside the container uses it. Open the UI with `ssh -L 12345:<alloy IP>:12345`.
    depends_on:
      loki:
        condition: service_healthy
      promtail-socket-proxy:
        condition: service_started
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy", "--disable-reporting" ]
    environment:
      TZ: "${TZ}"
      HOSTNAME: "r720-omv"
    healthcheck:
      # Image (ubuntu, no curl/wget) — probe the running server's readiness
      # endpoint via bash's /dev/tcp instead of validating the config file.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /opt/docker/loki-promtail/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /opt/docker/loki-promtail/alloy-storage:/var/lib/alloy
    labels:
      wud.watch: "true"
      wud.tag.include: '^v\d+\.\d+\.\d+$$'
      wud.display.name: "Grafana Alloy"
      wud.display.icon: "si:grafana"
      wud.link.template: "https://github.com/grafana/alloy/releases/tag/v$${major}.$${minor}.$${patch}"
    networks:
      - monitoring
    logging: *default-logging

networks:
  monitoring:
    name: monitoring
    driver: bridge
    external: true
  traefik:
    external: true

x-versions:
  scanopy-daemon-version: &scanopy-daemon-version ghcr.io/scanopy/scanopy/daemon:v0.17.13
  scanopy-server-version: &scanopy-server-version ghcr.io/scanopy/scanopy/server:v0.17.13
  scanopy-postgres-version: &scanopy-postgres-version postgres:18.6-alpine
  scanopy-snapshot-version: &scanopy-snapshot-version curlimages/curl:8.21.0

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-scanopy-env: &scanopy-env
  SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
  SCANOPY_SERVER_PORT: ${SCANOPY_SERVER_PORT:-60072}
  SCANOPY_DAEMON_PORT: ${SCANOPY_DAEMON_PORT:-60073}

services:
  scanopy-daemon:
    image: *scanopy-daemon-version
    container_name: scanopy-daemon
    ipc: private
    network_mode: host
    # Not privileged: LAN scanning needs raw sockets + net admin, nothing more.
    # host netns stays (required for discovery); `ports:` removed — it is
    # ignored/invalid under host networking.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    mem_limit: 1G
    environment:
      <<: *scanopy-env
      SCANOPY_SERVER_URL: ${SCANOPY_SERVER_URL:-http://127.0.0.1:60072}
      SCANOPY_PORT: ${SCANOPY_DAEMON_PORT:-60073}
      SCANOPY_BIND_ADDRESS: ${SCANOPY_BIND_ADDRESS:-0.0.0.0}
      SCANOPY_NAME: "r720-omv_daemon"
      SCANOPY_HEARTBEAT_INTERVAL: ${SCANOPY_HEARTBEAT_INTERVAL:-30}
      SCANOPY_MODE: "daemon_poll"
      SCANOPY_DAEMON_API_KEY: "${SCANOPY_TOKEN}"
      SCANOPY_NETWORK_ID: "81dfd914-2d19-49de-978c-87388da0b2bc"
    volumes:
      - /opt/docker/scanopy/scanopy_daemon-config:/root/.config/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SCANOPY_DAEMON_PORT:-60073}/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/scanopy/scanopy/releases/tag/v$${major}.$${minor}.$${patch}"
      wud.display.name: "Scanopy Daemon"

  scanopy-postgres:
    image: *scanopy-postgres-version
    container_name: scanopy-postgres
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, FOWNER]
    mem_limit: 1G
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${SCANOPY_DB_PASS}"
    volumes:
      - /opt/docker/scanopy/scanopy_postgres:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [scanopy]
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+-alpine$$'
      wud.link.template: "https://www.postgresql.org/docs/release/$${major}.$${minor}/"
      wud.display.name: "Postgres - Scanopy"
  scanopy-server:
    image: *scanopy-server-version
    container_name: scanopy-server
    ipc: private
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 2G
    ports:
      - "${SCANOPY_SERVER_PORT:-60072}:${SCANOPY_SERVER_PORT:-60072}"
    environment:
      <<: *scanopy-env
      SCANOPY_DATABASE_URL: "postgresql://postgres:${SCANOPY_DB_PASS}@scanopy-postgres:5432/scanopy"
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      # Single-user instance published straight onto the LAN: without this,
      # anyone who can reach :60072 can create an account.
      SCANOPY_DISABLE_REGISTRATION: "true"
      SCANOPY_SNAPSHOT_RETENTION_DAYS_OVERRIDE: ${SCANOPY_SNAPSHOT_RETENTION_DAYS:-90}
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://10.10.1.13:${SCANOPY_SERVER_PORT:-60072}}
      SCANOPY_INTEGRATED_DAEMON_URL: http://169.254.0.1:${SCANOPY_DAEMON_PORT:-60073}
    volumes:
      - /opt/docker/scanopy/scanopy_data:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      scanopy-postgres: { condition: service_healthy }
    networks: [scanopy]
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/scanopy/scanopy/releases/tag/v$${major}.$${minor}.$${patch}"
      wud.display.name: "Scanopy Server"
      wud.display.icon: "sh:scanopy"

  # Scanopy takes topology snapshots only on demand — there is no built-in
  # scheduler — so this fires POST /api/v1/snapshots once a week. Snapshots are
  # what turn the inventory into change detection: each one closes the current
  # entity rows so later scans diff against it. Checks every 10 min and fires in
  # the 04:00 hour on Sundays, then sleeps an hour so it cannot double-fire;
  # that keeps it aligned to wall-clock instead of drifting from container start.
  scanopy-snapshot:
    image: *scanopy-snapshot-version
    container_name: scanopy-snapshot
    depends_on:
      scanopy-server: { condition: service_started }
    environment:
      TZ: "${TZ}"
      SCANOPY_URL: http://scanopy-server:${SCANOPY_SERVER_PORT:-60072}
      SCANOPY_NETWORK_ID: "81dfd914-2d19-49de-978c-87388da0b2bc"
      SCANOPY_SNAPSHOT_KEY: "${SCANOPY_SNAPSHOT_KEY}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          if [ "$$(date +%u)" = "7" ] && [ "$$(date +%H)" = "04" ]; then
            if curl -fsS -X POST "$$SCANOPY_URL/api/v1/snapshots" \
                 -H "Authorization: Bearer $$SCANOPY_SNAPSHOT_KEY" \
                 -H 'Content-Type: application/json' \
                 -d "{\"network_id\":\"$$SCANOPY_NETWORK_ID\"}" >/dev/null; then
              echo "[snapshot] taken $$(date -Iseconds)"
            else
              echo "[snapshot] FAILED $$(date -Iseconds)"
            fi
            sleep 3600
          fi
          sleep 600
        done
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 32M
    networks: [scanopy]
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/curl/curl/releases"
      wud.display.name: "Scanopy Snapshot Scheduler"

networks:
  scanopy:
    name: scanopy
    driver: bridge

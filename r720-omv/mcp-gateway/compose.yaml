x-versions:
  mcp-gateway-socket-proxy-version: &mcp-gateway-socket-proxy-version wollomatic/socket-proxy:1.13.1
  # Pinned by DIGEST, not :latest. Komodo's Global Auto Update kept pulling new
  # :latest builds that silently tightened validation (catalog paths, then
  # bind-mount allow-lists), repeatedly breaking the gateway. A digest can't
  # drift. To move deliberately: bump this to a new `docker/mcp-gateway@sha256:…`
  # (get it from `docker buildx imagetools inspect docker/mcp-gateway:vX.Y.Z`),
  # re-test, and commit. This is v0.x from 2026-07-23.
  mcp-gateway-version: &mcp-gateway-version docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mcp-gateway-socket-proxy:
    image: *mcp-gateway-socket-proxy-version
    container_name: mcp-gateway-socket-proxy
    ipc: private
    restart: unless-stopped
    read_only: true
    mem_limit: 64M
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65534:${DOCKER_SOCKET_GID}"
    command:
      - '-loglevel=info'
      - '-allowfrom=0.0.0.0/0'
      - '-listenip=0.0.0.0'
      - '-allowGET=/v1\..{1,2}/(containers/.*|images/.*|events|info|version)|/version'
      - '-allowHEAD=/_ping'
      - '-allowPOST=/v1\..{1,2}/(containers/.*|images/create)'
      - '-allowhealthcheck'
      - '-watchdoginterval=1200'
      - '-stoponwatchdog'
      - '-shutdowngracetime=10'     
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mcp-gateway]
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    logging: *default-logging
    labels:
      wud.watch: "true"

  mcp-gateway:
    image: *mcp-gateway-version
    container_name: mcp-gateway
    ipc: private
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    # Grants the socket group so the gateway can read/write the docker.sock
    # mounted below (needed for the stdio-attach step — see that volume's note).
    group_add: ["${DOCKER_SOCKET_GID}"]
    mem_limit: 512M
    ports: ["4888:8080"]
    # --catalog paths MUST resolve under ~/.docker/mcp/catalogs/ (HOME=/ in this
    # image), hence the single-file mount below -- an absolute /mcp path is
    # rejected. --registry has no such constraint. Signature verification wants
    # every image digest-pinned, which the locally-built mitmproxy-mcp/mcpmqtt
    # images cannot satisfy.
    command:
      - "--transport=sse"
      - "--port=8080"
      - "--catalog=custom.yaml"
      - "--registry=/mcp/registry.yaml"
      - "--verify-signatures=false"
    environment:
      TZ: "${TZ}"
      DOCKER_HOST: "tcp://mcp-gateway-socket-proxy:2375"
      # Pin the SSE/HTTP bearer token to a stable value. Without this the
      # gateway generates a NEW random token on every boot, silently breaking
      # every network client (local Claude, OpenWebUI, ZeroClaw) on each
      # restart. Set MCP_GATEWAY_AUTH_TOKEN in Komodo to a long random string
      # (e.g. `openssl rand -hex 32`); rotating it forces all clients to update.
      MCP_GATEWAY_AUTH_TOKEN: "${MCP_GATEWAY_AUTH_TOKEN}"
      # This gateway build refuses to spawn catalog servers whose bind mounts
      # sit outside /tmp unless whitelisted. Our servers (containers-data,
      # mcpmqtt, mitmproxy-mcp) mount under /opt/docker, so allow that root;
      # mitmproxy needs write access to its own confdir.
      MCP_GATEWAY_DOCKER_BIND_ALLOWED_PATHS: "/opt/docker"
      MCP_GATEWAY_DOCKER_BIND_ALLOW_WRITABLE_PATHS: "/opt/docker/mcp-gateway/mitmproxy-mcp"
    volumes:
      - /opt/docker/mcp-gateway/mcp-gateway_config:/mcp:ro
      - /opt/docker/mcp-gateway/mcp-gateway_config/registry.yaml:/.docker/mcp/catalogs/custom.yaml:ro
      - /opt/docker/mcp-gateway/mcp-gateway_certs:/certs:ro
      - /opt/docker:/opt/docker:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mcp-gateway-socket-proxy: { condition: service_healthy }
    networks: [mcp-gateway]
    logging: *default-logging
    labels:
      wud.watch: "true"
  # Gateway-spawned stdio MCP servers are listed in
  # /opt/docker/mcp-gateway/mcp-gateway_config/registry.yaml.
  # Their images are produced by Komodo Builds (see ../../builds.toml) that run on the
  # r720-omv server-builder, tagged as mitmproxy-mcp:latest and mcpmqtt:latest.
  # mcpmqtt config (broker + topic ACL) lives at /opt/docker/mcp-gateway/mcpmqtt-config/config.json.

networks:
  mcp-gateway:
    name: mcp-gateway
    driver: bridge
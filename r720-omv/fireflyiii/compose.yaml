x-versions:
  fireflyiii: &fireflyiii-version "fireflyiii/core:version-6.6.6"
  fireflyiii-dataimporter: &fireflyiii-dataimporter-version "fireflyiii/data-importer:version-2.3.4"
  fireflyiii-mcp: &fireflyiii-mcp-version "ghcr.io/daften/fireflyiii-mcp:0.4.2"
  postgres: &postgres-version "postgres:18.6-alpine"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  fireflyiii:
    image: *fireflyiii-version
    container_name: fireflyiii
    hostname: fireflyiii
    ipc: private
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4G
    environment:
      DB_CONNECTION: "pgsql"
      DB_PORT: "5432"
      DB_HOST: "10.10.1.13"
      DB_DATABASE: "fireflyiii"
      DB_USERNAME: "fireflyiii"
      DB_PASSWORD: "${FIREFLYIII_DB_PASS}"
      APP_KEY: "${FIREFLYIII_APP_KEY}"
      DEFAULT_LANGUAGE: "en_GB"
      TZ: "${TZ}"
      ENABLE_EXTERNAL_RATES: "true"
      APP_URL: "https://finance.${DOMAIN_NAME}"
      TRUSTED_PROXIES: "*"
      SITE_OWNER: "michal@gawronskikot.com"
      # v2 is a PARTIAL overlay, not a replacement: config/view.php stacks
      # resources/views/v2 (50 files - accounts, transactions, administrations,
      # dashboard) on top of the 148-file v1 tree. Every page v2 does not
      # implement - budgets, bills, categories, reports, rules, piggy banks,
      # recurring, tags, webhooks, profile - falls through to a v1 template
      # rendered without its matching layout skeleton. That is what made the UI
      # look broken. Upstream default is v1 and still calls v2 "very
      # experimental ... be wary of data loss".
      FIREFLY_III_LAYOUT: "v1"
      SESSION_DRIVER: "file"
      # Two users on NVMe-backed storage: the file cache is fine here. Revisit
      # redis only if page loads actually get slow.
      CACHE_DRIVER: "file"
      # Served only over HTTPS via Traefik, so the session cookie must be
      # secure-flagged. "strict" samesite is known to break the login redirect,
      # so lax is deliberate. PHP_SESSION_COOKIE_SECURE is the base image's own
      # knob and defaults to false - it has to be set separately.
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      PHP_SESSION_COOKIE_SECURE: "true"
      # Audit logging is ON by default (AUDIT_LOG_LEVEL defaults to "info" when
      # unset). Left at the default level, but pinned to stdout only: the
      # default is ["audit_daily", "audit_stdout"], and audit_daily writes files
      # inside the container that nothing rotates or reads. stdout reaches
      # Alloy -> Loki like every other stack.
      AUDIT_LOG_CHANNEL: "audit_stdout"
      # Basildon, Essex.
      MAP_DEFAULT_LAT: "51.5762"
      MAP_DEFAULT_LONG: "0.4881"
      MAP_DEFAULT_ZOOM: "12"
      # Consumed by the /api/v1/cron/<token> endpoint that Cronicle calls
      # nightly. Without it nothing fires bill reminders or auto-budget
      # rollovers - last_rt_job sat at 0 since install.
      STATIC_CRON_TOKEN: "${FIREFLYIII_STATIC_CRON_TOKEN}"
    ports:
      - 4747:8080/tcp
    volumes:
      - /opt/docker/fireflyiii/fireflyiii_upload:/var/www/html/storage/upload
      # Laravel Passport signing keys. They live directly in storage/, which the
      # image does NOT persist, so every container recreate regenerated them and
      # silently invalidated every API token - which is what broke both data
      # importers (HTTP 401 "Unauthenticated" on the nightly autoimport).
      # Mounted read-only: Firefly calls "passport:keys" without --force and
      # tolerates its failure, so the keys are never rewritten.
      - /opt/docker/fireflyiii/oauth/oauth-private.key:/var/www/html/storage/oauth-private.key:ro
      - /opt/docker/fireflyiii/oauth/oauth-public.key:/var/www/html/storage/oauth-public.key:ro
    networks:
      - fireflyiii
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.fireflyiii.entrypoints: websecure
      traefik.http.routers.fireflyiii.rule: Host(`finance.${DOMAIN_NAME}`)
      traefik.http.routers.fireflyiii.tls: "true"
      traefik.http.routers.fireflyiii.tls.certresolver: letsencrypt
      traefik.http.routers.fireflyiii.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.fireflyiii.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.fireflyiii.middlewares: "secHeaders@file"
      traefik.http.services.fireflyiii.loadbalancer.server.port: "8080"
      wud.watch: "true"
      wud.tag.include: '^version-\d+\.\d+\.\d+$$'
      wud.display.name: "Firefly III"
      wud.display.icon: "sh:firefly-iii"
      wud.link.template: "https://github.com/firefly-iii/firefly-iii/releases/v$${major}.$${minor}.$${patch}"

  fireflyiii_paulina_dataimporter:
    image: *fireflyiii-dataimporter-version
    container_name: fireflyiii_paulina_dataimporter
    hostname: fireflyiii_paulina_dataimporter
    ipc: private
    restart: unless-stopped
    user: www-data
    # The /import configs are owned michal:users (uid 1000, gid 100) so filebrowser
    # can manage them, but this runs as www-data (uid 33) and so lands in "other",
    # which the 2770 dirs deny - autoimport died on scandir(/import) before it read
    # a single config. Join gid 100 to read them without moving or chowning anything.
    group_add:
      - "100"
    working_dir: /var/www/html
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    environment:
      FIREFLY_III_ACCESS_TOKEN: "${FIREFLYIII_PAULINA_ACCESS_TOKEN}"
      FIREFLY_III_URL: "http://fireflyiii:8080"
      NORDIGEN_ID: "${FIREFLYIII_PAULINA_NORD_ID}"
      NORDIGEN_KEY: "${FIREFLYIII_PAULINA_NORD_KEY}"
      CAN_POST_AUTOIMPORT: "true"
      IMPORT_DIR_ALLOWLIST: "/import"
      AUTO_IMPORT_SECRET: "${FIREFLYIII_PAULINA_AUTOIMPORT_KEY}"
    ports:
      - 4749:8080/tcp
    volumes:
      - /opt/docker/fireflyiii/fireflyiii_dataimporter_paulina_upload:/var/www/html/storage/upload
      - /Data/IT/filebrowser-data/users/paulina/Paulina-Documents/firefly_configurations:/import:ro
    networks:
      - fireflyiii
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^version-\d+\.\d+\.\d+$$'
      wud.display.name: "Firefly III Data importer"
      wud.display.icon: "sh:firefly-iii"
      wud.link.template: "https://github.com/firefly-iii/data-importer/releases/v$${major}.$${minor}.$${patch}"

  fireflyiii_michal_dataimporter:
    image: *fireflyiii-dataimporter-version
    container_name: fireflyiii_michal_dataimporter
    hostname: fireflyiii_michal_dataimporter
    ipc: private
    restart: unless-stopped
    user: www-data
    # See the paulina importer above: gid 100 ("users") is what makes the
    # read-only /import bind mount readable to www-data.
    group_add:
      - "100"
    working_dir: /var/www/html
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    environment:
      FIREFLY_III_ACCESS_TOKEN: "${FIREFLYIII_MICHAL_ACCESS_TOKEN}"
      FIREFLY_III_URL: "http://fireflyiii:8080"
      NORDIGEN_ID: "${FIREFLYIII_MICHAL_NORD_ID}"
      NORDIGEN_KEY: "${FIREFLYIII_MICHAL_NORD_KEY}"
      CAN_POST_AUTOIMPORT: "true"
      # One subdirectory per bank, each driven by its own Cronicle event. A
      # single /import run covering all six took 241s -> 264s -> 300s on
      # successive nights and then hit nginx's 300s ceiling, returning 504.
      # Cronicle recorded the failure and froze this event's scheduler cursor,
      # so the import silently stopped running altogether. Split, each bank
      # takes ~50s and one failing bank no longer stops the other five.
      IMPORT_DIR_ALLOWLIST: "/import/santander,/import/amex,/import/barclaycard,/import/capitalone,/import/tesco,/import/mbank"
      AUTO_IMPORT_SECRET: "${FIREFLYIII_MICHAL_AUTOIMPORT_KEY}"
    ports:
      - 4748:8080/tcp
    volumes:
      - /Data/IT/filebrowser-data/users/michal/Michal-Documents/firefly_configurations:/import:ro
      - /opt/docker/fireflyiii/fireflyiii_dataimporter_michal_upload:/var/www/html/storage/upload
    networks:
      - fireflyiii
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^version-\d+\.\d+\.\d+$$'
      wud.display.name: "Firefly III Data importer"
      wud.display.icon: "sh:firefly-iii"
      wud.link.template: "https://github.com/firefly-iii/data-importer/releases/v$${major}.$${minor}.$${patch}"

  fireflyiii-signal-shim:
    # Firefly III 6.6.x can only notify over mail, Slack or Pushover - its ntfy
    # channel is commented out upstream (issue 12083). This bridges Firefly's
    # Slack notifications onto the signal-cli-rest-api that Grafana already
    # uses. The hook is UrlValidator::isValidWebhookURL(), which accepts any
    # URL ending in "/slack" as well as the real Slack/Discord prefixes - so no
    # Slack account and no outbound internet access are involved.
    #
    # Built locally from the committed Dockerfile + shim.py (same pattern as
    # grafana-prometheus/ha-bt-exporter): image: just pins the local tag, and
    # pull_policy:never stops the stack-wide `compose pull` from trying to
    # fetch this non-registry image and aborting the deploy.
    build:
      context: ./signal-shim
      dockerfile: Dockerfile
    image: fireflyiii-signal-shim:latest
    pull_policy: never
    container_name: fireflyiii-signal-shim
    # Hyphens rather than the underscores the importers use: Firefly stores
    # this as a URL, and PHP's filter_var()/parse_url reject underscores in
    # hostnames.
    hostname: fireflyiii-signal-shim
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64M
    environment:
      TZ: "${TZ}"
      # Same published port Grafana's contact point posts to: signal-rest-api
      # lives in another stack, so this avoids coupling the two networks.
      SIGNAL_API_URL: "http://10.10.1.13:3162/v2/send"
      # Sender only - reuses the number Grafana's contact point already sends
      # from. NOTE: SIGNAL_TECH_ID is deliberately NOT reused as a recipient.
      # It is a Signal *group* id, and routing per-user notifications into a
      # shared group would publish one user's bill amounts and merchants to
      # everyone in it.
      SIGNAL_PHONE_NUMBER: "${SIGNAL_PHONE_NUMBER}"
      # Per-user routing. Firefly stores slack_webhook_url as a PER-USER
      # preference, so each user gets their own URL; the token in the path
      # selects the recipient. Every path still ends in "/slack", which is what
      # Firefly's UrlValidator accepts, and an unknown token 404s.
      # Format: "<token>:<recipient>[|<recipient>],<token2>:<recipient>"
      SHIM_ROUTES: "${FIREFLYIII_SIGNAL_TOKEN_MICHAL}:${SIGNAL_MICHAL_ID},${FIREFLYIII_SIGNAL_TOKEN_PAULINA}:${SIGNAL_PAULINA_ID}"
    networks:
      - fireflyiii
    ports: []
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging
    labels:
      wud.watch: "false"

  fireflyiii-mcp:
    image: *fireflyiii-mcp-version
    container_name: fireflyiii-mcp
    hostname: fireflyiii-mcp
    ipc: private
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 512M
    environment:
      TZ: "${TZ}"
      # PAT-only mode: FIREFLY_OAUTH_CLIENT_ID is deliberately UNSET. Its
      # absence is what disables the OAuth surface; the server then forwards
      # each caller's `Authorization: Bearer <PAT>` straight to Firefly. So
      # callers are separated BY TOKEN, matching the tj.user_id separation the
      # data relies on - michal's and Paulina's tokens stay out of the stack.
      FIREFLY_URL: "http://fireflyiii:8080"
      # Same compose network, so the token never leaves the host and Traefik
      # is not in the path.
      MCP_PRESET: "default"
      # Not cosmetic: the image ships ~140 tools in 14 groups and loading all
      # of them floods a client's context before any work starts.
      HOME: "/tmp"
      NODE_ENV: "production"
    tmpfs:
      - /tmp
    depends_on:
      # service_started, NOT service_healthy: the fireflyiii service defines no
      # healthcheck, so service_healthy would never be satisfied and this would
      # never start. The MCP retries its upstream anyway.
      - fireflyiii
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      # MCP-server port pool (513x); 5133-5136 taken. NOT exposed via Traefik.
      - 5137:3000/tcp
    networks:
      - fireflyiii
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "Firefly III MCP"
      wud.display.icon: "sh:firefly-iii"
      wud.link.template: "https://github.com/daften/fireflyiii-mcp/releases/tag/v$${major}.$${minor}.$${patch}"

  fireflyiii-postgres:
    image: *postgres-version
    container_name: fireflyiii-postgres
    hostname: fireflyiii-postgres
    ipc: private
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    environment:
      TZ: "${TZ}"
      POSTGRES_DB: "fireflyiii"
      POSTGRES_USER: "fireflyiii"
      POSTGRES_PASSWORD: "${FIREFLYIII_DB_PASS}"
      # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker and puts
      # its VOLUME on /var/lib/postgresql, so a bind mount to .../data lands
      # beside the cluster and initdb quietly creates an empty one. Pin it.
      PGDATA: "/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - /opt/docker/fireflyiii/fireflyiii-postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - fireflyiii
      - adminer
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^18\.\d+-alpine$$'
      wud.display.name: "Firefly III PostgreSQL"
      wud.display.icon: "sh:postgresql"
      wud.link.template: 'https://github.com/postgres/postgres/releases/tag/REL_$${major}_$${minor}'

networks:
  fireflyiii:
    name: fireflyiii
    driver: bridge
    external: false
  traefik:
    external: true
  adminer:
    external: true

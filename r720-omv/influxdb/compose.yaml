x-versions:
  influxdb: &influxdb-version "influxdb:2.9.1-alpine"
  telegraf-version: &telegraf-version "telegraf:1.40-alpine"
  socket-proxy: &socket-proxy-version "wollomatic/socket-proxy:1.13.1"
  unpoller-version: &unpoller-version "ghcr.io/unpoller/unpoller:v2.21.0"

services:
  # Read-only Docker API for telegraf's docker input (per-container health
  # and state, scraped by Prometheus for the ContainerUnhealthy alert).
  telegraf-socket-proxy:
    image: *socket-proxy-version
    container_name: telegraf-socket-proxy
    ipc: private
    restart: unless-stopped
    read_only: true
    mem_limit: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:${DOCKER_SOCKET_GID}"
    command:
      - '-loglevel=info'
      - '-allowfrom=telegraf'
      - '-listenip=0.0.0.0'
      - '-allowGET=/(v[0-9.]+/)?(containers/json|containers/[^/]+/(json|stats)|info|version|_ping)'
      - '-allowHEAD=/(v[0-9.]+/)?_ping'
      - '-allowhealthcheck'
      - '-watchdoginterval=1200'
      - '-stoponwatchdog'
      - '-shutdowngracetime=10'
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - telegraf-docker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/wollomatic/socket-proxy/releases/tag/$${major}.$${minor}.$${patch}"
      wud.display.name: "Docker Socket Proxy - Telegraf"
      wud.display.icon: "mdi:connection"

  influxdb:
    container_name: influxdb
    image: *influxdb-version
    restart: unless-stopped
    mem_limit: 4G
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_TOKEN}"
      DOCKER_INFLUXDB_INIT_ORG: "wickhay"
      DOCKER_INFLUXDB_INIT_BUCKET: "home_assistant"
      DOCKER_INFLUXDB_INIT_RETENTION: "2920d"  # 8y — matches live home_assistant bucket (init-only; inert unless volume rebuilt)
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      TZ: "${TZ}"
    hostname: influxdb
    ipc: private
    networks:
      - monitoring
    ports:
      - "8086:8086/tcp"
    volumes:
      - /opt/docker/influxdb-telegraf/influxdb_storage:/var/lib/influxdb2
      - /opt/docker/influxdb-telegraf/influxdb_config:/etc/influxdb2
      - /opt/docker/influxdb-telegraf/influxdb_scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+-alpine$$'
      wud.display.name: "InfluxDB"
      wud.display.icon: "si:influxdb"
      wud.link.template: 'https://github.com/influxdata/influxdb/releases/tag/v$${major}.$${minor}.$${patch}'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegraf:
    container_name: telegraf
    image: *telegraf-version
    restart: unless-stopped
    mem_limit: 512M
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_RAW  # Needed for SNMP/ICMP
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INFLUX_TOKEN: "${INFLUXDB_TOKEN}"
      TZ: "${TZ}"
    hostname: telegraf
    ipc: private
    networks:
      - monitoring
      - telegraf-docker
    ports: []
    volumes:
      - /opt/docker/influxdb-telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
        restart: true
      telegraf-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5435/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+-alpine$$'
      wud.display.name: "Telegraf"
      wud.display.icon: "si:influxdb"
      wud.link.template: 'https://github.com/influxdata/telegraf/releases/tag/v$${major}.$${minor}.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  unpoller:
    container_name: unpoller
    image: *unpoller-version
    restart: unless-stopped
    mem_limit: 256M
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ}"
      # UniFi Controller configuration. .12 (r230-nixos): the unifi stack moved
      # there for good on 2026-09-20 (86e1d514) once the `./config` mount bug
      # that wiped the database on the first attempt was fixed. unpoller stays
      # here with influxdb and reaches the controller across the LAN, so this
      # cannot use the container name the way unifi-network-mcp does.
      UP_UNIFI_CONTROLLER_0_URL: "https://10.10.1.12:8443"
      UP_UNIFI_CONTROLLER_0_USER: "telegraf_monitor"
      UP_UNIFI_CONTROLLER_0_PASS: "${UNPOLLER_UNIFI_PASS}"
      UP_UNIFI_CONTROLLER_0_VERIFY_SSL: "false"
      UP_UNIFI_CONTROLLER_0_SAVE_SITES: "true"
      UP_UNIFI_CONTROLLER_0_SAVE_DPI: "false"
      UP_UNIFI_CONTROLLER_0_SAVE_IDS: "false"
      UP_UNIFI_CONTROLLER_0_SAVE_EVENTS: "false"
      UP_UNIFI_CONTROLLER_0_SAVE_ANOMALIES: "false"
      UP_UNIFI_CONTROLLER_0_SAVE_ALARMS: "false"
      # InfluxDB configuration
      UP_INFLUXDB_URL: "http://influxdb:8086"
      UP_INFLUXDB_ORG: "wickhay"
      UP_INFLUXDB_BUCKET: "network"
      UP_INFLUXDB_AUTH_TOKEN: "${INFLUXDB_TOKEN}"
      # Poller configuration
      UP_POLLER_DEBUG: "true"
      UP_POLLER_QUIET: "false"
    hostname: unpoller
    ipc: private
    networks:
      - monitoring
    ports: []
    volumes:
      - /opt/docker/influxdb-telegraf/unpoller_config:/config:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      # distroless/static image: no shell or wget. This is upstream's own check.
      test: ["CMD", "/usr/bin/unpoller", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.display.name: "UnPoller"
      wud.display.icon: "si:ubiquiti"
      wud.tag.include: '^v\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/unpoller/unpoller/releases/tag/v$${major}.$${minor}.$${patch}'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    name: monitoring
    driver: bridge
    external: true
  telegraf-docker:
    name: telegraf-docker
    driver: bridge
    internal: true

x-versions:
  signal-rest-api: &signal-rest-api-version "bbernhard/signal-cli-rest-api:0.100"
  apprise: &apprise-version "caronc/apprise:2.0.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  signal_rest_api:
    image: *signal-rest-api-version
    container_name: signal-rest-api
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - AUDIT_WRITE
      - DAC_OVERRIDE
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    mem_limit: 768M
    environment:
      MODE: "json-rpc" #supported modes: json-rpc, native, normal
      SIGNAL_CLI_UID: "${DOCKER_PUID}"
      SIGNAL_CLI_GID: "${DOCKER_PGID}"
      #AUTO_RECEIVE_SCHEDULE: "0 22 * * *" #enable this parameter on demand
    volumes:
      - "/opt/docker/signal-cli-api/signal-cli-api_data:/home/.local/share/signal-cli"
    networks:
      - signal-rest-api
      - traefik
    logging: *default-logging
    labels:
      # http://10.10.1.13:3162 (HA, pfSense, fireflyiii, Grafana) is served by Traefik's signal entrypoint behind
      # trusted-allowlist (LAN, workstations, Tailscale, Docker).
      traefik.enable: "true"
      traefik.http.routers.signal-rest-api.entrypoints: "signal"
      traefik.http.routers.signal-rest-api.rule: "PathPrefix(`/`)"
      traefik.http.routers.signal-rest-api.middlewares: "trusted-allowlist@docker"
      traefik.http.routers.signal-rest-api.service: "signal-rest-api"
      traefik.http.services.signal-rest-api.loadbalancer.server.port: "8080"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+$$'
      wud.display.name: "Signal Rest API"
      wud.display.icon: "sh:signal"
      wud.link.template: "https://github.com/bbernhard/signal-cli-rest-api/releases/tag/$${major}.$${minor}"

  # Lives here rather than in its own stack because signal-cli is its only
  # backend: the two version and deploy together, and apprise on its own would
  # be an empty shell. PriceBuddy is the reason it exists — its notification
  # methods are mail, database, pushover, gotify, apprise, telegram, discord
  # and ntfy (app/Enums/NotificationMethods.php), with no native Signal — but
  # it is a general fan-out, so other stacks can use it by joining the
  # `signal-rest-api` network below and having a `<key>.cfg` of their own
  # dropped into apprise_config on disk (the API cannot register one, see
  # APPRISE_CONFIG_LOCK). A consumer must then either name a specific tag or
  # log in as the apprise administrator (see APPRISE_AUTH_REQUIRED).
  apprise:
    image: *apprise-version
    container_name: apprise
    hostname: apprise
    ipc: private
    restart: unless-stopped
    # The image ships no USER directive, so it would otherwise run as root and
    # use PUID/PGID to drop afterwards. Starting as the docker user instead
    # means no root phase at all, which removes the need for the CHOWN,
    # DAC_OVERRIDE, SETUID and SETGID capabilities its entrypoint would want
    # for fixing ownership. The three bind mounts below must already be owned
    # by this uid:gid — the container can no longer correct them itself.
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    environment:
      TZ: "${TZ}"
      # 'simple' writes each saved config as a plain file named after its key,
      # so apprise_config/pricebuddy can be read and edited on disk. 'hash'
      # obscures the filename, which would make the signal:// URL — and the
      # phone numbers in it — awkward to audit or repair.
      APPRISE_STATEFUL_MODE: "simple"
      # The stored configs hold signal:// URLs with phone numbers, and without
      # the lock every container on the signal-rest-api network could read
      # them back via /get/<key>. Locked, a config can only be changed by
      # editing its .cfg file on disk, and /notify/<key> still delivers — but
      # only for the administrator below or a caller naming a specific tag.
      APPRISE_CONFIG_LOCK: "yes"
      # The lock alone makes apprise refuse (HTTP 400) any notification that is
      # untagged or tagged `all` unless it comes from an administrator — which
      # is exactly how autoheal (no tag) and pricebuddy (hardcoded `all`) call
      # it. So they authenticate as this admin, with the credentials in the
      # userinfo of their apprise URL. The password therefore ends up inside
      # URLs and must be URL-safe: letters and digits only.
      APPRISE_AUTH_REQUIRED: "yes"
      APPRISE_USER: "admin"
      APPRISE_PASSWORD: "${APPRISE_ADMIN_PASSWORD}"
      # A handful of notifications a day; one worker is ample.
      APPRISE_WORKER_COUNT: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    healthcheck:
      # /status returns 200 when healthy and 417 when not, so -f is meaningful
      # here (unlike pricebuddy's probe, where any response proves apache is up).
      # With APPRISE_AUTH_REQUIRED an anonymous /status is a 401, so the probe
      # logs in as the admin. `$$` leaves the expansion to the container's own
      # shell and env, keeping the password out of the healthcheck definition.
      test: ["CMD-SHELL", 'curl -fsS -o /dev/null --max-time 5 -u "$$APPRISE_USER:$$APPRISE_PASSWORD" http://127.0.0.1:8000/status || exit 1']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /opt/docker/signal-cli-api/apprise_config:/config
      - /opt/docker/signal-cli-api/apprise_plugin:/plugin
      - /opt/docker/signal-cli-api/apprise_attach:/attach
    networks:
      - signal-rest-api
    logging: *default-logging
    labels:
      autoheal: "true"
      # No Traefik router on purpose. The web UI would only be for creating or
      # testing a config; under APPRISE_CONFIG_LOCK configs are created on disk
      # instead, /notify (with the admin login) tests them just as well from
      # inside the network, and the stored configs hold phone numbers. Add a
      # router behind authelia-auth@docker if managing several consumers by
      # hand gets old.
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "Apprise"
      wud.display.icon: "sh:apprise"
      wud.link.template: "https://github.com/caronc/apprise-api/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  # Joined by wud, uptime-kuma, backrest and now pricebuddy (via apprise);
  # fireflyiii uses the published port instead.
  signal-rest-api:
    name: signal-rest-api
    driver: bridge
    external: false
  traefik:
    external: true

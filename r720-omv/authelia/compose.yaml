x-versions:
  # Base image the local patched image is built FROM (see Dockerfile).
  # Releases: https://github.com/authelia/authelia/releases
  # Bump this + redeploy (rebuild) to update; the WebAuthn patch re-applies.
  authelia-base: &authelia-base "authelia/authelia:4.39.28"
  valkey: &valkey-version "docker.io/valkey/valkey:9.1.2-alpine"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  authelia:
    # Locally patched build: go-webauthn v0.18 rejects the `appid: false`
    # extension output every iOS browser returns, breaking iPhone YubiKey
    # logins. Revert this build:/image:/pull_policy block to a plain
    # `image: *authelia-base` once v4.40.0 ships the fix:
    # https://github.com/authelia/authelia/issues/13146
    build:
      context: .
      args:
        BASE_IMAGE: *authelia-base
    # Bump the -pN suffix whenever the Dockerfile patches change: a
    # Dockerfile-only edit doesn't change the compose, so Komodo reuses the
    # cached image and never rebuilds. A new tag forces a fresh build.
    image: authelia-patched:4.39.28-p1
    pull_policy: never
    container_name: authelia
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    environment:
      TZ: "${TZ}"
      REDIS_PASSWORD: "${AUTHELIA_REDIS_PASS}"
      DOMAIN_NAME: "${DOMAIN_NAME}"
      AUTHELIA_STORAGE_LOCAL_PATH: "/config/db.sqlite3"
      AUTHELIA_SESSION_REDIS_HOST: authelia-valkey
      AUTHELIA_SESSION_REDIS_PORT: 6379
      X_AUTHELIA_CONFIG_FILTERS: "template"
    volumes:
      - /opt/docker/authelia/authelia_config:/config
    depends_on:
      authelia-valkey:
        condition: service_healthy
    networks:
      - authelia
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      # --- Router for the Authelia Portal ---
      traefik.http.routers.authelia.rule: "Host(`id.${DOMAIN_NAME}`)"
      traefik.http.routers.authelia.entrypoints: "websecure"
      traefik.http.routers.authelia.tls: "true"
      traefik.http.routers.authelia.tls.certresolver: "letsencrypt"
      traefik.http.routers.authelia.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.authelia.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.authelia.middlewares: "secHeaders@file"
      traefik.http.services.authelia.loadbalancer.server.port: "9091"
      # --- Middleware for other services to use for authentication ---
      traefik.http.middlewares.authelia-auth.forwardauth.address: "http://authelia:9091/api/authz/forward-auth"
      traefik.http.middlewares.authelia-auth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authelia-auth.forwardauth.authResponseHeaders: "Remote-User, Remote-Groups, Remote-Name, Remote-Email"
      traefik.http.middlewares.authelia-auth.forwardauth.authResponseHeadersRegex: "^(Location|Set-Cookie)$"
      # --- Whats up Docker? config ---
      # WUD disabled: the running image is a locally-built patched tag, not a
      # registry tag, so WUD can't watch it. Restore these (set watch back to
      # "true") once the patch is dropped. The watchers use WATCHALL, so
      # opting out needs an explicit label; otherwise WUD looks the local
      # image up on Docker Hub and gets a 401.
      wud.watch: "false"
      # wud.display.name: "Authelia"
      # wud.display.icon: sh-authelia
      # wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      # wud.link.template: 'https://github.com/authelia/authelia/releases/tag/v$${major}.$${minor}.$${patch}'

  authelia-valkey:
    image: *valkey-version
    container_name: authelia-valkey
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - CHOWN
    cap_drop:
      - ALL
    mem_limit: 128M
    command: ['valkey-server', '--save', '30', '1', '--loglevel', 'warning', '--stop-writes-on-bgsave-error', 'no']
    healthcheck:
      # Fast probing only while starting (gates depends_on), 30s once healthy.
      test: '[ $$(valkey-cli ping) = ''PONG'' ]'
      start_period: 10s
      start_interval: 1s
      timeout: 3s
      interval: 30s
      retries: 5
    volumes:
      - /opt/docker/authelia/valkey-data:/data
    networks:
      - authelia
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      wud.display.name: "Authelia - Valkey"
      wud.display.icon: "sh-authelia"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+\-alpine$$'
      wud.link.template: 'https://github.com/valkey-io/valkey/releases/tag/$${major}.$${minor}.$${patch}'

networks:
  authelia:
    name: authelia
    driver: bridge
    external: false
  traefik:
    external: true

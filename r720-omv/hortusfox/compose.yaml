x-versions:
  mariadb: &mariadb-version "mariadb:12.3.3"
  hortusfox: &hortusfox-version "ghcr.io/danielbrendel/hortusfox-web:v6.4"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  hortusfox-mariadb:
    image: *mariadb-version
    container_name: hortusfox-mariadb
    hostname: hortusfox-mariadb
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    # Server settings the old linuxserver custom.cnf had that differ from the
    # official image defaults. READ-COMMITTED also keeps 11.8+'s
    # innodb_snapshot_isolation (REPEATABLE READ only) out of play. The
    # collation pins keep new tables on utf8mb4_general_ci like the existing
    # ones; 12.x would make them utf8mb4_uca1400_ai_ci and joins across the
    # two would fail.
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --character-set-collations=utf8mb4=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${HORTUSFOX_DB_PASS}"
      MYSQL_DATABASE: "hortusfox"
      MYSQL_USER: "hortusfox"
      MYSQL_PASSWORD: "${HORTUSFOX_DB_PASS}"
      # Runs mariadb-upgrade when the image's major version moves ahead of the
      # datadir (the server refuses to start otherwise) and keeps a dump of
      # the system tables first.
      MARIADB_AUTO_UPGRADE: "1"
      TZ: "${TZ}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      # The datadir of the former linuxserver/mariadb container (its
      # /config/databases); custom.cnf and the binlogs beside it are unused.
      - /opt/docker/hortusfox/mariadb_data/databases:/var/lib/mysql
    networks:
      - hortusfox
      - adminer
    logging: *default-logging
    labels:
      wud.display.name: "HortusFox - MariaDB"
      wud.display.icon: "sh-hortusfox"
      wud.watch: "true"
      # Stay on the 12.3 LTS series (EOL June 2029); 13.x is short-lived rolling.
      wud.tag.include: '^12\.3\.\d+$$'
      wud.link.template: 'https://mariadb.com/docs/release-notes/community-server/12.3/$${major}.$${minor}.$${patch}'

  hortusfox:
    image: *hortusfox-version
    container_name: hortusfox
    hostname: hortusfox
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    command:
      - apache2-foreground
    entrypoint:
      - docker-entrypoint.sh
    working_dir: /var/www/html
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      APP_ADMIN_EMAIL: "${ADMIN_EMAIL}"
      APP_ADMIN_PASSWORD: "${HORTUSFOX_ADMIN_PASS}"
      APP_TIMEZONE: "${TZ}"
      DB_HOST: "hortusfox-mariadb"
      DB_PORT: "3306"
      DB_DATABASE: "hortusfox"
      DB_USERNAME: "hortusfox"
      DB_CHARSET: "utf8mb4"
      DB_PASSWORD: "${HORTUSFOX_DB_PASS}"
      APP_DEBUG: "true"
    depends_on:
      hortusfox-mariadb:
        condition: service_healthy
    ports:
      # Apache in the image listens on 80 (EXPOSE 80); 8080 had nothing behind it.
      - 4142:80/tcp
    volumes:
      - /opt/docker/hortusfox/hortusfox_logs:/var/www/html/app/logs
      - /opt/docker/hortusfox/hortusfox_backup:/var/www/html/public/backup
      - /opt/docker/hortusfox/hortusfox_themes:/var/www/html/public/themes
      - /opt/docker/hortusfox/hortusfox_migrate:/var/www/html/app/migrations
      - /opt/docker/hortusfox/hortusfox_images:/var/www/html/public/img
    networks:
      - hortusfox
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v\d+\.\d+$$'
      wud.link.template: 'https://github.com/danielbrendel/hortusfox-web/releases/tag/v$${major}.$${minor}'
      wud.display.name: "HortusFox"
      wud.display.icon: "sh-hortusfox"

networks:
  hortusfox:
    name: hortusfox
    driver: bridge
    external: false
  adminer:
    external: true

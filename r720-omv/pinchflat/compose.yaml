x-versions:
  # Pinchflat-ngx fork (TheBadFella), a strict superset of upstream
  # kieraneglin/pinchflat (upstream dormant since Dec 2025). The fork publishes
  # real CalVer tags on GHCR (no `v` prefix), so we pin a version tag.
  # Up to 2026.10.x tags were YYYY.M.D; as of 2026.11.0 upstream switched to
  # year.month.patch CalVer (last number = patch count, NOT day). The WUD
  # regex `^\d{4}\.\d+\.\d+$$` matches both schemes.
  # SQLite image, NOT the `-postgres` variant.
  # First start runs one-way schema migrations on /config: rollback = restore
  # the pre-migration config backup + the old upstream image.
  pinchflat: &pinchflat-version "ghcr.io/thebadfella/pinchflat-ngx:2026.11.1"
  # bgutil PO-token provider (Node variant; plain `X.Y.Z` tag = `-node`).
  # Must stay on the same MAJOR.MINOR as the bgutil yt-dlp plugin bundled in
  # the pinchflat-ngx image (its Dockerfile `ARG BGUTIL_PLUGIN_VERSION`, 2.0.0
  # in 2026.11.1). Patch releases are server-side only (2.0.1/2.0.2 = npm CVE
  # fixes), so they're safe ahead of the plugin; a minor/major bump is not.
  # Re-check the ARG on every pinchflat-ngx bump.
  pot-provider: &pot-provider-version "brainicism/bgutil-ytdlp-pot-provider:2.0.2"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  pinchflat:
    image: *pinchflat-version
    container_name: pinchflat
    hostname: pinchflat
    ipc: private
    restart: unless-stopped
    user: "${MEDIA_PUID}:${MEDIA_PGID}"
    # No cap_add: it runs as a non-root user under no-new-privileges, so
    # capabilities could never take effect anyway. (The old list was Docker's
    # default set, copied from when the image still ran as root.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    environment:
      TZ: "${TZ}"
      # Fork defaults to debug, which floods Loki.
      LOG_LEVEL: "info"
      # bgutil PO-token provider sidecar (YouTube "confirm you're not a bot").
      POT_PROVIDER_URL: "http://pinchflat-pot-provider:4416"
    depends_on:
      - pinchflat-pot-provider
    # Web UI via Traefik only (no published port). Pinchflat has no login of
    # its own, so Authelia forward-auth guards it, and lan-only@file limits it
    # to the workstation VLAN + Tailscale. LiveView sockets work
    # behind the proxy: the image sets check_origin: false.
    volumes:
      - /opt/docker/pinchflat/pinchflat_config:/config
      - /Data/IT/pinchflat_downloads:/downloads
    networks:
      - pinchflat
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.pinchflat.rule: "Host(`pinchflat.${DOMAIN_NAME}`)"
      traefik.http.routers.pinchflat.entrypoints: "websecure"
      traefik.http.routers.pinchflat.tls: "true"
      traefik.http.routers.pinchflat.tls.certresolver: "letsencrypt"
      traefik.http.routers.pinchflat.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.pinchflat.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.pinchflat.middlewares: "secHeaders@file,authelia-auth@docker,lan-only@file"
      traefik.http.services.pinchflat.loadbalancer.server.port: "8945"
      traefik.docker.network: "traefik"
      wud.watch: 'true'
      wud.display.icon: 'sh-pinchflat'
      wud.display.name: 'Pinchflat-ngx'
      wud.tag.include: '^\d{4}\.\d+\.\d+$$'
      wud.link.changelog: 'https://github.com/TheBadFella/pinchflat-ngx/releases/tag/$${major}.$${minor}.$${patch}'

  # Unauthenticated HTTP API on 4416: internal `pinchflat` network ONLY - no
  # ports, no traefik. No compose `profiles:` (Komodo wouldn't start it).
  # Stateless (in-memory token/minter cache), so no volumes.
  pinchflat-pot-provider:
    image: *pot-provider-version
    container_name: pinchflat-pot-provider
    hostname: pinchflat-pot-provider
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      TZ: "${TZ}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - pinchflat
    # node:26-bookworm-slim base has no curl/wget; use node's global fetch.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    labels:
      wud.watch: 'true'
      wud.display.icon: 'sh-pinchflat'
      wud.display.name: 'Pinchflat - bgutil PO-token provider'
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.changelog: 'https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/tag/$${major}.$${minor}.$${patch}'

networks:
  pinchflat:
    name: pinchflat
    driver: bridge
    external: false
  traefik:
    external: true

x-versions:
  # Pinchflat-ngx fork (TheBadFella), a strict superset of upstream
  # kieraneglin/pinchflat (upstream dormant since Dec 2025). The fork publishes
  # real CalVer tags on GHCR (YYYY.M.D, no `v` prefix), so we pin a version
  # tag. SQLite image, NOT the `-postgres` variant.
  # First start runs one-way schema migrations on /config: rollback = restore
  # the pre-migration config backup + the old upstream image.
  pinchflat: &pinchflat-version "ghcr.io/thebadfella/pinchflat-ngx:2026.10.15"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  pinchflat:
    image: *pinchflat-version
    container_name: pinchflat
    hostname: pinchflat
    ipc: private
    restart: unless-stopped
    user: "${MEDIA_PUID}:${MEDIA_PGID}"
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    environment:
      TZ: "${TZ}"
      # Fork defaults to debug, which floods Loki.
      LOG_LEVEL: "info"
    ports:
      - '8945:8945'
    volumes:
      - /opt/docker/pinchflat/pinchflat_config:/config
      - /Data/IT/pinchflat_downloads:/downloads
    networks:
      - pinchflat
    logging: *default-logging
    labels:
      wud.watch: 'true'
      wud.display.icon: 'sh-pinchflat'
      wud.display.name: 'Pinchflat-ngx'
      wud.tag.include: '^\d{4}\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/TheBadFella/pinchflat-ngx/releases/tag/$${major}.$${minor}.$${patch}'

networks:
  pinchflat:
    name: pinchflat
    driver: bridge
    external: false

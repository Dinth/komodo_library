x-versions:
  # Pinned by digest, not a version tag: upstream builds :latest from master
  # ahead of its CalVer tags (v2025.6.6 is the newest tag but :latest is a
  # newer build), so a version pin would be a downgrade. WUD digest-watches
  # :latest; bump by replacing the digest.
  pinchflat: &pinchflat-version "ghcr.io/kieraneglin/pinchflat:latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  pinchflat:
    image: *pinchflat-version
    container_name: pinchflat
    hostname: pinchflat
    ipc: private
    restart: unless-stopped
    user: "${MEDIA_PUID}:${MEDIA_PGID}"
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    environment:
      TZ: "${TZ}"
    ports:
      - '8945:8945'
    volumes:
      - /opt/docker/pinchflat/pinchflat_config:/config
      - /Data/IT/pinchflat_downloads:/downloads
    networks:
      - pinchflat
    logging: *default-logging
    labels:
      wud.watch: 'true'
      wud.watch.digest: 'true'
      wud.display.icon: 'sh-pinchflat'
      wud.display.name: 'Pinchflat'
      wud.tag.include: '^latest$$'
      wud.link.template: "https://github.com/kieraneglin/pinchflat/commits/master"

networks:
  pinchflat:
    name: pinchflat
    driver: bridge
    external: false

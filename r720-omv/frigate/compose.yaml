x-versions:
  frigate: &frigate-version "ghcr.io/blakeblackshear/frigate:0.18.0-tensorrt"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frigate:
    image: *frigate-version
    container_name: frigate
    hostname: frigate
    ipc: private
    restart: unless-stopped
    entrypoint: ['/init']
    working_dir: /opt/frigate
    # No privileged: it bypasses the nvidia runtime hook and lets the container
    # see ALL GPUs (CUDA then picks the faster RTX 5000), defeating the device
    # pin below. runtime:nvidia + the cap_add set + NVIDIA_VISIBLE_DEVICES give
    # GPU access non-privileged, so the device_ids pin actually restricts to GPU 0.
    runtime: nvidia
    shm_size: "16gb"
    mem_limit: 40G
    # Real-time path: above the 1024 default so the detect/ffmpeg processes keep
    # their deadlines during a host fork stampede, which is what turns into
    # "camera has stopped reporting" alerts.
    cpu_shares: 4096
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - label=disable
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Pin Frigate to GPU 0 (Tesla T4); leave GPU 1 (RTX 5000) free.
              # By UUID so it survives device re-enumeration across reboots.
              device_ids: ["GPU-993cb9a5-03ef-b0c5-0a88-db2d62ecd361"]
              capabilities: [compute,utility,video]
    environment:
      PLUS_API_KEY: "${FRIGATE_PLUS_API_KEY}"
      USE_FP16: "false"
      NVIDIA_VISIBLE_DEVICES: "GPU-993cb9a5-03ef-b0c5-0a88-db2d62ecd361"
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
      TOKENIZERS_PARALLELISM: "true"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
      OPENCV_FFMPEG_LOGLEVEL: "8"
      OPENCV_LOG_LEVEL: "FATAL"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    ports:
      - 8555:8555/tcp
      - 8555:8555/udp
      - 8971:8971/tcp
    volumes:
      - type: bind
        source: /frigate-pool/recordings
        target: /media/frigate
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
      - /opt/docker/frigate/frigate_config:/config
      - /opt/docker/frigate/frigate_storage/frigate.db:/media/frigate/frigate.db
      - /opt/docker/frigate/frigate_storage/frigate.db-shm:/media/frigate/frigate.db-shm
      - /opt/docker/frigate/frigate_storage/frigate.db-wal:/media/frigate/frigate.db-wal
      - /opt/docker/frigate/frigate_storage/backup.db:/media/frigate/backup.db
    tmpfs:
      - /tmp:size=8G,mode=1777
    networks:
      - frigate
      - traefik
    logging: *default-logging
    labels:
      # http://10.10.1.13:5000 (Home Assistant, Prometheus) is served by Traefik's frigateapi entrypoint behind
      # trusted-allowlist (LAN, workstations, Tailscale, Docker).
      traefik.http.routers.frigate-api.entrypoints: "frigateapi"
      traefik.http.routers.frigate-api.rule: "PathPrefix(`/`)"
      traefik.http.routers.frigate-api.middlewares: "trusted-allowlist@docker"
      traefik.http.routers.frigate-api.service: "frigate-api"
      traefik.http.services.frigate-api.loadbalancer.server.port: "5000"
      # http://10.10.1.13:1984 (go2rtc) is served by Traefik's go2rtc entrypoint behind
      # trusted-allowlist (LAN, workstations, Tailscale, Docker).
      traefik.http.routers.frigate-go2rtc.entrypoints: "go2rtc"
      traefik.http.routers.frigate-go2rtc.rule: "PathPrefix(`/`)"
      traefik.http.routers.frigate-go2rtc.middlewares: "trusted-allowlist@docker"
      traefik.http.routers.frigate-go2rtc.service: "frigate-go2rtc"
      traefik.http.services.frigate-go2rtc.loadbalancer.server.port: "1984"
      traefik.tcp.routers.frigate-rtsp.entrypoints: "frigatertsp"
      traefik.tcp.routers.frigate-rtsp.rule: "HostSNI(`*`)"
      traefik.tcp.routers.frigate-rtsp.middlewares: "trusted-allowlist-tcp@docker"
      traefik.tcp.routers.frigate-rtsp.service: "frigate-rtsp"
      traefik.tcp.services.frigate-rtsp.loadbalancer.server.port: "8554"
      traefik.enable: "true"
      traefik.http.routers.frigate.entrypoints: websecure
      traefik.http.routers.frigate.rule: Host(`cctv.${DOMAIN_NAME}`)
      traefik.http.routers.frigate.tls: "true"
      traefik.http.routers.frigate.tls.certresolver: letsencrypt
      traefik.http.routers.frigate.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.frigate.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.frigate.middlewares: "secHeaders@file,authelia-auth@docker"
      traefik.http.routers.frigate.service: "frigate"
      #traefik.http.services.frigate.loadbalancer.server.port: "8971"
      traefik.http.services.frigate.loadbalancer.server.port: "5000"
      traefik.docker.network: "traefik"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+\-tensorrt$$'
      wud.link.template: "https://github.com/blakeblackshear/frigate/releases/tag/v$${major}.$${minor}.$${patch}"
      wud.display.name: "Frigate"
      wud.display.icon: "mdi:cctv"


networks:
  frigate:
    name: frigate
    driver: bridge
    external: false
  traefik:
    external: true

x-versions:
  adminer: &adminer-version "adminer:6.3.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  adminer:
    image: *adminer-version
    container_name: adminer
    hostname: adminer
    ipc: private
    restart: unless-stopped
    user: adminer
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 9009:8080/tcp
    networks:
      - adminer
    logging: *default-logging
    labels:
      wud.display.name: "Adminer"
      wud.display.icon: "sh:adminer"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/vrana/adminer/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  adminer:
    name: adminer
    driver: bridge
    external: false

x-versions:
  mariadb: &mariadb-version "mariadb:12.3.3"
  monica: &monica-version "monica:4.1.2-apache"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  monica-mariadb:
    image: *mariadb-version
    container_name: monica-mariadb
    hostname: monica-mariadb
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    # Server settings the old linuxserver custom.cnf had that differ from the
    # official image defaults. READ-COMMITTED also keeps 11.8+'s
    # innodb_snapshot_isolation (REPEATABLE READ only) out of play. Monica
    # sets utf8mb4_unicode_ci itself; the collation pins keep the old server
    # default for anything that doesn't.
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --character-set-collations=utf8mb4=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MONICA_DB_PASS}"
      MYSQL_DATABASE: "monica"
      MYSQL_USER: "monica"
      MYSQL_PASSWORD: "${MONICA_DB_PASS}"
      # Runs mariadb-upgrade when the image's major version moves ahead of the
      # datadir (the server refuses to start otherwise) and keeps a dump of
      # the system tables first.
      MARIADB_AUTO_UPGRADE: "1"
      TZ: "${TZ}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      # The datadir of the former linuxserver/mariadb container (its
      # /config/databases); custom.cnf and the binlogs beside it are unused.
      - /opt/docker/monica/mariadb_data/databases:/var/lib/mysql
    networks:
      - monica
      - adminer
    logging: *default-logging
    labels:
      wud.display.name: "Monica - MariaDB"
      wud.display.icon: "sh-monica"
      wud.watch: "true"
      # Stay on the 12.3 LTS series (EOL June 2029); 13.x is short-lived rolling.
      wud.tag.include: '^12\.3\.\d+$$'
      wud.link.template: 'https://mariadb.com/docs/release-notes/community-server/12.3/$${major}.$${minor}.$${patch}'

  monica:
    image: *monica-version
    container_name: monica
    hostname: monica
    ipc: private
    restart: unless-stopped
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    environment:
      APP_KEY: "${MONICA_APP_KEY}"
      DB_HOST: "monica-mariadb"
      DB_USERNAME: "monica"
      DB_PASSWORD: "${MONICA_DB_PASS}"
      APP_URL: "https://monica.${DOMAIN_NAME}"
      APP_TRUSTED_PROXIES: "*"
      # Force the filesystem cache store: the DB default needs a `cache_locks`
      # table that this Monica (Laravel 9) never migrated, which crashes the
      # scheduler's onOneServer mutex. File cache lives in the shared storage
      # volume, so web + cron stay consistent.
      CACHE_DRIVER: "file"
    depends_on:
      monica-mariadb:
        condition: service_healthy
    ports:
      - 5435:80
    volumes:
      - /opt/docker/monica/monica_data:/var/www/html/storage
    networks:
      - monica
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.monica.rule: "Host(`monica.${DOMAIN_NAME}`)"
      traefik.http.routers.monica.entrypoints: "websecure"
      traefik.http.routers.monica.tls: "true"
      traefik.http.routers.monica.tls.certresolver: "letsencrypt"
      traefik.http.routers.monica.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.monica.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.monica.middlewares: "secHeaders@file"
      traefik.http.services.monica.loadbalancer.server.port: "80"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+-apache$$'
      wud.display.name: "Monica"
      wud.display.icon: "sh:monica"
      wud.link.template: "https://github.com/monicahq/monica/releases/tag/v$${major}.$${minor}.$${patch}"

  # Runs the Laravel scheduler (busybox crond -> `artisan schedule:run` every
  # minute), which fires `send:reminders` hourly to repopulate reminder_outbox.
  # Without this the dashboard "Events in the next 3 months" silently empties as
  # the pre-computed outbox rows drain. Same image as `monica`, no web port.
  monica-cron:
    image: *monica-version
    container_name: monica-cron
    hostname: monica-cron
    command: ["cron.sh"]
    ipc: private
    restart: unless-stopped
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    environment:
      APP_KEY: "${MONICA_APP_KEY}"
      DB_HOST: "monica-mariadb"
      DB_USERNAME: "monica"
      DB_PASSWORD: "${MONICA_DB_PASS}"
      APP_URL: "https://monica.${DOMAIN_NAME}"
      APP_TRUSTED_PROXIES: "*"
      CACHE_DRIVER: "file"
    depends_on:
      monica-mariadb:
        condition: service_healthy
      monica:
        condition: service_started
    volumes:
      - /opt/docker/monica/monica_data:/var/www/html/storage
    networks:
      - monica
    logging: *default-logging
    labels:
      wud.watch: "false"

networks:
  monica:
    name: monica
    driver: bridge
    external: false
  adminer:
    external: true
  traefik:
    external: true

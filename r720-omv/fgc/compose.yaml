x-versions:
  # Python remaster (nodriver + stealth CDP) — replaces feldorn/free-games-claimer
  # (Playwright), which was getting captcha-walled at Epic checkout. Public ghcr
  # image, so this stays pull-based (WUD-watchable); `build:` fallback not needed.
  fgc: &fgc-version "ghcr.io/p-adamiec/free-games-claimer-remaster:v1.11"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  fgc:
    container_name: fgc
    image: *fgc-version
    ipc: private
    restart: unless-stopped
    tty: true
    stdin_open: true
    # The entrypoint starts as root only to hand /fgc/data to PUID:PGID and
    # switch user (setpriv); these three caps are what that switch needs, and
    # without them it silently stays root. After setpriv the bot, Chrome and
    # VNC run as DOCKER_PUID with no capabilities. No `user:` key: upstream
    # needs root at entry (a container-level user breaks VNC/session saving).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 4G
    healthcheck:
      test: pgrep python3 && curl --fail http://localhost:7080 || exit 1
      interval: 30s
      timeout: 5s
      start_period: 60s
    ports:
      - "7080:7080" # noVNC web client (password-gated via VNC_PASSWORD)
      - "5900:5900" # raw TurboVNC — use a native VNC client (Remmina/TigerVNC) for
                    # reliable drag/slider captchas; browser noVNC drops drag moves
    volumes:
      # Fresh data dir — different app/DB/browser-profile schema than feldorn.
      - /opt/docker/fgc/remaster_data:/fgc/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "${TZ}"
      # --- User (entrypoint drops to these via setpriv) ---
      PUID: "${DOCKER_PUID}"
      PGID: "${DOCKER_PGID}"
      # --- Display / VNC ---
      SHOW: "1" # keep browser visible so captchas can be hand-solved via noVNC
      NOVNC_PORT: "7080"
      # VNC only uses the first 8 characters of this (TurboVNC truncates it).
      VNC_PASSWORD: "${FGC_VNC_PASSWORD}"
      # Base for the links in sign-in alerts; without it they point at
      # localhost, which is useless from a phone.
      VNC_URL: "http://10.10.1.13:7080"
      # Seconds the bot waits at any manual step (sign-in, 2FA/e-mail code,
      # captcha). Upstream's 180 is too short once the Signal ping has to reach
      # a phone first; an unanswered wait only skips that store for the run.
      VNC_LOGIN_TIMEOUT: "900"
      # --- Scheduler ---
      # Fixed daily runs instead of an interval counted from container start
      # (which drifted with every restart). 17:00 is just after Epic's weekly
      # drop; 09:00 is the second pass. Both are waking hours, so a sign-in
      # prompt can actually be answered. The container still runs once on start.
      SCHEDULER_HOURS: "0"
      SCHEDULER_TIMEZONE: "Europe/London"
      SCHEDULER_FIXED_TIMES: "09:00,17:00"
      # --- Store selection ---
      # microsoft (v1.10) redeems Prime's Microsoft codes and claims paid
      # MS Store/Xbox games while they are free to keep.
      # aliexpress = daily coin check-in (not a game store). It has no TOTP
      # option: AliExpress' e-mailed 6-digit code or captcha is handed to VNC,
      # normally once per browser profile.
      # fanatical's Steam keys are activated on the Steam account at the end
      # of the run because steam is in STORES (v1.11; upstream: not yet tested
      # end to end).
      # indiegala has no 2FA support; its login captcha is ticked over VNC,
      # ~every 14 days and only when a giveaway exists.
      STORES: "epic,gog,prime,microsoft,aliexpress,itchio,fanatical,indiegala,steam,ubisoft"
      # --- Common credentials (fallback for per-store overrides) ---
      # No common PASSWORD: every store below sets its own.
      EMAIL: "${ADMIN_EMAIL}"
      # --- Epic ---
      EG_EMAIL: "${ADMIN_EMAIL}"
      EG_PASSWORD: "${FGC_EG_PASS}"
      EG_OTP_KEY: "${FGC_EG_OTP_KEY}"
#      EG_PARENTALPIN: "${FGC_EG_PARENTALPIN}" # only if parental controls are on
      # --- GOG ---
      GOG_EMAIL: "${ADMIN_EMAIL}"
      GOG_PASSWORD: "${FGC_GOG_PASS}"
      # --- Prime Gaming (Amazon) ---
      PG_EMAIL: "${ADMIN_EMAIL}"
      PG_PASSWORD: "${FGC_PG_PASS}"
      # No PG_REDEEM (gone in v1.10): codes redeem if gog/microsoft in STORES.
      # --- AliExpress ---
      # AE_MIN_COINS / AE_FLAG_* / AE_PAGE_RETRIES left at upstream defaults.
      AE_EMAIL: "${ADMIN_EMAIL}"
      AE_PASSWORD: "${FGC_AE_PASS}"
      # --- Itch.io (GamerPower finds, claimed into the itch.io library) ---
      ITCHIO_EMAIL: "${ADMIN_EMAIL}"
      ITCHIO_PASSWORD: "${FGC_ITCHIO_PASS}"
      # TOTP secret; empty until the itch.io account has an authenticator.
      ITCHIO_OTP_KEY: "${FGC_ITCHIO_OTP_KEY:-}"
      # --- Steam (SteamDB free-to-keep + GamerPower finds) ---
      # No automated Steam Guard: the first sign-in is finished over VNC.
      STEAM_USERNAME: "${FGC_STEAM_USERNAME}"
      STEAM_PASSWORD: "${FGC_STEAM_PASS}"
      # --- Ubisoft (ubisoft.com/games/free giveaways) ---
      UBI_EMAIL: "${ADMIN_EMAIL}"
      UBI_PASSWORD: "${FGC_UBI_PASS}"
      # TOTP secret; empty until the Ubisoft account has an authenticator.
      UBI_OTP_KEY: "${FGC_UBI_OTP_KEY:-}"
      # --- Microsoft Store / Xbox ---
      MS_EMAIL: "${FGC_MS_EMAIL}"
      MS_PASSWORD: "${FGC_MS_PASS}"
      # TOTP secret; empty unless the account uses an authenticator app
      # (e-mail codes and passkeys are handed to VNC).
      MS_OTP_KEY: "${FGC_MS_OTP_KEY:-}"
      # --- Fanatical (GamerPower finds; keys activated on Steam) ---
      FANATICAL_EMAIL: "${ADMIN_EMAIL}"
      FANATICAL_PASSWORD: "${FGC_FANATICAL_PASS}"
      # No FANATICAL_OTP_KEY upstream (v1.11): its 2FA code is typed over VNC.
      # --- IndieGala (GamerPower finds, claimed into the IndieGala library) ---
      INDIEGALA_EMAIL: "${ADMIN_EMAIL}"
      INDIEGALA_PASSWORD: "${FGC_INDIEGALA_PASS}"
      # --- Notifications (apprise) ---
      # Apprise's Signal plugin, straight to signal-cli-rest-api (same bot and
      # tech recipient as WUD's update notifications).
      NOTIFY: "signal://signal-rest-api:8080/${SIGNAL_BOT_NUMBER}/${SIGNAL_TECH_ID}"
      NOTIFY_SUMMARY: "1"
      NOTIFY_ERRORS: "1"
      NOTIFY_CLAIM_FAILS: "1"
      NOTIFY_LOGIN_REQUEST: "1"
      # Itch.io download-only giveaways have nothing to claim; keep them out
      # of the summary.
      NOTIFY_DOWNLOAD_ONLY: "0"
      # --- Behaviour ---
      DEBUG: "0" # no more Playwright-Inspector hang on failure
      DRYRUN: "0"
    labels:
      autoheal: "true"
      wud.watch: "true"
      # Upstream tags are 2-part (v1.1), so no $${patch} component here.
      wud.tag.include: '^v\d+\.\d+$$'
      wud.display.name: "Free Games Claimer (Remaster)"
      wud.link.template: 'https://github.com/P-Adamiec/Free-Games-Claimer-Remaster/releases/tag/v$${major}.$${minor}'
    networks:
      - fgc
      # For NOTIFY above; the signal-rest-api stack owns this network.
      - signal-rest-api
    logging: *default-logging

networks:
  fgc:
    name: fgc
    driver: bridge
    external: false
  signal-rest-api:
    external: true

x-versions:
  # Piped publishes no version tags (only latest and JVM variants), so all
  # three are pinned by digest; WUD watches the latest digest for drift.
  piped-backend-version: &piped-backend-version 1337kavin/piped:latest@sha256:7747e19ee501c0a3afa94dd3d6e982dd4247f1babe03fb515b4a0f0b87f82b2e
  piped-proxy-version: &piped-proxy-version 1337kavin/piped-proxy:latest@sha256:e10c9474fdea1ddf09267a57c24d25a8c20ffbd96ac356db4b71d821f898e702
  piped-frontend-version: &piped-frontend-version 1337kavin/piped-frontend:latest@sha256:762a8d18f458a4e74fb581dc01c711e83624142f392132db7f4620fdfddad4f1
  piped-postgres-version: &piped-postgres-version postgres:18.6-alpine

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-piped-env: &piped-env
  TZ: ${TZ:-UTC}

services:
  piped-backend:
    image: *piped-backend-version
    container_name: piped-backend
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2G
    environment:
      <<: *piped-env
      # Configured here rather than in config.properties: Constants.java reads
      # every key from the environment first. The old on-server file used key
      # names Piped never reads (proxy.url, frontendUrl, apiUrl), so the backend
      # silently fell back to kavin.rocks' public proxy and piped.video.
      PORT: "8080"
      HTTP_WORKERS: "2"
      # All three must be the browser-facing HTTPS origins. The backend rewrites
      # every stream and thumbnail URL onto PROXY_PART, and the frontend is
      # built to call https://<BACKEND_HOSTNAME>.
      API_URL: "https://pipedapi.${DOMAIN_NAME}"
      PROXY_PART: "https://pipedproxy.${DOMAIN_NAME}"
      FRONTEND_URL: "https://piped.${DOMAIN_NAME}"
      # PubSub needs YouTube's hub to call back into API_URL from the internet,
      # which the allow-list below refuses. Poll subscribed channels instead so
      # the Feed page still updates.
      DISABLE_PUBSUB: "true"
      FEED_REFRESH: "true"
      FEED_REFRESH_MINUTES: "30"
      # HIBERNATE__* env keys are lower-cased and "__" -> "." by the backend.
      HIBERNATE__CONNECTION__URL: "jdbc:postgresql://piped-postgres:5432/piped"
      HIBERNATE__CONNECTION__DRIVER_CLASS: "org.postgresql.Driver"
      HIBERNATE__CONNECTION__USERNAME: "piped"
      HIBERNATE__CONNECTION__PASSWORD: "${PIPED_DB_PASS}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      piped-postgres: { condition: service_healthy }
    networks: [piped, traefik]
    ports:
      - "4553:8080"
    healthcheck:
      # The image has curl, not wget, and /feed needs an authToken. Upstream's
      # script curls the unauthenticated /healthcheck endpoint.
      test: ["CMD", "/docker-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: '^latest$$'
      wud.link.template: "https://github.com/TeamPiped/Piped/commits/master"
      wud.display.name: "Piped Backend"
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.pipedapi.rule: "Host(`pipedapi.${DOMAIN_NAME}`)"
      traefik.http.routers.pipedapi.entrypoints: "websecure"
      traefik.http.routers.pipedapi.tls: "true"
      traefik.http.routers.pipedapi.tls.certresolver: "letsencrypt"
      traefik.http.routers.pipedapi.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.pipedapi.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      # No Authelia: the frontend calls this cross-origin with fetch(), which
      # sends no cookies, so forward-auth would redirect every API call. Piped
      # has its own accounts; the allow-list keeps it off the internet and the
      # IoT/guest VLANs.
      traefik.http.routers.pipedapi.middlewares: "secHeaders@file,trusted-allowlist@docker"
      traefik.http.services.pipedapi.loadbalancer.server.port: "8080"

  piped-proxy:
    image: *piped-proxy-version
    container_name: piped-proxy
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1G
    ports:
      - "4552:8081"
    environment:
      <<: *piped-env
      UDS: 0
      BIND: "0.0.0.0:8081"
    networks: [piped, traefik]
    healthcheck:
      # debian-slim with no wget/curl: just check the listener with bash.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8081"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: '^latest$$'
      wud.link.template: "https://github.com/TeamPiped/Piped-Proxy/releases"
      wud.display.name: "Piped Proxy"
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.pipedproxy.rule: "Host(`pipedproxy.${DOMAIN_NAME}`)"
      traefik.http.routers.pipedproxy.entrypoints: "websecure"
      traefik.http.routers.pipedproxy.tls: "true"
      traefik.http.routers.pipedproxy.tls.certresolver: "letsencrypt"
      traefik.http.routers.pipedproxy.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.pipedproxy.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      # Loaded by <img>/<video>/MSE from the frontend origin: no cookies, so no
      # Authelia. It is an open googlevideo relay, so it must stay allow-listed.
      traefik.http.routers.pipedproxy.middlewares: "secHeaders@file,trusted-allowlist@docker"
      traefik.http.services.pipedproxy.loadbalancer.server.port: "8081"

  piped-frontend:
    image: *piped-frontend-version
    container_name: piped-frontend
    ipc: private
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    mem_limit: 512M
    ports:
      - "4551:80"
    environment:
      <<: *piped-env
      # The entrypoint seds https://<this> into the bundle -- the scheme is
      # always https, so this must be a TLS hostname, never host:port.
      BACKEND_HOSTNAME: "pipedapi.${DOMAIN_NAME}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks: [piped, traefik]
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: '^latest$$'
      wud.link.template: "https://github.com/TeamPiped/Piped/commits/master"
      wud.display.name: "Piped Frontend"
      wud.display.icon: "sh:piped"
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.piped.rule: "Host(`piped.${DOMAIN_NAME}`)"
      traefik.http.routers.piped.entrypoints: "websecure"
      traefik.http.routers.piped.tls: "true"
      traefik.http.routers.piped.tls.certresolver: "letsencrypt"
      traefik.http.routers.piped.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.piped.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      # Not secHeaders@file: its CSP is default-src 'self', which blocks every
      # call to pipedapi. and every image/video from pipedproxy. piped-headers
      # is secHeaders with the CSP widened to exactly those two origins.
      traefik.http.routers.piped.middlewares: "piped-headers@docker,authelia-auth@docker"
      traefik.http.services.piped.loadbalancer.server.port: "80"
      traefik.http.middlewares.piped-headers.headers.browserXssFilter: "true"
      traefik.http.middlewares.piped-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.piped-headers.headers.forceSTSHeader: "true"
      traefik.http.middlewares.piped-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.piped-headers.headers.stsPreload: "true"
      traefik.http.middlewares.piped-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.piped-headers.headers.customFrameOptionsValue: "SAMEORIGIN"
      traefik.http.middlewares.piped-headers.headers.customRequestHeaders.Remote-User: ""
      traefik.http.middlewares.piped-headers.headers.customRequestHeaders.Remote-Groups: ""
      traefik.http.middlewares.piped-headers.headers.customRequestHeaders.Remote-Name: ""
      traefik.http.middlewares.piped-headers.headers.customRequestHeaders.Remote-Email: ""
      traefik.http.middlewares.piped-headers.headers.contentSecurityPolicy: >-
        default-src 'self' blob: data:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline';
        connect-src 'self' blob: data: https://pipedapi.${DOMAIN_NAME} https://pipedproxy.${DOMAIN_NAME};
        img-src 'self' blob: data: https://pipedproxy.${DOMAIN_NAME};
        media-src 'self' blob: data: https://pipedproxy.${DOMAIN_NAME};
        worker-src 'self' blob:;
        frame-ancestors 'self'

  piped-postgres:
    image: *piped-postgres-version
    container_name: piped-postgres
    ipc: private
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, FOWNER]
    mem_limit: 1G
    environment:
      POSTGRES_DB: piped
      POSTGRES_USER: piped
      POSTGRES_PASSWORD: "${PIPED_DB_PASS}"
    volumes:
      - /opt/docker/piped/piped_postgres-data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piped -d piped"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [piped]
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+-alpine$$'
      wud.link.template: "https://www.postgresql.org/docs/release/$${major}.$${minor}/"
      wud.display.name: "Postgres - Piped"

networks:
  piped:
    name: piped
    driver: bridge
  traefik:
    external: true

x-versions:
  backblaze: &backblaze-version "tessypowder/backblaze-personal-wine:ubuntu22"
  busybox: &busybox-version "busybox:1.37.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  backblaze-personal-wine:
    image: *backblaze-version
    container_name: backblaze-personal-wine
    hostname: backblaze-personal-wine
    ipc: private
    restart: unless-stopped
    working_dir: /tmp
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
      - DAC_OVERRIDE
      - FSETID
      - FOWNER
      - MKNOD
      - KILL
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    # 16G, not 10G: the cgroup OOM killer took bztransmit64.exe at 10.26 GB on
    # 2026-09-22, having taken it at 6.08 GB on 2026-09-17 against a ~4.2 GB
    # steady state. The peak tracks the size of the backup set, not the volume
    # of a single run: bztransmit loads the whole file index into RAM every
    # time, and that set is now 3,386,727 file ids across 278 bz_done_ files,
    # ~4.0 GB of bzdata/bzbackup/bzdatacenter on disk. Expect to revisit this
    # as the set grows; trimming it with exclude rules is the real fix.
    #
    # Backups do recover on their own: bztransmit is transient by design (runs
    # a sync, writes its stats, releases a four-hour lock, exits), so the next
    # scheduled run picks up — verified 2026-09-18, "very successful", 7 vault
    # uploads, zero failures. The cost of an OOM is the aborted run's wasted
    # work, not a stalled backup. Do not add bztransmit to the healthcheck for
    # this reason; bzserv.exe is the correct persistent process to probe.
    mem_limit: 16G
    command: ['/init']
    environment:
      # crashplan (1006:users) is the host's read-only backup user: /Data's ACLs
      # give it r-x everywhere, while they deliberately deny the `docker` user
      # (DOCKER_PUID, which every other container runs as) on Photos and Other.
      # Running as DOCKER_PUID (2026-06-04 to 2026-09-25) silently skipped both.
      # The image chowns /config to USER_ID on start (TAKE_CONFIG_OWNERSHIP).
      USER_ID: "1006"
      GROUP_ID: "${DOCKER_PGID}"
      UMASK: "0022"
      # Must be a locale the image ships (only C.utf8 / en_US.utf8). en_GB.UTF-8
      # isn't installed, so it fell back to ASCII and Wine mangled every
      # non-ASCII filename (e.g. "Kōbō Abe", Polish/Chinese titles): Backblaze
      # skipped them as invalid names or names with embedded CR/LF.
      LANG: "en_US.UTF-8"
      KEEP_APP_RUNNING: "1"
      APP_NICENESS: "1"
      CONTAINER_DEBUG: "0"
      DISPLAY_WIDTH: "900"
      DISPLAY_HEIGHT: "700"
      WEB_LISTENING_PORT: "5800"
      VNC_LISTENING_PORT: "5900"
      VNC_PASSWORD: ""
    healthcheck:
      # Unhealthy -> autoheal restarts the container. Fails when bzserv (the
      # backup service) isn't running, e.g. after the client's own auto-update
      # stops it; when its heartbeat is >30 min old (hung; it normally updates
      # every <=10 min); or when /Data isn't mounted (no .bzvol marker).
      # Don't write the service's exe name literally here, or pgrep -f matches
      # this check's own shell and always passes.
      test:
        - CMD-SHELL
        - >-
          pgrep -f '[b]zserv[.]exe' >/dev/null || { echo 'bzserv not running'; exit 1; };
          [ -n "$$(find /config/wine/drive_c/ProgramData/Backblaze/bzdata/bzreports/bzserv_heartbeat.txt -mmin -30)" ] || { echo 'bzserv heartbeat stale'; exit 1; };
          [ -f /drive_d/.bzvol/bzvol_id.xml ] || { echo '/Data not mounted'; exit 1; }
      interval: 60s
      timeout: 10s
      retries: 3
      # Wine + the service take a few minutes to come up after a restart.
      start_period: 600s
    # Block only the client's self-update download. Every 4h it fetches
    # bzinstall-win32-*.exe from f000.backblazeb2.com, stops bzserv, then fails
    # to install under Wine (msiexec 1603) and leaves bzserv down until autoheal
    # restarts the container; that also kills any upload running longer than
    # 4h (44 GB video at ~10 GB/h). bzserv is only stopped after a successful
    # download, so a failed download leaves it running. Uploads use
    # pod-*.backblaze.com and are unaffected. Remove when moving to v10.
    extra_hosts:
      - "f000.backblazeb2.com:127.0.0.1"
    ports:
      - 5800:5800/tcp
    volumes:
      - /opt/docker/backblaze-personal-wine/backblaze_data:/config
      # Must be /drive_<letter>: startapp.sh only registers those with Wine as
      # fixed disks ("d:"="hd" under HKLM\Software\Wine\Drives). The old
      # /storage mount relied on a hand-made 2023 dosdevices symlink that
      # Wine 11 never registers, so Backblaze stopped seeing D: after
      # 2026-05-21 and expired the whole /Data backup ("drive has not been
      # seen in 30 days"). startapp.sh replaces that symlink on each start.
      # /Data/.bzvol (Backblaze's volume id, v0019145e...) must be owned by
      # USER_ID (1006:100); it was still 1000-owned from the 2023 install and
      # unreadable after USER_ID moved off 1000 on 2026-06-04.
      - /Data:/drive_d
    networks:
      - backblaze-personal-wine
    logging: *default-logging
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.watch.digest: "true"
      # The image runs the mutable `ubuntu22` tag, so only its digest is
      # tracked; the release link has no version to template in.
      wud.tag.include: '^ubuntu22$$'
      wud.link.template: "https://github.com/JonathanTreffler/backblaze-personal-wine-container/releases"
      wud.display.name: "Blackblaze"
      wud.display.icon: "sh-backblaze"

  # Publishes Backblaze's own status files as Prometheus metrics via
  # node-exporter's textfile collector (--collector.textfile.directory in
  # grafana-prometheus). Grafana alerts on them; the key one is D:'s
  # selected-file count, which sat at 0 from May to September unnoticed.
  backblaze-exporter:
    image: *busybox-version
    container_name: backblaze-exporter
    ipc: private
    restart: unless-stopped
    read_only: true
    network_mode: none
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32M
    volumes:
      - /opt/docker/backblaze-personal-wine/backblaze_data/wine/drive_c/ProgramData/Backblaze/bzdata:/bzdata:ro
      - /opt/docker/node-exporter/textfile:/textfile
    command:
      - sh
      - -c
      - |
          B=/bzdata; R=$$B/bzreports; T=/textfile/backblaze.prom
          # m NAME VALUE: emit only when VALUE is a number, so a missing file drops one
          # series instead of breaking the whole file for node-exporter.
          m() { case "$$2" in ''|*[!0-9]*) ;; *) echo "$$1 $$2" ;; esac; }
          attr() { sed -n "s/.* $$1=\"\([0-9]*\)\".*/\1/p" | head -1; }
          while :; do
            {
              m backblaze_heartbeat_timestamp_seconds "$$(tr -dc 0-9 < $$R/bzserv_heartbeat.txt | sed 's/...$$//')"
              m backblaze_last_backup_completed_timestamp_seconds "$$(tr -d '\r' < $$R/bzstat_lastbackupcompleted.xml | attr gmt_millis | sed 's/...$$//')"
              m backblaze_last_upload_timestamp_seconds "$$(stat -c %Y "$$(ls -t $$B/bzbackup/bzdatacenter/bz_done_*.dat | head -1)")"
              tr -d '\r' < $$B/bzinfo.xml | sed -n 's/.*bzVolumeGuid="\([^"]*\)" mountPointPath="\([A-Za-z]\):.*/\1 \2/p' |
              while read g d; do
                d=$$(echo "$$d" | tr A-Z a-z)
                t=$$(tr -d '\r' < $$R/bzstat_totalbackup.xml | grep "\"$$g\"")
                r=$$(tr -d '\r' < $$R/bzstat_remainingbackup.xml | grep "\"$$g\"")
                m "backblaze_selected_files{drive=\"$$d\"}" "$$(echo "$$t" | attr pervol_sel_for_backup_numfiles)"
                m "backblaze_selected_bytes{drive=\"$$d\"}" "$$(echo "$$t" | attr pervol_sel_for_backup_numbytes)"
                m "backblaze_remaining_files{drive=\"$$d\"}" "$$(echo "$$r" | attr pervol_remaining_files_numfiles)"
                m "backblaze_remaining_bytes{drive=\"$$d\"}" "$$(echo "$$r" | attr pervol_remaining_files_numbytes)"
              done
            } > $$T.tmp && mv $$T.tmp $$T
            sleep 300
          done
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$(find /textfile/backblaze.prom -mmin -15)\" ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: "https://busybox.net/"
      wud.display.name: "Backblaze exporter (busybox)"
      wud.display.icon: "sh-backblaze"

networks:
  backblaze-personal-wine:
    name: backblaze-personal-wine
    driver: bridge
    external: false

x-versions:
  backblaze: &backblaze-version "tessypowder/backblaze-personal-wine:ubuntu22"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  backblaze-personal-wine:
    image: *backblaze-version
    container_name: backblaze-personal-wine
    hostname: backblaze-personal-wine
    ipc: private
    restart: unless-stopped
    working_dir: /tmp
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
      - DAC_OVERRIDE
      - FSETID
      - FOWNER
      - MKNOD
      - KILL
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    # 16G, not 10G: the cgroup OOM killer took bztransmit64.exe at 10.26 GB on
    # 2026-09-22, having taken it at 6.08 GB on 2026-09-17 against a ~4.2 GB
    # steady state. The peak tracks the size of the backup set, not the volume
    # of a single run: bztransmit loads the whole file index into RAM every
    # time, and that set is now 3,386,727 file ids across 278 bz_done_ files,
    # ~4.0 GB of bzdata/bzbackup/bzdatacenter on disk. Expect to revisit this
    # as the set grows; trimming it with exclude rules is the real fix.
    #
    # Backups do recover on their own: bztransmit is transient by design (runs
    # a sync, writes its stats, releases a four-hour lock, exits), so the next
    # scheduled run picks up — verified 2026-09-18, "very successful", 7 vault
    # uploads, zero failures. The cost of an OOM is the aborted run's wasted
    # work, not a stalled backup. Do not add bztransmit to the healthcheck for
    # this reason; bzserv.exe is the correct persistent process to probe.
    mem_limit: 16G
    command: ['/init']
    environment:
      USER_ID: "${DOCKER_PUID}"
      GROUP_ID: "${DOCKER_PGID}"
      UMASK: "0022"
      LANG: "en_GB.UTF-8"
      KEEP_APP_RUNNING: "1"
      APP_NICENESS: "1"
      CONTAINER_DEBUG: "0"
      DISPLAY_WIDTH: "900"
      DISPLAY_HEIGHT: "700"
      WEB_LISTENING_PORT: "5800"
      VNC_LISTENING_PORT: "5900"
      VNC_PASSWORD: ""
    healthcheck:
      # Unhealthy -> autoheal restarts the container. Fails when bzserv (the
      # backup service) isn't running, e.g. after the client's own auto-update
      # stops it; when its heartbeat is >30 min old (hung; it normally updates
      # every <=10 min); or when /Data isn't mounted (no .bzvol marker).
      # Don't write the service's exe name literally here, or pgrep -f matches
      # this check's own shell and always passes.
      test:
        - CMD-SHELL
        - >-
          pgrep -f '[b]zserv[.]exe' >/dev/null || { echo 'bzserv not running'; exit 1; };
          [ -n "$$(find /config/wine/drive_c/ProgramData/Backblaze/bzdata/bzreports/bzserv_heartbeat.txt -mmin -30)" ] || { echo 'bzserv heartbeat stale'; exit 1; };
          [ -f /drive_d/.bzvol/bzvol_id.xml ] || { echo '/Data not mounted'; exit 1; }
      interval: 60s
      timeout: 10s
      retries: 3
      # Wine + the service take a few minutes to come up after a restart.
      start_period: 600s
    ports:
      - 5800:5800/tcp
    volumes:
      - /opt/docker/backblaze-personal-wine/backblaze_data:/config
      # Must be /drive_<letter>: startapp.sh only registers those with Wine as
      # fixed disks ("d:"="hd" under HKLM\Software\Wine\Drives). The old
      # /storage mount relied on a hand-made 2023 dosdevices symlink that
      # Wine 11 never registers, so Backblaze stopped seeing D: after
      # 2026-05-21 and expired the whole /Data backup ("drive has not been
      # seen in 30 days"). startapp.sh replaces that symlink on each start.
      # /Data/.bzvol (Backblaze's volume id, v0019145e...) must be owned by
      # USER_ID (1003); it was still 1000-owned from the 2023 install and
      # unreadable after USER_ID moved to DOCKER_PUID on 2026-06-04.
      - /Data:/drive_d
    networks:
      - backblaze-personal-wine
    logging: *default-logging
    labels:
      autoheal: "true"
      wud.watch: "true"
      wud.watch.digest: "true"
      # The image runs the mutable `ubuntu22` tag, so only its digest is
      # tracked; the release link has no version to template in.
      wud.tag.include: '^ubuntu22$$'
      wud.link.template: "https://github.com/JonathanTreffler/backblaze-personal-wine-container/releases"
      wud.display.name: "Blackblaze"
      wud.display.icon: "sh-backblaze"

networks:
  backblaze-personal-wine:
    name: backblaze-personal-wine
    driver: bridge
    external: false

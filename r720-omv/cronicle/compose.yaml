x-versions:
  cronicle: &cronicle-version "peterbuga/cronicle-docker:0.9.134"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

name: cronicle

services:
  cronicle:
    image: *cronicle-version
    container_name: cronicle
    hostname: cronicle
    ipc: private
    restart: unless-stopped
    working_dir: /opt/cronicle
#    entrypoint:
#      - docker-entrypoint.sh
#    command: ['node','bin/docker-entrypoint.js']
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Runs as the Komodo user, not root. /entrypoint.sh only chowns and su's
    # inside its first-run setup branch (both lines are commented out upstream
    # anyway) and data/.setup_done has existed since 2026-08-19, so nothing in
    # the boot path needs uid 0. The cap_add block that used to sit here was
    # dropped with it: CHOWN + DAC_OVERRIDE + SETUID are granted to the initial
    # process whatever its uid, so keeping them would have handed this user back
    # the root-equivalent filesystem access the change is meant to remove.
    # Requires cronicle_data/ and cronicle_logs/ to be owned by
    # ${DOCKER_PUID}:${DOCKER_PGID} - 7480 files were still root:root
    # from the years this ran as uid 0, and were chowned on 2026-09-21.
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 512M
    environment:
      CRONICLE_color: "1"
      CRONICLE_echo: "1"
      CRONICLE_foreground: "1"
      CRONICLE_base_app_url: "http://10.10.1.13:3012"
      CRONICLE_secret_key: "${CRONICLE_SECRET_KEY}"
      # pfsense-backup.sh: encrypted router config -> /Data/IT (offsite).
      # pfSense keeps revisions only on its own VM.
      PFSENSE_HOST: "10.10.0.1"
      PFSENSE_USER: "${PFSENSE_BACKUP_USER}"
      PFSENSE_PASS: "${PFSENSE_BACKUP_PASS}"
      PFSENSE_BACKUP_ENC: "${PFSENSE_BACKUP_ENC}"
      PFSENSE_BACKUP_DIR: "/pfsense-backups"
      PFSENSE_BACKUP_KEEP: "30"
      # firefly_import_status also builds this month's spent/earned/bills rows
      # for the Firefly III tile. It has to happen here rather than in a
      # Homepage customapi URL because /api/v1/summary/basic REQUIRES start+end
      # scoped to the current month and Homepage has no date templating, so a
      # hardcoded URL would freeze on the month it was written in. The two PATs
      # are existing Komodo variables (same ones the data importers use); the
      # job degrades to empty summary rows without them rather than failing.
      # Not on the fireflyiii network, hence the published port.
      FIREFLY_URL: "http://10.10.1.13:4747"
      FIREFLY_TOKEN_MICHAL: "${FIREFLYIII_MICHAL_ACCESS_TOKEN}"
      FIREFLY_TOKEN_PAULINA: "${FIREFLYIII_PAULINA_ACCESS_TOKEN}"
      # monica_upcoming builds the next birthdays/anniversaries for the Monica
      # tile. Monica has no Homepage widget and no endpoint that returns a flat
      # upcoming list, so the job walks /api/reminders and works out each next
      # occurrence itself. Not on the monica network, hence the published port.
      # MONICA_TOKEN is a Passport personal access token for the michal user;
      # both boards read the one file because both Monica users share account 1
      # and therefore see the same contacts. Passport hardcodes a ONE YEAR
      # lifetime, so this token dies 2027-09-21 and the job then fails loudly.
      MONICA_URL: "http://10.10.1.13:5435"
      MONICA_TOKEN: "${MONICA_HOMEPAGE_TOKEN}"
      # nextcloud_calendar publishes each board's Nextcloud calendar as a plain
      # .ics the Homepage calendar widget can read. The widget's `ical`
      # integration has no auth fields and sends no Authorization header, so the
      # authenticated CalDAV fetch has to happen here.
      #
      # Calendars are per-user - unlike Monica, where both boards share
      # account 1 and one file serves both - so every owner is fetched as
      # ITSELF, with its own app password. Deliberately not via Nextcloud
      # calendar sharing: a board should not break because someone revoked a
      # share, and neither of them should have to share a calendar with the
      # other just to see it on their own dashboard. These are dedicated
      # "Homepage calendar tile" app passwords, revocable per user under
      # Settings -> Security without touching vdirsyncer's separate one.
      #
      # <owner>/<calendar-uri>/<output-file>, comma separated. Adding a user is
      # one more variable plus one more entry here.
      NEXTCLOUD_URL: "http://10.10.1.13:1357"
      NEXTCLOUD_CALDAV_PASSWORD_MICHAL: "${NEXTCLOUD_CALDAV_PASSWORD_MICHAL}"
      NEXTCLOUD_CALDAV_PASSWORD_PAULINA: "${NEXTCLOUD_CALDAV_PASSWORD_PAULINA}"
      NEXTCLOUD_CALENDARS: >-
        michal/personal/calendar_michal.ics,
        paulina/personal/calendar_paulina.ics
      # pricebuddy_deals ranks the tracked products for the PriceBuddy tile.
      # The ranking is PriceBuddy's own deal score, which lives in the
      # product's insights_cache - hidden on the model, so absent from the
      # list endpoint and only reachable one product at a time through
      # /api/products/{id}?include=insights. Homepage's customapi is one URL
      # per widget and cannot rank or join, hence the job.
      #
      # Reached over the pricebuddy network rather than a published port: that
      # stack deliberately publishes none, so the app stays behind Traefik's
      # TLS and secHeaders instead of also answering :80 in the clear on the
      # LAN. Joining the network is what makes `http://pricebuddy` resolvable.
      #
      # Accounts are separate, like the calendars above and unlike Monica:
      # pricebuddy is genuinely multi-user and every query it runs is scoped
      # with `where('user_id', auth()->id())`, so each owner is fetched as
      # ITSELF and gets its own file. Neither board shows the other's shopping
      # list, and a dead token costs only that one tile.
      #
      # The tokens are Sanctum keys minted under Settings -> API Keys, each
      # scoped to product:pagination and product:detail only - they can read
      # that account's catalogue and nothing else. Revocable there per user.
      #
      # <owner>/<output-file>, comma separated. Adding an account is one more
      # token variable plus one more entry here.
      PRICEBUDDY_URL: "http://pricebuddy:80"
      PRICEBUDDY_TOKEN_MICHAL: "${PRICEBUDDY_TOKEN_MICHAL}"
      PRICEBUDDY_TOKEN_PAULINA: "${PRICEBUDDY_TOKEN_PAULINA}"
      PRICEBUDDY_ACCOUNTS: >-
        michal/pricebuddy_deals_michal.json,
        paulina/pricebuddy_deals_paulina.json
      # backblaze_status turns the Backblaze client's on-disk state into the
      # JSON its Homepage tile reads. Backblaze Personal has no API at all -
      # the Wine client keeps everything in small XML and text files under
      # bzdata, which is why this reads a read-only bind mount rather than a
      # URL, and why there is no token here to leak.
      #
      # It reports ONE VOLUME. bzdata carries two: C: is Wine's own drive_c
      # (~4,500 files, 1.3 GB) and D: is /Data, the reason the backup exists.
      # Backblaze's combined <totals> line stays comfortably non-zero when D:
      # drops out entirely, which is how D: sat unbacked-up from May to
      # 2026-09-23 with nothing showing it. Per volume that failure reads as
      # "0 files" and the tile turns red.
      BACKBLAZE_DATA: "/bzdata"
      BACKBLAZE_VOLUME: "D:"
    ports:
      - 3012:3012/tcp
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /opt/docker/cronicle/cronicle_data:/opt/cronicle/data
      - /opt/docker/cronicle/cronicle_logs:/opt/cronicle/logs
      - /opt/docker/cronicle/cronicle_plugins:/opt/cronicle/plugins
      # config.json sets "queue_dir": "queue" - a RELATIVE path, so Cronicle
      # mkdir's /opt/cronicle/queue inside the image on boot. As root that
      # silently worked; as ${DOCKER_PUID} it is EACCES and the engine aborts
      # with "FATAL ERROR: Queue directory could not be created". This is what
      # the stack's old "cant be run as user" note was actually about.
      - /opt/docker/cronicle/cronicle_queue:/opt/cronicle/queue
      - /Data/IT/pfsense-backups:/pfsense-backups
      # backblaze_status reads this; :ro because nothing here should ever write
      # to another app's live state, and the job only needs bzreports/,
      # bzfilelists/ and bzvolumes.xml. Owned by the same uid:gid this
      # container runs as, so no permission juggling.
      - /opt/docker/backblaze-personal-wine/backblaze_data/wine/drive_c/ProgramData/Backblaze/bzdata:/bzdata:ro
      # firefly_import_status, monica_upcoming, nextcloud_calendar,
      # pricebuddy_deals and backblaze_status write their status documents
      # here; the homepage-selector nginx serves those files read-only so the
      # Homepage boards can render them. Cronicle's REST API cannot filter
      # history by event and get_master_state has no timestamps, so the firefly
      # job reads the per-event history out of the store instead.
      - /opt/docker/homepage/status:/status
      - /etc/localtime:/etc/localtime:ro
    networks:
      - cronicle
      # Egress only - no router, no labels, nothing on the other side depends
      # on this. Owned by the pricebuddy stack, so on a cold start that one
      # has to have been deployed first for this to resolve.
      - pricebuddy
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v?\d+\.\d+\.\d+$$'
      wud.link.template: "https://github.com/jhuckaby/Cronicle/releases/tag/v$${major}.$${minor}.$${patch}"
      wud.display.name: "Cronicle"
      wud.display.icon: "sh:cronicle"

networks:
  cronicle:
    name: cronicle
    driver: bridge
  pricebuddy:
    external: true

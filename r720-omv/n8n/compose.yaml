x-versions:
  n8n: &n8n-version "n8nio/n8n:2.36.6"
  n8n-mcp: &n8n-mcp-version "ghcr.io/czlonkowski/n8n-mcp:2.74.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n:
    image: *n8n-version
    container_name: n8n
    hostname: n8n
    ipc: private
    restart: unless-stopped
    user: ${DOCKER_PUID}:${DOCKER_PGID}
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1G
    environment:
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_HOST: "10.10.1.13"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: "n8n"
      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASS}"
      TZ: "${TZ}"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      DEBUG: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_USER_FOLDER: "/home/node/.n8n"
      N8N_RUNNERS_ENABLED: "true"
      N8N_LICENSE_ACTIVATION_KEY: ""
      N8N_LICENSE_AUTO_RENEWAL: "false"
      N8N_METRICS: 'true'
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: 'true'
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: 'true'
      N8N_PROTOCOL: "https"
      N8N_HOST: "auto.${DOMAIN_NAME}"
      N8N_EDITOR_BASE_URL: "https://auto.${DOMAIN_NAME}"
      WEBHOOK_URL: "https://auto.${DOMAIN_NAME}"
      WEBHOOK_TUNNEL_URL: "https://auto.${DOMAIN_NAME}"
      N8N_TRUST_PROXY_HEADERS: "true"
    healthcheck:
      test: wget --spider http://127.0.0.1:5678/healthz > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m
      start_interval: 2s
    ports:
      - 5678:5678/tcp
    volumes:
      - /opt/docker/n8n/n8n_data:/home/node/.n8n
    networks:
      - n8n
      - traefik
      - cloudflared
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n.rule: "Host(`auto.${DOMAIN_NAME}`)"
      traefik.http.routers.n8n.entrypoints: "websecure"
      traefik.http.routers.n8n.tls: "true"
      traefik.http.routers.n8n.tls.certresolver: "letsencrypt"
      traefik.http.routers.n8n.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.n8n.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.n8n.middlewares: "secHeaders@file"
      traefik.http.services.n8n.loadbalancer.server.port: "5678"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "n8n"
      wud.display.icon: "sh:n8n"
      wud.link.template: "https://github.com/n8n-io/n8n/releases/tag/n8n%40$${major}.$${minor}.$${patch}"
      homepage.group: "Infrastructure"
      homepage.name: "n8n"
      homepage.description: "Workflow automation"
      homepage.icon: "n8n.png"
      homepage.href: "https://auto.${DOMAIN_NAME}"
      homepage.siteMonitor: "https://auto.${DOMAIN_NAME}"

  n8n-mcp:
    image: *n8n-mcp-version
    container_name: n8n-mcp
    hostname: n8n-mcp
    ipc: private
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 512M
    environment:
      TZ: "${TZ}"
      MCP_MODE: "http"
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "production"
      LOG_LEVEL: "info"
      # Mandatory in http mode - the entrypoint exits if it is unset. Minimum
      # 32 characters; every request to /mcp must carry it as a bearer token.
      AUTH_TOKEN: "${N8N_MCP_AUTH_TOKEN}"
      # Same compose network, so the API key never leaves the host and Traefik
      # is not in the path. Without these two the server still answers node
      # documentation queries but loses the 16 workflow-management tools.
      N8N_API_URL: "http://n8n:5678"
      N8N_API_KEY: "${N8N_MCP_API_KEY}"
      # Anonymous usage statistics are ON by default upstream.
      N8N_MCP_TELEMETRY_DISABLED: "true"
      HOME: "/tmp"
    tmpfs:
      - /tmp
    # No mount on /app/data, deliberately. The image bakes in the node-reference
    # SQLite database, and the runtime image cannot rebuild it (it ships no n8n
    # packages) - it can only seed an empty volume once, from a pristine copy.
    # A persisted volume would therefore pin the node data at whatever version
    # first created it and go stale on every image bump. With no mount the
    # database always tracks the image. It holds no user state, so there is
    # nothing to persist. It is also a rollback-journal (not WAL) database, so
    # SQLite opens it fine on the read-only filesystem.
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      # MCP-server port pool (513x); 5133-5137 taken. NOT exposed via Traefik.
      - 5138:3000/tcp
    networks:
      - n8n
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "n8n MCP"
      wud.display.icon: "sh:n8n"
      wud.link.template: "https://github.com/czlonkowski/n8n-mcp/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  n8n:
    name: n8n
    driver: bridge
    external: false
  traefik:
    external: true
  cloudflared:
    external: true

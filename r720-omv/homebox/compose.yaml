x-versions:
  homebox: &homebox-version "ghcr.io/sysadminsmedia/homebox:0.26.2"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  homebox:
    image: *homebox-version
    container_name: homebox
    hostname: homebox
    ipc: private
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Static Go binary, binds an unprivileged port (7745) and only writes to the
    # /data bind mount — no caps needed. Ensure
    # /opt/docker/homebox/homebox/data is owned by DOCKER_PUID:DOCKER_PGID.
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    mem_limit: 1G
    environment:
      TZ: "${TZ}"
      HBOX_MODE: "production"
      HBOX_WEB_PORT: "7745"
      # Max attachment upload in MB (default 10 is far too small for receipts/manuals).
      HBOX_WEB_MAX_UPLOAD_SIZE: "512"
      HBOX_LOG_LEVEL: "info"
      HBOX_LOG_FORMAT: "json"
      # Stays false: OIDC login auto-provisions the user and their group and
      # never consults this flag (LoginOIDC -> registerOIDCUser), so SSO is the
      # only way an account gets created. Local password signup stays shut.
      HBOX_OPTIONS_ALLOW_REGISTRATION: "false"
      HBOX_OPTIONS_AUTO_INCREMENT_ASSET_ID: "true"
      # Behind Traefik: honour X-Forwarded-Proto/-Host so generated absolute
      # URLs stay https. HBOX_OPTIONS_HOSTNAME is a BARE host — the code does
      # scheme + "://" + hostname, so a full URL here would double the scheme.
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_OPTIONS_HOSTNAME: "inventory.${DOMAIN_NAME}"
      # WUD already tracks releases; no phone-home / analytics.
      HBOX_OPTIONS_GITHUB_RELEASE_CHECK: "false"
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      HBOX_THUMBNAIL_ENABLED: "true"
      # REQUIRED: the binary refuses to start if this is < 32 bytes. HMAC pepper
      # for stored API-key hashes. openssl rand -base64 48. Must stay stable —
      # rotating it invalidates every issued API key.
      HBOX_AUTH_API_KEY_PEPPER: "${HOMEBOX_API_KEY_PEPPER}"
      HBOX_AUTH_RATE_LIMIT_ENABLED: "true"
      # --- SSO against Authelia -------------------------------------------
      # First login through here creates the account + its "Home" group, which
      # is how the instance gets bootstrapped at all.
      HBOX_OIDC_ENABLED: "true"
      HBOX_OIDC_ISSUER_URL: "https://id.${DOMAIN_NAME}"
      HBOX_OIDC_CLIENT_ID: "homebox"
      HBOX_OIDC_CLIENT_SECRET: "${HOMEBOX_OIDC_CLIENT_SECRET}"
      HBOX_OIDC_SCOPE: "openid profile email"
      HBOX_OIDC_BUTTON_TEXT: "Sign in with Authelia"
      # Flip to "true" once SSO is confirmed working — it then skips Homebox's
      # own login page entirely. Left false for the first deploy so a broken
      # OIDC config still leaves a reachable page to read the error on.
      HBOX_OIDC_AUTO_REDIRECT: "false"
    # Homebox tries OIDC discovery exactly 4 times over ~3s at boot; if
    # Authelia isn't answering yet it logs "failed to initialize OIDC
    # provider at startup", registers only the "local" provider and NEVER
    # retries — every SSO click then 500s with
    # {"error":"OIDC provider not available"} until the container is
    # restarted by hand. Hit on 2026-08-16 (connection refused) and
    # 2026-08-25 (Traefik 404 — no id.${DOMAIN_NAME} router yet), both
    # host-wide restarts where Traefik/Authelia came up after Homebox.
    # So block on discovery first (120s cap), then exec the real entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        disco="$${HBOX_OIDC_ISSUER_URL}/.well-known/openid-configuration"
        i=0
        until wget -q -T 5 -O /dev/null "$$disco"; do
          i=$$((i + 1))
          if [ "$$i" -ge 40 ]; then
            echo "homebox: OIDC discovery still down after 120s" >&2
            break
          fi
          sleep 3
        done
        exec /app/api "$$@"
      # Becomes $0 for the wrapper, so the image's own CMD (/data/config.yml)
      # lands in "$@" and the config path is never hardcoded here.
      - homebox-entrypoint
    healthcheck:
      # Two signals: the app answers, AND the OIDC provider actually came up.
      # /api/v1/status is no use for the second — its oidc.enabled field
      # mirrors config, not init state, so it reads 200/enabled with a dead
      # provider. /users/login/oidc is the real tell: 302 when live, 500 when
      # not. It builds that redirect from the CACHED discovery document and
      # makes no call to Authelia, and --max-redirect=0 stops wget chasing it,
      # so the probe stays local — an Authelia outage does NOT flip Homebox
      # unhealthy. Assumes HBOX_OIDC_ENABLED stays "true"; if OIDC is ever
      # turned off, drop the second clause or this fails forever.
      test:
        - CMD-SHELL
        - >-
          wget -q -T 5 -O /dev/null http://127.0.0.1:7745/api/v1/status &&
          wget -q -T 5 --max-redirect=0 -S -O /dev/null
          http://127.0.0.1:7745/api/v1/users/login/oidc 2>&1 | grep -q ' 302 '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - /opt/docker/homebox/homebox/data:/data
      - /etc/localtime:/etc/localtime:ro
    # OIDC discovery runs against the public issuer hostname from inside the
    # container; pin it to the host so it doesn't depend on external DNS
    # hairpinning. Same pin WUD needs — without it discovery fails at boot.
    extra_hosts:
      - "id.${DOMAIN_NAME}:10.10.1.13"
    networks:
      - homebox
      - traefik
      # Joined so the gateway-spawned homebox-mcp container can reach the
      # API at http://homebox:7745 by name (gateway spawns servers here).
      - mcp-gateway
    logging: *default-logging
    labels:
      # Watched by the autoheal stack: if the healthcheck above goes red —
      # including the "started before Authelia and lost OIDC" case the
      # entrypoint wait is there to prevent — autoheal restarts the container,
      # which is the only thing that re-runs initOIDCProvider().
      autoheal: "true"
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.homebox.rule: "Host(`inventory.${DOMAIN_NAME}`)"
      traefik.http.routers.homebox.entrypoints: "websecure"
      traefik.http.routers.homebox.tls: "true"
      traefik.http.routers.homebox.tls.certresolver: "letsencrypt"
      traefik.http.routers.homebox.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.homebox.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.homebox.middlewares: "secHeaders@file,authelia-auth@docker"
      traefik.http.services.homebox.loadbalancer.server.port: "7745"
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.display.name: "Homebox"
      wud.display.icon: "sh:homebox"
      wud.link.template: "https://github.com/sysadminsmedia/homebox/releases/tag/v$${major}.$${minor}.$${patch}"

networks:
  homebox:
    name: homebox
    driver: bridge
    external: false
  traefik:
    external: true
  mcp-gateway:
    name: mcp-gateway
    external: true

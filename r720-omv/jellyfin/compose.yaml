x-versions:
  # LSIO's bare-version alias (`10.11.11`) only gets published for three-part
  # upstream versions, and 12.0 dropped the patch component — there is no
  # `linuxserver/jellyfin:12.0` tag to pin. Use the full build tag. It is also
  # the immutable one: the bare alias floats across ls builds.
  jellyfin: &jellyfin-version "linuxserver/jellyfin:12.0ubu2604-ls48"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  jellyfin:
    image: *jellyfin-version
    container_name: jellyfin
    hostname: jellyfin
    ipc: private
    restart: unless-stopped
    entrypoint: ['/init']
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 8G
    deploy:
      resources:
        reservations:
          devices:
            # Pin NVENC transcoding to GPU 0 (Tesla T4), shared with Frigate.
            # Leave the RTX 5000 (GPU 1) dedicated to Ollama.
            - driver: nvidia
              device_ids: ["GPU-993cb9a5-03ef-b0c5-0a88-db2d62ecd361"]
              # `gpu`, not `video`: dockerd builds NVIDIA_DRIVER_CAPABILITIES
              # from this list and appends it *after* the image env, so
              # `[video]` was silently replacing LSIO's `compute,video,utility`
              # and stripping CUDA. Tone mapping is CUDA-only on Linux, so it
              # cannot have been working. `gpu` is not an NVIDIA capability, so
              # dockerd sets nothing and the image default survives.
              capabilities: [gpu]
    environment:
      TZ: "${TZ}"
      PUID: "${MEDIA_PUID}"
      PGID: "${MEDIA_PGID}"
      JELLYFIN_PublishedServerUrl: "https://jf.${DOMAIN_NAME}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 3m
      timeout: 30s
      retries: 3
    ports:
      - 1900:1900/udp
      - 7359:7359/udp
      - 8096:8096/tcp
      - 8920:8920/tcp
    tmpfs:
      - /transcode:size=64G,mode=1777
    volumes:
      - /opt/docker/jellyfin/jellyfin_config:/config
      - /Data/TVShows:/tv
      - /Data/Anime:/anime
      - /Data/CartoonMovies:/cartoon_movies
      - /Data/Cartoons:/cartoons
      - /Data/DocumentaryMovies:/documentary_movies
      - /Data/DocumentaryShows:/documentary_shows
      - /Data/Movies:/movies
      - /Data/IT/pinchflat_downloads:/youtube
      # TVHeadend's DVR output. Read-only on purpose: TVH owns recording and
      # deletion (it is the only side that knows about EPG-triggered timers and
      # in-progress recordings), Jellyfin just presents the finished files.
      - /Data/LiveTV:/livetv:ro
    networks:
      - jellyfin
      - traefik
    logging: *default-logging
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`jf.${DOMAIN_NAME}`)"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "letsencrypt"
      traefik.http.routers.jellyfin.tls.domains[0].main: "${DOMAIN_NAME}"
      traefik.http.routers.jellyfin.tls.domains[0].sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.jellyfin.middlewares: "secHeaders@file,jellyfin-mw"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      traefik.http.middlewares.jellyfin-mw.headers.SSLRedirect: "true"
      traefik.http.middlewares.jellyfin-mw.headers.STSIncludeSubdomains: "true"
      traefik.http.middlewares.jellyfin-mw.headers.STSPreload: "true"
      traefik.http.middlewares.jellyfin-mw.headers.customrequestheaders.X-Forwarded-Proto: "https"
      wud.watch: "true"
      wud.display.name: "Jellyfin Server"
      wud.display.icon: "sh:jellyfin"
      # 12.0 dropped the upstream patch component and LSIO tags the image
      # `12.0ubu2604-ls48`, so the old three-part regex matched nothing and WUD
      # went silent — it never reported 12.0 at all. Coerce
      # <maj>.<min>ubu<rel>-ls<rev> -> <maj>.<min>.<rev> so the LSIO build
      # counter orders as the semver patch.
      wud.tag.include: '^\d+\.\d+ubu\d+-ls\d+$$'
      wud.tag.transform: '^(\d+)\.(\d+)ubu\d+-ls(\d+)$$ => $$1.$$2.$$3'
      # Upstream tags releases `v12.0` now, so major.minor only. $${patch} is
      # the LSIO build counter here and would 404.
      wud.link.template: "https://github.com/jellyfin/jellyfin/releases/tag/v$${major}.$${minor}"
networks:
  jellyfin:
    name: jellyfin
    driver: bridge
    external: false
  traefik:
    external: true

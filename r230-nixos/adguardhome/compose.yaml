x-versions:
  adguardhome: &adguardhome-version "adguard/adguardhome:v1.0.0"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  adguardhome:
    image: *adguardhome-version
    container_name: adguardhome
    hostname: adguardhome
    ipc: private
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE  # bind privileged DNS port 53
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    environment:
      TZ: "${TZ}"
      # Go GC soft limit below mem_limit; the 12h filter refresh briefly
      # holds old+new engines (~3M rules) and was OOM-killed at 1G
      GOMEMLIMIT: "1800MiB"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    healthcheck:
      test: ["CMD-SHELL", "nslookup -timeout=2 cloudflare.com 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /opt/docker/adguardhome/adguardhome_work:/opt/adguardhome/work
      - /opt/docker/adguardhome/adguardhome_conf:/opt/adguardhome/conf
      - /etc/localtime:/etc/localtime:ro
    logging: *default-logging
    labels:
      wud.watch: "true"
      # Stable tags, held to the running minor series: since v1.0 a minor
      # release (v1.1, v1.2) may break compatibility, so read its notes and
      # bump the minor by hand.
      wud.tag.include: '^v$${major}\.$${minor}\.\d+$$'
      wud.display.name: "AdGuard Home"
      # ${original} is the full tag (v1.0.0). ${prerelease} is only the first
      # prerelease field, which cut beta links to .../v0.108.0-b.
      wud.link.changelog: 'https://github.com/AdguardTeam/AdGuardHome/releases/tag/$${original}'

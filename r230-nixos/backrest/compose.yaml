x-versions:
  backrest: &backrest-version "garethgeorge/backrest:v1.14.1-alpine"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Mirror of the r720-omv backrest stack for this host's own /opt/docker.
  # Deliberately simpler than r720's: none of the four stacks on r230
  # (adguardhome, ebusd, wud-socket-proxy, zigbee2mqtt) runs a database, so
  # there are no pre-backup dump hooks, and therefore no socket proxy and no
  # /dumps mount. Add both back here if a DB ever lands on this host.
  backrest:
    image: *backrest-version
    container_name: backrest
    hostname: backrest
    ipc: private
    restart: unless-stopped
    # Backup tool: runs as root with DAC_READ_SEARCH so it can READ every file
    # under /opt/docker regardless of owner/mode (0600 configs, service-owned
    # data) without the broader DAC_OVERRIDE write-bypass. cap_drop ALL keeps
    # the rest off.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    environment:
      TZ: "${TZ}"
      # Signal notification hook. r720 publishes signal-cli-rest-api on 3162,
      # but the `signal-rest-api` bridge the r720 backrest joins is host-local,
      # so this instance reaches it over the LAN instead. The hook script
      # configured in the Backrest UI must use this variable rather than the
      # internal `signal-rest-api` hostname it uses on r720.
      SIGNAL_API_URL: "http://10.10.1.13:3162"
      SIGNAL_PHONE_NUMBER: "${SIGNAL_PHONE_NUMBER}"
      SIGNAL_TECH_ID: "${SIGNAL_TECH_ID}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9898/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "9898:9898/tcp"
    volumes:
      # Backrest's own state (defaults baked into the image: BACKREST_DATA=/data,
      # BACKREST_CONFIG=/config/config.json, XDG_CACHE_HOME=/cache)
      - /opt/docker/backrest/config:/config
      - /opt/docker/backrest/data:/data
      - /opt/docker/backrest/cache:/cache
      # Backup SOURCE - this host's container bind-mount data, read-only.
      # Exclude /userdata/backrest in the Backrest plan, as r720 does.
      - /opt/docker:/userdata:ro
      # Restic repository destination - see the `repos` volume below. Docker
      # mounts r720's SMB share itself, so an unreachable share fails the
      # container rather than silently presenting an empty directory.
      - repos:/repos
      - /etc/localtime:/etc/localtime:ro
    networks:
      - backrest
    logging: *default-logging
    labels:
      wud.watch: "true"
      wud.tag.include: '^v\d+\.\d+\.\d+-alpine$$'
      wud.display.name: "Backrest (r230-nixos)"
      wud.display.icon: "sh:backrest"
      wud.link.template: "https://github.com/garethgeorge/backrest/releases/tag/v$${major}.$${minor}.$${patch}"

volumes:
  # The restic repository, on r720's [IT] SMB share (/Data/IT on that host).
  #
  # Docker mounts the share itself rather than relying on a host mount managed
  # outside this repo. That is deliberate: if the share is unreachable the
  # volume fails and the CONTAINER REFUSES TO START. A host bind mount fails
  # the other way -- Docker resolves bind sources at container start and later
  # mount events do not propagate into the namespace, so a mount that is not up
  # in time leaves /repos an empty local directory for the life of the
  # container. Backrest would then init a fresh repository on r230's root disk
  # and report healthy backups going nowhere near r720.
  #
  # device points at the repo subdirectory, not the share root, so /repos is
  # exactly the repository. cifs supports a path after the share name.
  #
  # Its own directory, NOT .../Docker_backups/backrest, which is r720's own
  # repo: two Backrest instances managing one restic repo collide on prune.
  #
  # An IP is required -- the kernel cifs module cannot resolve hostnames, and
  # there is no mount.cifs helper on this host to do it (Docker's local driver
  # calls mount(2) directly, which is why none is needed).
  #
  # uid/gid 0 because backrest runs as root; on-disk ownership on r720 is
  # decided by the SMB user, which is `backups` (valid_users on the [IT] share).
  repos:
    driver: local
    driver_opts:
      type: cifs
      device: "//10.10.1.13/IT/Docker_backups/backrest-r230"
      o: "username=${SMB_BACKUP_USER},password=${SMB_BACKUP_PASS},uid=0,gid=0,file_mode=0600,dir_mode=0700,vers=3.1.1"

networks:
  backrest:
    driver: bridge
    external: false
    name: backrest

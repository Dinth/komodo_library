##

# Kittygram ships no published image on any registry — upstream's compose.yaml
# builds from source — so the r720-omv/kittygram stack consumes this tag.
# Upstream is a rolling `main` with no releases and no tags, hence latest-only
# and no version tags; re-run this Build to update the stack.
#
# Known cosmetic defect: .gitattributes puts *.png and *.ico in Git LFS, and a
# plain clone leaves those as ~130-byte pointer files that the Dockerfile then
# COPYs verbatim. The favicon and logo will be broken until the build runs
# `git lfs pull`. CSS and every Lua source file are normal blobs, so the app
# itself is unaffected.
[[build]]
name = "kittygram"
tags = ["builds", "kittygram"]
description = "Local image for codeberg.org/irelephant/kittygram — privacy-friendly Instagram frontend, target of searxng's hostnames.replace."
[build.config]
builder = "r720-omv"
git_provider = "codeberg.org"
git_https = true
repo = "irelephant/kittygram"
branch = "main"
build_path = "."
dockerfile_path = "Dockerfile"
# Rebuild from scratch: Periphery runs a bare `docker build`, which would reuse
# the cached base image and every cached RUN layer (pip/apk/apt installs), so
# a scheduled rebuild would otherwise change nothing. See rebuild-local-images.
extra_args = ["--pull", "--no-cache"]
image_name = "kittygram"
auto_increment_version = false
include_latest_tag = true
include_version_tags = false
include_commit_tag = false
webhook_enabled = false

##

# Piped-Backend master rebuilt against NewPipe stable's extractor, because the
# published 1337kavin/piped image is stuck on a May fork that YouTube only
# serves 360p to. Unpinned by design: each build reads the extractor version
# from NewPipe master, so the weekly rebuild keeps it current. The Dockerfile
# carries the reasoning; the r720-omv/piped stack consumes piped-backend:latest.
# Retire this Build once upstream's image tracks TeamNewPipe again.
[[build]]
name = "piped-backend"
tags = ["builds", "piped"]
description = "Local image for TeamPiped/Piped-Backend master on NewPipe stable's extractor — restores full-quality YouTube streams."
[build.config]
builder = "r720-omv"
git_provider = "github.com"
git_account = "michal@gawronskikot.com"
git_https = true
repo = "Dinth/komodo_library"
branch = "main"
build_path = "r720-omv/piped/backend"
dockerfile_path = "Dockerfile"
# Rebuild from scratch: Periphery runs a bare `docker build`, which would reuse
# the cached base image and every cached RUN layer (pip/apk/apt installs), so
# a scheduled rebuild would otherwise change nothing. See rebuild-local-images.
extra_args = ["--pull", "--no-cache"]
image_name = "piped-backend"
auto_increment_version = false
include_latest_tag = true
include_version_tags = false
include_commit_tag = false
webhook_enabled = false

##

# Keeps every locally built image current. Nothing else does: no GitHub
# webhook reaches this LAN-only Komodo, and WUD cannot compare images that
# exist only on r720. With --pull --no-cache on each Build, a run picks up new
# base images, OS packages, unpinned dependencies and upstream source.
#
# Stages run in order and a failed stage stops the rest, so each image's
# redeploy sits right after its own build and piped-backend -- the one most
# likely to break (upstream API drift) -- goes last. A failed build leaves the
# previous image running; failure_alert reports it.
#
# The gateway spawns a fresh MCP container from the current :latest for every
# session; mcp-gateway is redeployed only to move its prune guards along.
[[procedure]]
name = "rebuild-local-images"
tags = ["builds"]
description = "Weekly from-scratch rebuild of every local image, then redeploys the stacks that run them."
[procedure.config]
schedule_format = "Cron"
schedule = "0 0 4 ? * SUN"
schedule_timezone = "Europe/London"
schedule_enabled = true
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Build MCP images and kittygram"
executions = [
  { execution.type = "RunBuild", execution.params.build = "mcpmqtt" },
  { execution.type = "RunBuild", execution.params.build = "mitmproxy-mcp" },
  { execution.type = "RunBuild", execution.params.build = "homebox-mcp" },
  { execution.type = "RunBuild", execution.params.build = "kittygram" },
]

[[procedure.config.stage]]
name = "Redeploy kittygram and MCP prune guards"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "kittygram" },
  # Re-points the *-guard containers at the new MCP images; the gateway
  # itself is digest-pinned, so compose leaves it running untouched.
  { execution.type = "DeployStack", execution.params.stack = "mcp-gateway" },
]

[[procedure.config.stage]]
name = "Build piped-backend"
executions = [
  { execution.type = "RunBuild", execution.params.build = "piped-backend" },
]

[[procedure.config.stage]]
name = "Redeploy piped"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "piped" },
]

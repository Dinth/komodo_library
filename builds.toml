##

# Kittygram ships no published image on any registry — upstream's compose.yaml
# builds from source — so the r720-omv/kittygram stack consumes this tag.
# Upstream is a rolling `main` with no releases and no tags, hence latest-only
# and no version tags; re-run this Build to update the stack.
#
# Known cosmetic defect: .gitattributes puts *.png and *.ico in Git LFS, and a
# plain clone leaves those as ~130-byte pointer files that the Dockerfile then
# COPYs verbatim. The favicon and logo will be broken until the build runs
# `git lfs pull`. CSS and every Lua source file are normal blobs, so the app
# itself is unaffected.
[[build]]
name = "kittygram"
tags = ["builds", "kittygram"]
description = "Local image for codeberg.org/irelephant/kittygram — privacy-friendly Instagram frontend, target of searxng's hostnames.replace."
[build.config]
builder = "r720-omv"
git_provider = "codeberg.org"
git_https = true
repo = "irelephant/kittygram"
branch = "main"
build_path = "."
dockerfile_path = "Dockerfile"
image_name = "kittygram"
auto_increment_version = false
include_latest_tag = true
include_version_tags = false
include_commit_tag = false
webhook_enabled = false
